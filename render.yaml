services:
  - type: web
    name: lumo
    runtime: node
    plan: starter          # Push braucht einen Server, der nicht einschlaeft
    region: frankfurt
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: ANTHROPIC_API_KEY
        sync: false        # von Hand im Render-Dashboard eintragen
      - key: VAPID_PUBLIC_KEY
        sync: false
      - key: VAPID_PRIVATE_KEY
        sync: false
      - key: VAPID_CONTACT
        sync: false
      - key: ACCESS_CODE
        sync: false
      - key: RETENTION_DAYS
        value: "30"
      - key: DATABASE_URL
        fromDatabase:
          name: lumo-db
          property: connectionString

databases:
  - name: lumo-db
    plan: basic-256mb
    region: frankfurt
