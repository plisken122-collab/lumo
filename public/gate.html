<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#384C9E">
<meta name="robots" content="noindex, nofollow">
<title>Diralo</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500&display=swap" rel="stylesheet">
<style>
  :root { --canvas:#E4E5E9; --surface:#fff; --ink:#20222B; --muted:#6C6F7E; --line:#D2D4DB; --mine:#384C9E; --danger:#9B2C25; }
  * { box-sizing:border-box; }
  body {
    margin:0; min-height:100dvh; background:var(--canvas); color:var(--ink);
    font-family:'DM Sans', system-ui, sans-serif; font-size:16px;
    display:flex; align-items:center; justify-content:center; padding:20px;
  }
  .card {
    background:var(--surface); border:1px solid var(--line); border-radius:18px;
    padding:26px 22px; width:100%; max-width:380px;
  }
  img.logo { display:block; height:40px; width:auto; margin-bottom:16px; }
  p { margin:0 0 20px; font-size:14.5px; color:var(--muted); line-height:1.5; }
  label { display:block; font-size:13px; color:var(--muted); margin-bottom:6px; }
  input {
    width:100%; font-family:inherit; font-size:16px; color:var(--ink);
    background:var(--surface); border:1px solid var(--line); border-radius:10px; padding:12px;
  }
  input:focus { outline:2px solid var(--ink); outline-offset:1px; }
  button {
    width:100%; margin-top:16px; border:none; cursor:pointer; font-family:inherit;
    background:var(--mine); color:#fff; border-radius:12px; padding:14px; font-size:16px; font-weight:500;
  }
  button:disabled { background:var(--line); cursor:default; }
  .err { color:var(--danger); font-size:13.5px; margin:12px 2px 0; min-height:18px; }
</style>
</head>
<body>
  <div class="card">
    <span class="brandline"><img src="/brand/logo-mark.svg" alt="" style="height:34px;vertical-align:middle"><span style="font-size:26px;font-weight:500;margin-left:9px;vertical-align:middle">Diralo</span></span>
    <p id="t-lead"></p>

    <label for="code" id="t-label"></label>
    <input id="code" type="password" autocomplete="current-password" autocapitalize="none" autocorrect="off">
    <button id="go"></button>
    <div class="err" id="err"></div>
  </div>

<script src="/i18n.js"></script>
<script>
const T = window.LUMO_T;
T.set((navigator.language || "en").replace("_", "-"));
document.documentElement.lang = T.get();
document.documentElement.dir = T.get().startsWith("ar") || T.get().startsWith("he") ? "rtl" : "ltr";
document.getElementById("t-lead").textContent = T.t("gateLead");
document.getElementById("t-label").textContent = T.t("gateLabel");

const code = document.getElementById("code");
const go = document.getElementById("go");
const err = document.getElementById("err");
go.textContent = T.t("gateGo");

async function submit() {
  const value = code.value.trim();
  if (!value) return;
  go.disabled = true;
  err.textContent = "";
  try {
    const res = await fetch("/api/gate", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ code: value }),
    });
    if (res.ok) {
      location.replace("/");
      return;
    }
    const data = await res.json().catch(() => ({}));
    err.textContent = T.t("gateWrong");
  } catch {
    err.textContent = T.t("gateOffline");
  }
  go.disabled = false;
  code.select();
}

go.onclick = submit;
code.addEventListener("keydown", (e) => { if (e.key === "Enter") submit(); });
code.focus();
</script>
  <p style="text-align:center;font-size:12.5px;margin-top:16px"><a href="/impressum" style="color:#6C6F7E">Impressum</a> &middot; <a href="/datenschutz" style="color:#6C6F7E">Datenschutz</a></p>
</body>
</html>
