/* --------------------------------------------------------------------
   Zum Startbildschirm hinzufuegen

   Der Punkt, an dem die meisten verlorengehen: Wer den Chat nur im
   Browser offen hat, kommt am naechsten Tag nicht zurueck - und ohne
   installierte App gibt es auch keine Benachrichtigungen.

   Auf Android gibt uns der Browser mit beforeinstallprompt einen echten
   Installationsknopf. Auf iPhones gibt es das nicht; dort bleibt nur der
   Hinweis, wo man tippen muss.
-------------------------------------------------------------------- */
let installEreignis = null;
const schonInstalliert = () =>
  window.matchMedia("(display-mode: standalone)").matches || window.navigator.standalone === true;
const PLAY_URL = "https://play.google.com/store/apps/details?id=app.diralo.twa";
/* Woher der Besucher kam (?von=facebook ...) - beim ersten Besuch gemerkt.
   Geht als Kennung mit in den Play Store; die Play Console zeigt dann,
   wie viele Installationen aus welcher Quelle kommen. */
let besuchsQuelle = new URLSearchParams(location.search).get("von");
try {
  if (besuchsQuelle && besuchsQuelle !== "android") localStorage.setItem("diralo-quelle", besuchsQuelle);
  else besuchsQuelle = localStorage.getItem("diralo-quelle");
} catch {}
const playMitQuelle = () => PLAY_URL + "&referrer=" + encodeURIComponent(
  "utm_source=" + String(besuchsQuelle || "website").replace(/[^a-z0-9_-]/gi, "").slice(0, 30) + "&utm_medium=website");
const istAndroid = () => /android/i.test(navigator.userAgent);
const istIos = () =>
  /iphone|ipad|ipod/i.test(navigator.userAgent) ||
  (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);

window.addEventListener("beforeinstallprompt", (e) => {
  e.preventDefault();          /* sonst zeigt Chrome seinen eigenen Balken */
  installEreignis = e;
  zeigeInstallBalken();
});

window.addEventListener("appinstalled", () => {
  $("installBar").classList.add("hide");
  try { localStorage.setItem("diralo-install", "fertig"); } catch {}
});

function installBalkenWeg(dauerhaft) {
  $("installBar").classList.add("hide");
  if (dauerhaft) { try { localStorage.setItem("diralo-install", "spaeter"); } catch {} }
}

/* Nach der ersten gesendeten Nachricht - Text wie Bild - einmal den
   Installationshinweis anbieten. Kurz verzoegert, damit er nicht abrupt
   ueber die gerade gesendete Nachricht springt. */
let beitragGesehen = false;
function installNachBeitrag() {
  if (beitragGesehen) return;
  beitragGesehen = true;
  setTimeout(zeigeInstallBalken, 1500);
}

function zeigeInstallBalken() {
  if (schonInstalliert()) return;
  if ($("chat").classList.contains("hide")) return;   /* erst im Chat */
  try { if (localStorage.getItem("diralo-install")) return; } catch {}
  if (!installEreignis && !istIos() && !istAndroid()) return; /* sonst nichts anzubieten */

  $("installTitle").textContent = T("installTitle");
  $("installLater").textContent = T("later");
  if (istAndroid()) {
    /* Android: die echte App aus Google Play statt der Web-Installation. */
    $("installGo").textContent = "Google Play";
    $("installGo").classList.remove("hide");
    $("installHint").classList.add("hide");
  } else if (installEreignis) {
    $("installGo").textContent = T("installBtn");
    $("installGo").classList.remove("hide");
    $("installHint").classList.add("hide");
  } else {
    /* iPhone: kein Knopf moeglich, nur der Weg ueber Teilen. */
    $("installGo").classList.add("hide");
    $("installHint").textContent = T("installIos");
    $("installHint").classList.remove("hide");
  }
  $("installBar").classList.remove("hide");
}

$("installLater").onclick = () => installBalkenWeg(true);
/* Google-Play-Knopf auf der Startseite: nicht auf iPhones und nicht in
   der schon installierten Web-App. */
if (!istIos() && !schonInstalliert()) { $("playLink").classList.remove("hide"); $("playTop").classList.remove("hide"); }
$("playLink").href = playMitQuelle();
$("playTop").href = playMitQuelle();
$("installGo").onclick = async () => {
  if (istAndroid()) {
    installBalkenWeg(true);
    window.open(playMitQuelle(), "_blank", "noopener");
    return;
  }
  const e = installEreignis;
  installEreignis = null;
  installBalkenWeg(false);
  if (!e) return;
  try {
    await e.prompt();
    const { outcome } = await e.userChoice;
    /* Abgelehnt? Dann nicht noch einmal fragen. */
    if (outcome !== "accepted") { try { localStorage.setItem("diralo-install", "abgelehnt"); } catch {} }
  } catch { /* Browser hat es verweigert - dann eben nicht. */ }
};

/* Erinnerung: Wer nach 3 Minuten noch allein im Chat sitzt, bekommt die
   Einladeleiste erneut - auch wenn er sie weggeklickt hat - mit dem
   Hinweis, dass die Person noch nicht da ist. */
let alleinUhr = null;
function alleinErinnern() {
  clearTimeout(alleinUhr);
  const raum = me.room;
  alleinUhr = setTimeout(() => {
    if (!me || me.room !== raum || demoAktiv || raum.startsWith("demo-")) return;
    for (const m of msgs.values()) if (m.device !== deviceId && m.device !== "demo") return;
    const b = $("allein");
    if (!b) return;
    $("t-alleinText").textContent = "⏳ " + T("erinnerungAllein");
    b.classList.remove("hide");
    b.classList.add("pulsiert");
  }, 3 * 60 * 1000);
}

/* Reise-Banner im Chat: einmal pro Geraet, nur fuer ne/hi/bn/pa/ur. */
const REISE_SPRACHEN = new Set(["ne", "hi", "bn", "pa", "ur"]);
function reiseChatZeigen() {
  const b = $("reiseChat");
  if (!b || !me || demoAktiv || me.room.startsWith("demo-")) return;
  if (!REISE_SPRACHEN.has((me.lang || "").slice(0, 2))) return;
  try { if (localStorage.getItem("diralo-reise-chat")) return; } catch { return; }
  $("rcAnzeige").textContent = window.LUMO_T.inSprache(me.lang, "anzeige");
  $("rcText").textContent = window.LUMO_T.inSprache(me.lang, "reiseTipp");
  $("rcCode").textContent = window.LUMO_T.inSprache(me.lang, "reiseCode");
  $("rcKnopf").textContent = window.LUMO_T.inSprache(me.lang, "reiseKnopf");
  b.classList.remove("hide");
}
function reiseChatWeg() {
  $("reiseChat").classList.add("hide");
  try { localStorage.setItem("diralo-reise-chat", "1"); } catch {}
}
$("reiseChatZu").addEventListener("click", (e) => { e.preventDefault(); e.stopPropagation(); reiseChatWeg(); });
$("reiseChat").addEventListener("click", () => setTimeout(reiseChatWeg, 300));

function start() {
  alleinErinnern();
  setTimeout(reiseChatZeigen, 20000);
  $("setup").classList.add("hide");
  $("chat").classList.remove("hide");
  demoAus();
  antwortLoeschen();
  versteckeTippt();
  aktualisiereLeer();
  /* Der Installationshinweis kommt nicht mehr nach einem Timer, sondern
     erst nach der ersten gesendeten Nachricht (siehe installNachBeitrag):
     dann hat die Person den Wert erlebt und installiert eher. */
  /* Den Probe-Raum der Startseite nicht in die eigene Chat-Liste schreiben -
     er soll nach dem Ausprobieren nicht als "meine Chats" herumliegen. */
  if (!me.room.startsWith("demo-")) chatMerken(me.room);
  gelesenSetzen(me.room);
  zeigeRaumLabel();
  $("langSwitch").value = me.lang;

  /* Schon verbunden? Das passiert, wenn man ueber den Zurueck-Knopf auf
     die Startseite ging und erneut einen Chat betritt. Dann den
     vorhandenen Socket wiederverwenden - ein zweiter wuerde doppelt
     empfangen und Verbindungen liegenlassen. Nur Verlauf leeren und in
     den (evtl. neuen) Raum beitreten. */
  if (socket) {
    gruppe = { name: "", admin: "", mitglieder: [], angeheftet: null };
    zeigeDurchsage();
    $("log").textContent = "";
    msgs.clear();
    asked.clear();
    aktualisiereLeer();
    versteckeQuotaLeiste();
    socket.emit("join", {
      roomCode: me.room, name: me.name, lang: me.lang, device: deviceId, geheim: geraetGeheim,
      build: BUILD,
      speech: Boolean(window.SpeechRecognition || window.webkitSpeechRecognition),
    });
    if (demoBeimBetreten) { demoBeimBetreten = false; starteDemo(); }
    return;
  }

  socket = io();
  socket.on("connect", () => {
    socket.emit("join", {
      roomCode: me.room, name: me.name, lang: me.lang, device: deviceId, geheim: geraetGeheim,
      /* Nur zwei Angaben zur Fehlersuche: welche Fassung der Seite hier
         laeuft, und ob der Browser ueberhaupt mitschreiben kann. Kein
         Geraetename, keine Kennung - das steht sonst gleich in /health. */
      build: BUILD,
      speech: Boolean(window.SpeechRecognition || window.webkitSpeechRecognition),
    });
    /* Beim Start erneut anmelden, damit Raum, Name und Sprache aktuell bleiben. */
    if (soundOn() && "Notification" in window && Notification.permission === "granted") {
      registerPush().catch(() => {});
    }
  });

  socket.on("history", (list) => {
    list.forEach((m) => add(m, false)); aktualisiereLeer(); gelesenMelden();
    if (nachNeuEinladen) {
      nachNeuEinladen = false;
      if (msgs.size === 0 && !demoAktiv) setTimeout(() => einladen(true), 350);
    }
    if (window.DiraloLernen) DiraloLernen.knopfAktualisieren();
  });
  socket.on("message", (m) => {
    versteckeTippt();
    add(m, true);
    if (document.visibilityState === "visible") { gelesenSetzen(me.room); gelesenMelden(); }
    if (window.DiraloLernen) DiraloLernen.knopfAktualisieren();
  });
  /* Das Gegenueber tippt gerade - kurz "... schreibt" zeigen. */
  socket.on("tippt", ({ name }) => { zeigeTippt(name); });
  /* Einlade-Bonus: die eingeladene Person schreibt mit - der Chat hat
     jetzt einen Monat Diralo Plus. */
  socket.on("bonus", () => {
    const d = document.createElement("div");
    d.className = "system bonus";
    d.textContent = T("bonusDa");
    $("log").appendChild(d); scrollDown();
  });
  /* Reaktion von jemandem (auch von mir zurueck als Bestaetigung). */
  socket.on("reaktion", ({ id, device, emoji }) => {
    const m = msgs.get(id); if (!m) return;
    m.reaktionen = m.reaktionen || {};
    if (emoji) m.reaktionen[device] = emoji; else delete m.reaktionen[device];
    reaktionenRendern(m);
  });
  /* Das Gegenueber hat den Chat offen und alles bis "bis" gesehen - meine
     eigenen Nachrichten bis dahin bekommen die Lese-Haken. */
  /* Der Server erkennt eines unserer eigenen Geraete: Besuche dieses
     Browsers ab jetzt nicht mehr mitzaehlen (setzt das intern-Cookie). */
  socket.on("eigen", () => {
    try { if (localStorage.getItem("diralo-intern")) return; localStorage.setItem("diralo-intern", "1"); } catch {}
    fetch("/?intern=1", { credentials: "same-origin", redirect: "manual" }).catch(() => {});
  });
  socket.on("gelesen", ({ device, bis }) => {
    const t = Number(bis); if (!t) return;
    if (device) {
      const wer = gruppe.mitglieder.find((x) => x.device === device);
      if (wer) wer.bis = Math.max(wer.bis || 0, t);
    }
    msgs.forEach((m) => {
      if (m.device !== deviceId) return;
      if (istGruppe()) { render(m); return; }
      if (!m.gelesen && m.at <= t) { m.gelesen = true; render(m); }
    });
  });
  /* Gruppe: Name, Chef, Mitglieder mit Lesestand (Server: gruppe.js) */
  socket.on("gruppe", (g) => {
    if (!g || typeof g !== "object") return;
    gruppe = { name: g.name || "", admin: g.admin || "", mitglieder: Array.isArray(g.mitglieder) ? g.mitglieder : [],
               angeheftet: g.angeheftet && g.angeheftet.id ? g.angeheftet : null };
    zeigeDurchsage();
    if (gruppe.name) {
      const liste = chatsLaden();
      const c = liste.find((x) => x.code === me.room);
      if (c && c.gruppe !== gruppe.name) {
        if (!c.name || c.name === c.gruppe) c.name = gruppe.name.slice(0, 40);
        c.gruppe = gruppe.name;
        chatsSpeichern(liste);
      }
    }
    zeigeRaumLabel();
    msgs.forEach((m) => { if (m.device === deviceId) render(m); });
    if (sheet && sheet.dataset.art === "gruppe") zeigeGruppe();
  });
  socket.on("gruppeFehler", (e) => showErr(T(e && e.grund === "nurTeamPlus" ? "nurTeamPlus" : "gruppeNurChef")));
  socket.on("deleteFailed", () => { showErr(T("delFailed")); });
  socket.on("deleted", ({ id }) => {
    const m = msgs.get(id);
    if (!m) return;
    m.deleted = true; m.text = ""; m.tr = {}; m.audioSeconds = null; m.datei = null; m.gif = null; m.open = false; m.reaktionen = {};
    render(m);
  });
  socket.on("system", (ev) => {
    /* Zu viele Chatwechsel in kurzer Zeit - die Bremse gegen das
       Durchprobieren von Codes. Einen normalen Nutzer trifft das kaum;
       wenn doch, soll er wissen, warum, statt vor einer stummen App zu
       sitzen. */
    if (ev && ev.type === "tooManyJoins") { showErr(T("tooManyJoins")); return; }
    /* Chat wurde vom Betreiber unter einen neuen Code gelegt - nichts anzeigen. */
    if (ev && ev.type === "umgezogen") return;
    /* Team-Abo voll: nicht hinein, Bescheid sagen. */
    if (ev && ev.type === "teamVoll") {
      me.room = "";
      zurStartseite();
      alert(T("teamVoll"));
      return;
    }
    /* Aus der Gruppe entfernt: Chat vergessen, zurueck zur Startseite. */
    if (ev && ev.type === "entfernt") {
      chatsSpeichern(chatsLaden().filter((c) => c.code !== me.room));
      me.room = "";
      gruppe = { name: "", admin: "", mitglieder: [] };
      zurStartseite();
      alert(T("gruppeEntferntDu"));
      return;
    }
    const d = document.createElement("div");
    d.className = "system";
    d.textContent = typeof ev === "string" ? ev : T(ev.type, { name: ev.name });
    $("log").appendChild(d); scrollDown();
  });
  socket.on("lang", ({ id, lang }) => {
    const m = msgs.get(id); if (!m) return;
    m.lang = lang; render(m);
  });
  socket.on("translated", ({ id, lang, text }) => {
    const m = msgs.get(id); if (!m) return;
    m.tr[lang] = text; render(m);
    if (gruppe.angeheftet && gruppe.angeheftet.id === id) zeigeDurchsage();
  });
  socket.on("translationError", ({ id }) => {
    showErr(T("errTranslate"));
    const m = msgs.get(id); if (m) { m.failed = true; render(m); }
  });
  /* Text im Bild: fertige Uebersetzung (leerer Text = kein Text gefunden). */
  socket.on("bildTextFertig", ({ id, lang, text }) => {
    const m = msgs.get(id); if (!m) return;
    m.bildTr = m.bildTr || {};
    m.bildTr[lang] = String(text || "");
    m.bildLaeuft = false;
    if (lang === me.lang) render(m);
  });
  socket.on("bildTextFehler", ({ id, lang }) => {
    const m = msgs.get(id); if (!m) return;
    m.bildLaeuft = false;
    if (lang === me.lang) { showErr(T("errTranslate")); render(m); }
  });
  /* Aussprache-Hilfe fertig/fehlgeschlagen - nur die Lautschrift in der
     eigenen Sprache uebernehmen und ein offenes Aussprache-Fenster fuellen. */
  socket.on("ausspracheFertig", ({ id, lang, text }) => {
    if (lang !== me.lang) return;
    const m = msgs.get(id); if (!m) return;
    m.lautschrift = String(text || "");
    ausspracheAktualisieren(m);
  });
  socket.on("ausspracheFehler", ({ id, lang }) => {
    if (lang !== me.lang) return;
    const m = msgs.get(id); if (!m) return;
    m.lautschriftFehler = true;
    ausspracheAktualisieren(m);
  });
  socket.on("tooFast", () => {
    showErr(T("errTooFast"));
    /* Die Nachricht wurde nicht angenommen - den Text zurueck ins Feld,
       damit niemand neu tippen muss. */
    if (!draft.value.trim() && lastSent) {
      draft.value = lastSent;
      draft.style.height = "auto";
      draft.style.height = Math.min(draft.scrollHeight, 120) + "px";
      $("send").disabled = false;
      composerButtons();
    }
  });
  socket.on("quotaReached", ({ id, grund, plan }) => {
    /* Zwei verschiedene Grenzen, zwei verschiedene Antworten. Die
       Tagesgrenze geht morgen vorbei - da reicht ein Hinweis. Die
       Monatsgrenze geht nicht vorbei, und sie ist der Moment, in dem
       jemand entscheidet, ob er bezahlt. */
    if (grund === "monat") zeigeQuotaLeiste(plan);
    else showErr(T("errQuota"));
    const m = msgs.get(id); if (m) { m.failed = true; m.bildLaeuft = false; render(m); }
  });
  /* Antwort des Probe-Partners: kommt fertig mit Uebersetzung, damit sie
     ohne "need"-Runde sofort in der Sprache des Besuchers erscheint. */
  socket.on("demoAntwort", ({ text, tr, lang }) => {
    if (!demoAktiv) return;
    demoTippt(false);
    const t = String(text || "");
    const uebersetzt = (tr && tr[me.lang]) ? tr[me.lang] : t;
    add({ id: "demo-p-" + Date.now(), device: "demo", name: T("demoName"),
          lang: lang || demoPartnerLang, text: t, tr: { [me.lang]: uebersetzt }, at: Date.now() }, false);
    /* Nach ein paar Runden sanft zum echten Chat schubsen. */
    if (demoRunden === 2) demoEinladenCta();
  });
  socket.on("demoFehler", () => { demoTippt(false); showErr(T("errTranslate")); });

  /* Kam der Beitritt nur von der Startseiten-Demo, jetzt loslegen. Der
     "demo"- und "join"-Emit werden bis zum Verbindungsaufbau gepuffert -
     die Reihenfolge stimmt also auch beim allerersten Socket. */
  if (demoBeimBetreten) { demoBeimBetreten = false; starteDemo(); }
}

$("langSwitch").onchange = (e) => {
  me.lang = e.target.value;
  localStorage.setItem("diralo", JSON.stringify(me));
  socket.emit("setLang", { lang: me.lang });
  applyLanguage(me.lang);
  if (soundOn()) registerPush().catch(() => {});
};

/* Zurueck zur Startseite - von dort kann man einen neuen Chat starten,
   die eigene Liste sehen oder installieren. Die Verbindung bleibt bestehen,
   damit Benachrichtigungen weiterlaufen; betritt man erneut einen Chat,
   nutzt start() denselben Socket weiter. */
function zurStartseite() {
  $("chat").classList.add("hide");
  $("setup").classList.remove("hide");
  $("installBar").classList.add("hide");
  versteckeQuotaLeiste();
  schliesseSheet();
  $("room").value = "";
  if (me.name) $("name").value = me.name;
  if (me.lang) $("lang").value = me.lang;
  zeigeStartListe();
}
$("zurueckBtn").onclick = zurStartseite;

function add(m, live) {
  if (msgs.has(m.id)) return;
  /* Fuer mich geloescht: taucht auch nach einem Neustart nicht wieder
     auf, die Kennung liegt im Browser. */
  if (verborgen.has(m.id)) return;
  m.live = Boolean(live) && m.device !== deviceId;   // eigene Nachrichten nie melden
  msgs.set(m.id, m);
  const row = document.createElement("div");
  row.id = "m" + m.id;
  row.className = "row " + (m.device === deviceId ? "mine" : "theirs");
  row.innerHTML = '<div class="bubble"></div><div class="meta"></div>';

  /* Wie bei WhatsApp: Die Nachricht selbst antippen oeffnet das Menue.
     Klicks auf den Abspieler oder einen Knopf darin sind ausgenommen -
     sonst liesse sich eine Sprachnachricht nicht mehr starten. */
  const blase = row.querySelector(".bubble");
  blase.style.cursor = "pointer";
  blase.onclick = (e) => {
    /* Ein Tippen aufs Bild vergroessert es, oeffnet aber nicht das Menue -
       sonst kaeme beides zugleich. Das Menue erreicht man beim Bild ueber
       die Namenszeile darunter. */
    if (e.target.closest("audio, button, a, .foto")) return;
    zeigeMenue(m);
  };
  $("log").appendChild(row);
  render(m);
  scrollDown();
  aktualisiereLeer();
}

/* Der Hinweis im leeren Chat: sichtbar, solange keine Nachricht da ist. */
function aktualisiereLeer() {
  const istLeer = msgs.size === 0;
  const leer = $("leer");
  if (leer) leer.classList.toggle("hide", !istLeer);
  /* Solange die Mitte einlaedt, waere der Einladen-Knopf oben doppelt. */
  $("inviteBtn").classList.toggle("hide", istLeer);
  /* Schon geschrieben, aber noch nie jemand anderes hier: Einladeleiste.
     Im Probe-Chat nicht - dort antwortet die Demo und hat ihren eigenen
     Hinweis. Weggeklickt bleibt sie fuer diesen Chat weg. */
  let andere = false;
  for (const m of msgs.values()) if (m.device !== deviceId && m.device !== "demo") { andere = true; break; }
  let weg = false;
  try { weg = sessionStorage.getItem("diralo-allein-zu") === me.room; } catch {}
  const allein = $("allein");
  if (allein) allein.classList.toggle("hide", istLeer || andere || demoAktiv || weg);
}

/* Standort in eine Blase setzen: eine antippbare Karte. Tippen oeffnet
   die Koordinaten in der Karten-App (Google Maps) - bewusst in einem
   neuen Tab, denn eine Karte gehoert nicht in unser Overlay, und der
   Empfaenger will sie ja wirklich oeffnen. */
function ortEinsetzen(m, bubble) {
  const karte = document.createElement("a");
  karte.className = "ortkarte";
  karte.href = "https://www.google.com/maps?q=" + m.ort.lat + "," + m.ort.lng;
  karte.target = "_blank";
  karte.rel = "noopener";
  const pin = document.createElement("span");
  pin.className = "ortpin";
  pin.textContent = "📍";
  const txt = document.createElement("span");
  const titel = document.createElement("b");
  titel.textContent = T("ortShared");
  const link = document.createElement("span");
  link.className = "ortlink";
  link.textContent = T("ortOpen");
  txt.appendChild(titel);
  txt.appendChild(link);
  karte.appendChild(pin);
  karte.appendChild(txt);
  bubble.appendChild(karte);
}

/* Datei oder Video (aus der App, unuebersetzt): Video direkt abspielbar,
   alles andere als Download-Link mit Name und Groesse. */
function dateiEinsetzen(m, bubble) {
  const url = "/medien/" + encodeURIComponent(m.id);
  const d = m.datei || {};
  if (String(d.mime || "").startsWith("video/")) {
    const v = document.createElement("video");
    v.controls = true;
    v.preload = "metadata";
    v.src = url;
    v.style.maxWidth = "100%";
    v.style.borderRadius = "10px";
    v.style.display = "block";
    v.onclick = (e) => e.stopPropagation();
    bubble.appendChild(v);
  }
  const a = document.createElement("a");
  a.href = url + "?laden";
  a.download = d.name || "datei";
  a.onclick = (e) => e.stopPropagation();
  a.style.display = "block";
  a.style.color = "inherit";
  const mb = d.groesse >= 1e6 ? (d.groesse / 1e6).toFixed(1) + " MB" : Math.max(1, Math.round((d.groesse || 0) / 1000)) + " KB";
  a.textContent = "📄 " + (d.name || "Datei") + " · " + mb + " ⬇";
  bubble.appendChild(a);
}

/* Das Bild in eine Blase setzen. Tippen zeigt es gross im eigenen
   Overlay - nicht in einem neuen Tab, sonst kaeme man in der
   installierten App nicht mehr zurueck. */
function bildEinsetzen(m, bubble) {
  const img = document.createElement("img");
  img.className = "foto";
  img.loading = "lazy";
  img.alt = "";
  img.src = "/medien/" + encodeURIComponent(m.id);
  img.onclick = (e) => { e.stopPropagation(); zeigeBildGross(m); };
  bubble.appendChild(img);

  /* Text IM Bild uebersetzen (Schild, Screenshot, Brief ...). Auf Anfrage,
     weil das Sehen mehr kostet. Ergebnis haengt an der Nachricht, ein
     leerer Text heisst "kein Text gefunden". */
  const fertig = m.bildTr && Object.prototype.hasOwnProperty.call(m.bildTr, me.lang);
  if (fertig) {
    const t = m.bildTr[me.lang];
    const box = document.createElement("div");
    box.className = "bildtext" + (t.trim() ? "" : " leer");
    box.dir = t.trim() && RTL.has(me.lang) ? "rtl" : "auto";
    box.textContent = t.trim() ? t : T("bildTextLeer");
    bubble.appendChild(box);
  } else if (m.bildLaeuft) {
    const w = document.createElement("div");
    w.className = "bildtext waiting";
    w.textContent = T("translating");
    bubble.appendChild(w);
  } else {
    const btn = document.createElement("button");
    btn.type = "button";
    btn.className = "bildtext-btn";
    btn.textContent = T("bildTextBtn");
    btn.onclick = (e) => {
      e.stopPropagation();
      m.bildLaeuft = true;
      render(m);
      socket.emit("bildText", { id: m.id, lang: me.lang });
    };
    bubble.appendChild(btn);
  }
}

/* Vollbild-Ansicht eines Bildes. Schliesst per Tippen und - wichtig auf
   dem Handy - auch ueber die Zurueck-Geste: dazu legen wir einen
   Verlaufseintrag an und hoeren auf popstate, statt die Seite zu
   verlassen. */
function zeigeBildGross(m) {
  const overlay = document.createElement("div");
  overlay.className = "lightbox";
  const gross = document.createElement("img");
  gross.src = "/medien/" + encodeURIComponent(m.id);
  gross.alt = "";
  overlay.appendChild(gross);
  const zu = document.createElement("button");
  zu.type = "button";
  zu.className = "lightbox-zu";
  zu.setAttribute("aria-label", T("cancel"));
  zu.textContent = "✕";
  overlay.appendChild(zu);

  /* Loeschen dort anbieten, wo man das Bild anschaut - ueber die
     Namenszeile in der Blase findet es sonst niemand. Der Papierkorb
     schliesst die Ansicht und oeffnet das gewohnte Loesch-Menue. */
  const loesch = document.createElement("button");
  loesch.type = "button";
  loesch.className = "lightbox-loesch";
  loesch.setAttribute("aria-label", T("options"));
  loesch.textContent = "🗑";
  loesch.onclick = (e) => {
    e.stopPropagation();
    history.back();
    setTimeout(() => zeigeMenue(m), 60);
  };
  overlay.appendChild(loesch);

  const weg = () => {
    overlay.remove();
    window.removeEventListener("popstate", weg);
  };
  /* Tippen schliesst ueber die Historie - so verhaelt sich die
     Zurueck-Geste genauso und verlaesst nicht die App. */
  overlay.onclick = () => history.back();
  history.pushState({ lightbox: true }, "");
  window.addEventListener("popstate", weg);
  document.body.appendChild(overlay);
}

/* Uhrzeit einer Nachricht in der Locale des Lesers (24h/12h folgt der
   Sprache automatisch). Eine ungueltige Locale faellt still auf die
   Browser-Voreinstellung zurueck. */
function uhrzeit(at) {
  try {
    return new Date(at).toLocaleTimeString(me.lang || undefined, { hour: "2-digit", minute: "2-digit" });
  } catch {
    return new Date(at).toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" });
  }
}

const REAKTIONEN = ["❤️", "👍", "😂", "😮", "😢", "🙏"];

/* Reaktion setzen/umschalten: dasselbe Emoji noch einmal = entfernen.
   Optimistisch anzeigen und ans Gegenueber melden. */
function reagieren(m, emoji) {
  if (!socket || !me.room || m.deleted) return;
  m.reaktionen = m.reaktionen || {};
  const neu = (m.reaktionen[deviceId] === emoji) ? "" : emoji;
  if (neu) m.reaktionen[deviceId] = neu; else delete m.reaktionen[deviceId];
  reaktionenRendern(m);
  socket.emit("reagieren", { id: m.id, emoji: neu });
}

/* Die Reaktions-Abzeichen unter einer Nachricht neu zeichnen. Gleiche
   Emojis werden zusammengezaehlt; meine eigene ist hervorgehoben. */
function reaktionenRendern(m) {
  const row = $("m" + m.id); if (!row) return;
  let el = row.querySelector(".reaktionen");
  const r = m.reaktionen || {};
  const emojis = Object.values(r);
  if (!emojis.length) { if (el) el.remove(); return; }
  if (!el) { el = document.createElement("div"); el.className = "reaktionen"; row.appendChild(el); }
  const zaehl = {};
  for (const e of emojis) zaehl[e] = (zaehl[e] || 0) + 1;
  el.textContent = "";
  for (const [e, n] of Object.entries(zaehl)) {
    const b = document.createElement("span");
    b.className = "reaktion" + (r[deviceId] === e ? " meine" : "");
    b.textContent = n > 1 ? (e + " " + n) : e;
    b.onclick = () => reagieren(m, e);
    el.appendChild(b);
  }
}

function render(m) {
  const row = $("m" + m.id); if (!row) return;
  const bubble = row.querySelector(".bubble");
  const meta = row.querySelector(".meta");
  reaktionenRendern(m);
  /* Geloeschtes hat keinen Inhalt mehr - weder uebersetzen noch
     abspielen, nur der Hinweis bleibt. */
  if (m.deleted) {
    bubble.textContent = "";
    const s = document.createElement("span");
    s.className = "deleted";
    s.textContent = T("deletedNote");
    bubble.appendChild(s);
    meta.textContent = "";
    const wer = document.createElement("span");
    wer.textContent = m.name;
    meta.appendChild(wer);
    const zt = document.createElement("span");
    zt.className = "zeit";
    zt.textContent = uhrzeit(m.at);
    meta.appendChild(zt);
    return;
  }

  /* Ohne Text gibt es nichts zu uebersetzen - das betrifft
     Sprachnachrichten, bei denen die Mitschrift fehlgeschlagen ist.
     Sonst wartet die Blase ewig auf eine Uebersetzung von nichts. */
  const needs = m.lang !== me.lang && Boolean(m.text.trim());
  const shown = needs ? m.tr[me.lang] : m.text;

  if (needs && !shown && !m.failed) {
    const key = m.id + ":" + me.lang;
    if (!asked.has(key)) { asked.add(key); socket.emit("need", { id: m.id, lang: me.lang }); }
    bubble.textContent = "";
    if (m.replyTo) zitatEinsetzen(m, bubble);
    if (m.bild) bildEinsetzen(m, bubble);   /* Bild sofort, auch waehrend die Unterschrift uebersetzt wird */
    const w = document.createElement("span");
    w.className = "waiting";
    w.textContent = T("translating");
    bubble.appendChild(w);
  } else {
    const text = shown || m.text;
    bubble.textContent = "";
    if (m.replyTo) zitatEinsetzen(m, bubble);
    if (m.bild) bildEinsetzen(m, bubble);
    if (m.ort) ortEinsetzen(m, bubble);
    if (m.datei) dateiEinsetzen(m, bubble);
    if (m.gif) {
      const g = document.createElement("img");
      g.className = "foto";
      g.alt = "GIF";
      g.loading = "lazy";
      g.referrerPolicy = "no-referrer";
      g.src = m.gif.url;
      bubble.appendChild(g);
    }
    /* Sprachnachricht: Abspieler zuerst, die Mitschrift darunter. Ohne
       Mitschrift bleibt es beim Abspieler mit einem Hinweis. */
    if (m.audioSeconds != null) {
      const box = document.createElement("div");
      box.className = "voice";
      const a = document.createElement("audio");
      a.controls = true;
      a.preload = "none";
      a.src = "/medien/" + encodeURIComponent(m.id);
      const len = document.createElement("span");
      len.className = "voice-len";
      len.textContent = Math.floor(m.audioSeconds / 60) + ":" +
                        String(m.audioSeconds % 60).padStart(2, "0");
      box.appendChild(a);
      box.appendChild(len);
      bubble.appendChild(box);
      /* Fremde Sprachnachricht: die Uebersetzung anhoeren, in meiner Sprache. */
      const ueb = m.device !== deviceId && (m.tr || {})[me.lang];
      if (ueb) {
        const h = document.createElement("button");
        h.type = "button";
        h.className = "ueb-hoeren";
        h.textContent = "🔊 " + ((LANGS.find(([c]) => c === me.lang) || [])[1] || me.lang);
        h.onclick = (e) => { e.stopPropagation(); natuerlichVorlesen(ueb, me.lang); };
        bubble.appendChild(h);
      }
      if (!m.text.trim()) {
        const hint = document.createElement("span");
        hint.className = "no-text";
        hint.textContent = T("noTranscript");
        bubble.appendChild(hint);
      }
    }
    const span = document.createElement("span");
    span.dir = RTL.has(me.lang) ? "rtl" : "auto";
    span.textContent = text;
    if (m.audioSeconds != null) span.className = "no-text";
    /* Beim reinen Standort gibt es keinen Text - dann keine leere Zeile. */
    if (text || (!m.ort && !m.datei && !m.gif)) bubble.appendChild(span);
    if (m.open) {
      const o = document.createElement("div");
      o.className = "orig";
      o.dir = RTL.has(m.lang) ? "rtl" : "auto";
      o.textContent = m.text;
      bubble.appendChild(o);
    }
    if (m.live) notify(m, text || (m.bild ? "📷" : (m.ort ? "📍" : text)));
  }

  meta.textContent = "";
  const who = document.createElement("span");
  who.textContent = m.name;
  meta.appendChild(who);
  /* Uhrzeit, wann die Nachricht geschrieben wurde - in der Sprache des
     Lesers (Format 24h/12h folgt der Locale). */
  const zeit = document.createElement("span");
  zeit.className = "zeit";
  zeit.textContent = uhrzeit(m.at);
  meta.appendChild(zeit);
  /* Lesebestaetigung: zwei Haken auf den EIGENEN Nachrichten, sobald das
     Gegenueber sie gesehen hat (wie bei WhatsApp). */
  if (m.device === deviceId && istGruppe()) {
    /* In Gruppen: "✓✓ 3/5" - antippen zeigt, wer gelesen hat. */
    const st = lesestand(m);
    const zahl = document.createElement("span");
    zahl.className = "gelesen-zahl" + (st.nein.length ? "" : " alle");
    zahl.textContent = `✓✓ ${st.ja.length}/${st.ja.length + st.nein.length}`;
    zahl.title = T("gruppeGelesen");
    zahl.onclick = (e) => {
      e.stopPropagation();
      alert(T("gruppeGelesen") + ":\n" + (st.ja.map((x) => "✓✓ " + x.name).join("\n") || "–") +
        (st.nein.length ? "\n\n" + T("gruppeUngelesen") + ":\n" + st.nein.map((x) => "⏳ " + x.name).join("\n") : ""));
    };
    meta.appendChild(zahl);
  } else if (m.device === deviceId && m.gelesen) {
    const haken = document.createElement("span");
    haken.className = "gelesen-haken";
    haken.textContent = "✓✓";
    haken.title = T("gelesen");
    meta.appendChild(haken);
  }
  /* Nur anbieten, wenn das Original ueberhaupt anders aussieht. Bei
     reinen Smiley-Nachrichten gibt der Server den Text unveraendert
     zurueck - da waere "Original: ..." ein Verweis auf dasselbe. */
  if (needs && shown && shown !== m.text) {
    const b = document.createElement("button");
    const nice = (LANGS.find(([c]) => c === m.lang) || [])[1] || m.lang.toUpperCase();
    b.textContent = m.open ? T("hideOriginal") : T("original", { lang: nice });
    b.onclick = () => { m.open = !m.open; render(m); };
    meta.appendChild(b);
  }
  /* Beim Bild ist das Antippen der Blase fuers Vergroessern belegt - das
     Menue (z.B. Loeschen) erreicht man deshalb ueber die Namenszeile. */
  if (m.bild) {
    meta.style.cursor = "pointer";
    meta.onclick = (e) => { if (e.target.closest("button, a")) return; zeigeMenue(m); };
  }
}

const draft = $("draft");

/* Wie bei WhatsApp: Bei leerem Feld steht der Sprechen-Knopf da,
   sobald Text drin ist, weicht er dem Senden-Knopf. Waehrend eines
   laufenden Diktats bleibt er stehen - man muss es ja beenden
   koennen. */
function composerButtons() {
  const hatText = Boolean(draft.value.trim());
  $("send").classList.toggle("hide", !hatText);
  $("dictBtn").classList.toggle("hide", (hatText && !diktiert) || !kannErkennen);
}

draft.addEventListener("input", () => {
  $("send").disabled = !draft.value.trim();
  composerButtons();
  draft.style.height = "auto";
  draft.style.height = Math.min(draft.scrollHeight, 120) + "px";
  if (draft.value.trim()) tipptSenden();
});

/* "... schreibt gerade": ein winziges Live-Signal, gedrosselt auf
   hoechstens alle zwei Sekunden. Nichts wird gespeichert. */
let letztesTippen = 0;
function tipptSenden() {
  if (!socket || !me.room || demoAktiv) return;
  const now = Date.now();
  if (now - letztesTippen > 2000) { letztesTippen = now; socket.emit("tippt"); }
}
let tipptTimer = null;
function zeigeTippt(name) {
  $("tipptName").textContent = (name || "") + " " + T("tippt");
  $("tippt").classList.remove("hide");
  clearTimeout(tipptTimer);
  tipptTimer = setTimeout(versteckeTippt, 3500);
}
function versteckeTippt() {
  clearTimeout(tipptTimer);
  $("tippt").classList.add("hide");
}
draft.addEventListener("keydown", (e) => {
  if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); sendMsg(); }
});
$("send").onclick = sendMsg;
$("antwortWeg").onclick = antwortLoeschen;

let lastSent = "";

function sendMsg() {
  /* Erst das Diktat beenden - sonst hoert es nach dem Senden weiter zu
     und schreibt in das gerade geleerte Feld. Das Beenden traegt auch
     das letzte Wort noch ein, deshalb steht es vor dem Auslesen. */
  if (diktiert) stoppeDiktat();
  const text = draft.value.trim();
  if (!text) return;
  lastSent = text;
  /* Bezug auf eine zitierte Nachricht, falls gerade geantwortet wird. */
  const replyTo = (antwortAuf && !antwortAuf.deleted) ? antwortAuf.id : null;
  antwortLoeschen();
  /* Im Probe-Chat geht die Nachricht an den KI-Partner, nicht in einen
     echten Raum. */
  if (demoAktiv) {
    demoSenden(text);
    draft.value = ""; draft.style.height = "auto"; $("send").disabled = true;
    composerButtons();
    return;
  }
  socket.emit("send", { text, replyTo });
  draft.value = ""; draft.style.height = "auto"; $("send").disabled = true;
  /* Das Feld ist wieder leer - also gehoeren Sprechen und Mikrofon
     zurueck an die Stelle des Senden-Knopfes. */
  composerButtons();
  installNachBeitrag();
}

/* ------------------------------------------------------------------
   Auf eine Nachricht antworten (zitieren). Die zitierte Nachricht wird
   ueber dem Eingabefeld gezeigt und in der gesendeten Blase oben klein
   wiederholt - in der Sprache des Lesers, weil das Zitat aus der schon
   uebersetzten Fassung kommt.
------------------------------------------------------------------- */
let antwortAuf = null;

/* Kurzer Text einer Nachricht fuers Zitat - Bild/Standort/Sprache mit
   Symbol, sonst die uebersetzte Fassung. */
function zitatText(m) {
  if (m.deleted) return T("deletedNote");
  if (m.ort) return "📍 " + T("ortShared");
  const inhalt = m.tr[me.lang] || m.text || "";
  if (m.gif) return "GIF";
  if (m.datei) return (String(m.datei.mime || "").startsWith("video/") ? "🎬 " : "📎 ") + (m.datei.name || "");
  if (m.bild) return "📷" + (inhalt ? " " + inhalt : "");
  if (m.audioSeconds != null) return "🎤" + (inhalt ? " " + inhalt : "");
  return inhalt;
}

function antwortSetzen(m) {
  antwortAuf = m;
  $("antwortName").textContent = m.name || "";
  $("antwortText").textContent = zitatText(m);
  $("antwortBar").classList.remove("hide");
  draft.focus();
}

function antwortLoeschen() {
  antwortAuf = null;
  $("antwortBar").classList.add("hide");
}

/* Das Zitat in eine Nachrichtenblase setzen. Tippen springt zur
   Originalnachricht und hebt sie kurz hervor. */
function zitatEinsetzen(m, bubble) {
  const orig = msgs.get(m.replyTo);
  const box = document.createElement("div");
  box.className = "zitat";
  const nm = document.createElement("span");
  nm.className = "z-name";
  nm.textContent = orig ? (orig.name || "") : "";
  const tx = document.createElement("span");
  tx.className = "z-text";
  tx.textContent = orig ? zitatText(orig) : T("replyGone");
  box.appendChild(nm);
  box.appendChild(tx);
  box.onclick = (e) => {
    e.stopPropagation();

/* Sprachnachrichten wurden am 14.09.2026 entfernt: Ohne Mitschrift
   blieben sie unuebersetzt, und genau dafuer gibt es Diralo. Das
   Abspielen schon verschickter Aufnahmen bleibt erhalten, ebenso die
   Schnittstelle auf dem Server - wer sie zurueckholen will, braucht
   nur wieder einen Knopf. Wer sprechen statt tippen will, nimmt das
   Diktat darunter. */

/* ------------------------------------------------------------------
   Diktieren

   Der andere Weg, und der einzige, der auf Android zuverlaessig laeuft:
   Hier hoert nur die Spracherkennung zu, es wird nichts aufgenommen.
   Damit streiten sich nicht zwei um das Mikrofon - genau daran ist die
   Mitschrift waehrend einer Sprachnachricht gescheitert.

   Der Text landet direkt im Eingabefeld und geht danach als ganz
   gewoehnliche Nachricht raus, wird also uebersetzt wie jede andere.
------------------------------------------------------------------ */
const dictBtn = $("dictBtn");
let diktiert = false, diktator = null;
let diktatBasis = "";  // was vor dem Diktat schon im Feld stand
let diktatFest = "";   // Ergebnis abgeschlossener Durchlaeufe
let diktatLauf = "";   // Ergebnis des laufenden Durchlaufs
let diktatSitzung = 0;     // laufende Nummer, sperrt Nachzuegler aus
let diktatLaeufe = 0;      // wie oft die Erkennung neu startete
let diktatErgebnisse = 0;  // wie viele Ergebnisse ankamen
let letzteForm = "";       // Form der letzten Ergebnisliste, nur Laengen
let festLaenge = 0;        // Zeichenzahl von diktatFest beim Beenden

/* Schneidet vom Anfang von "neu" weg, was am Ende von "alt" schon
   steht. Beim Neustart spielt Chrome den gepufferten Ton noch einmal
   durch die Erkennung - die neue Sitzung bringt das zuletzt Gesagte
   also erneut mit. Ohne dieses Abschneiden steht es doppelt da.

   Die Ueberlappung muss an einer Wortgrenze enden, sonst wuerde aus
   "das Sofa" faelschlich etwas abgeschnitten. */
/* Meldet nur, WIE das Diktat ausging - nie, was gesprochen wurde.
   Fehlerkuerzel, Zeichenzahl und die Form der Ergebnisliste reichen zur
   Fehlersuche und verraten nichts. Steht unter /health. */
function meldeSprache(info) {
  try { socket.emit("speechInfo", info); } catch {}
}

function ohneUeberlappung(alt, neu) {
  if (!alt || !neu) return neu;
  /* Wortweise vergleichen, nicht zeichenweise: Chrome schreibt das
     erste Wort eines Ergebnisses gross und setzt Satzzeichen - "Hallo"
     und "hallo" sind sonst zwei verschiedene Texte, und das Doppelte
     rutscht durch. */
  const putzen = (w) => w.toLowerCase().replace(/[.,!?;:„“”"»«]/g, "");
  const a = alt.trim().split(/\s+/);
  const b = neu.trim().split(/\s+/);
  const max = Math.min(a.length, b.length);
  for (let n = max; n >= 1; n--) {
    let gleich = true;
    for (let i = 0; i < n; i++) {
      if (putzen(a[a.length - n + i]) !== putzen(b[i])) { gleich = false; break; }
    }
    if (gleich) return b.slice(n).join(" ");
  }
  return neu;
}

/* Setzt das Feld aus den drei Teilen zusammen. Mehrfache Leerzeichen
   fallen weg, damit an den Nahtstellen keine Luecken entstehen. */
function diktatText(lose) {
  const lauf = ohneUeberlappung(diktatFest, diktatLauf);
  const teile = [diktatFest, lauf, lose || ""].filter((t) => t);
  return (diktatBasis + teile.join(" ")).replace(/\s{2,}/g, " ").trimStart();
}

function schreibeDiktatFest() {
  const l = ohneUeberlappung(diktatFest, diktatLauf.trim());
  diktatLauf = "";
  if (!l) return;
  diktatFest = (diktatFest + " " + l).trim();
}

const kannErkennen = Boolean(window.SpeechRecognition || window.webkitSpeechRecognition);

function starteDiktat(SR) {
  /* Jede Sitzung bekommt eine Nummer. Chrome liefert nach dem Ende einer
     Sitzung noch Ergebnisse nach - ohne diese Sperre schreibt eine
     abgeloeste Sitzung ihren Text ein zweites Mal fest, und aus einem
     "hallo" werden drei. */
  const meine = ++diktatSitzung;
  const aktuell = () => meine === diktatSitzung;
  try {
    diktator = new SR();
    diktator.lang = me.lang;
    diktator.continuous = true;
    diktator.interimResults = true;

    /* Der ganze Durchlauf wird jedes Mal neu zusammengesetzt, nie
       angehaengt. Chrome liefert bei jedem Ereignis auch schon fertige
       Woerter erneut mit - wer die anhaengt, bekommt aus einem "Hallo"
       drei. */
    diktator.onresult = (e) => {
      if (!aktuell()) return;   // Nachzuegler einer abgeloesten Sitzung
      diktatErgebnisse++;
      /* Die Eintraege der Liste sind auf Android nicht getrennt, sondern
         bauen aufeinander auf: "Hallo", dann "Hallo ich liebe", dann
         "Hallo ich liebe dich" - alle als endgueltig. Einfach
         aneinanderhaengen ergaebe alles dreimal. Deshalb wird auch hier
         abgeschnitten, was schon dasteht. */
      let fest = "", lose = "", form = "";
      for (let i = 0; i < e.results.length; i++) {
        const r = e.results[i];
        const t = ((r[0] && r[0].transcript) || "").trim();
        /* Nur die Form zur Fehlersuche: je Eintrag "F" oder "i" und die
           Zeichenzahl. Daran laesst sich ablesen, ob die Eintraege
           aufeinander aufbauen oder getrennt sind - ohne je zu
           uebertragen, was gesprochen wurde.

           Bewusst in dieser Schleife und ueber den Index: e.results ist
           nicht in jedem Browser durchlaufbar, ein Spread wirft dort
           eine Ausnahme - und die haette das Diktat mitgerissen. */
        form += (form ? "," : "") + (r.isFinal ? "F" : "i") + t.length;
        if (!t) continue;
        if (r.isFinal) {
          const neu = ohneUeberlappung(fest, t);
          if (neu) fest = (fest + " " + neu).trim();
        } else {
          const basis = (fest + " " + lose).trim();
          const neu = ohneUeberlappung(basis, t);
          if (neu) lose = (lose + " " + neu).trim();
        }
      }
      letzteForm = form.slice(0, 90);

      diktatLauf = fest;
      draft.value = diktatText(lose);
      /* Loest Hoehenanpassung und den Senden-Knopf mit aus. */
      draft.dispatchEvent(new Event("input"));
    };

    /* Wirft hier irgendetwas, bricht das Diktat sonst ab, ohne sich zu
       beschweren - genau das ist mit einem Spread ueber e.results
       passiert. Jetzt wird der Grund wenigstens gemeldet. */
    const rohesOnresult = diktator.onresult;
    diktator.onresult = (e) => {
      try { rohesOnresult(e); }
      catch (err) { meldeSprache({ diktat: true, error: "result:" + (err.name || "?") }); }
    };

    /* Auf Android endet die Erkennung nach jeder Pause von selbst. Was
       dieser Durchlauf ergeben hat, wird dabei festgeschrieben - der
       naechste faengt mit leerer Ergebnisliste an. */
    diktator.onend = () => {
      if (!aktuell() || !diktiert) return;
      diktatLaeufe++;
      schreibeDiktatFest();
      setTimeout(() => { if (diktiert && aktuell()) starteDiktat(SR); }, 120);
    };

    diktator.onerror = (e) => {
      meldeSprache({ diktat: true, error: e.error });
      if (e.error === "no-speech" || e.error === "aborted") return;
      stoppeDiktat();
      showErr(T("noTranscript") + " (" + e.error + ")");
    };

    diktator.onstart = () => meldeSprache({ diktat: true, gestartet: true });
    diktator.start();
  } catch (err) {
    meldeSprache({ diktat: true, error: "throw:" + (err.name || "?") });
    stoppeDiktat();
    showErr(T("errMic"));
  }
}

function stoppeDiktat() {
  diktiert = false;
  dictBtn.classList.remove("on");
  draft.placeholder = T("write");
  composerButtons();
  if (diktator) { try { diktator.stop(); } catch {} diktator = null; }
  /* Was der letzte Durchlauf ergeben hat, gehoert noch dazu. */
  schreibeDiktatFest();
  draft.value = diktatText("");
  draft.dispatchEvent(new Event("input"));
  meldeSprache({ diktat: true, ende: true, zeichen: diktatFest.length,
                 laeufe: diktatLaeufe, ergebnisse: diktatErgebnisse,
                 form: letzteForm, feld: draft.value.length });
}

function toggleDiktat() {
  if (diktiert) { stoppeDiktat(); draft.focus(); return; }
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!SR) { showErr(T("errMic")); return; }
  /* Schon Getipptes bleibt stehen, das Diktat haengt sich dahinter. */
  diktatBasis = draft.value.trim() ? draft.value.replace(/\s*$/, "") + " " : "";
  diktatFest = "";
  diktatLauf = "";
  diktatLaeufe = 0; diktatErgebnisse = 0; letzteForm = "";
  diktiert = true;
  dictBtn.classList.add("on");
  draft.placeholder = T("dictating");
  composerButtons();
  toggleEmoji(false);
  meldeSprache({ neu: true, diktat: true });
  starteDiktat(SR);
}

dictBtn.onclick = toggleDiktat;
composerButtons();

/* ------------------------------------------------------------------
   Bilder senden

   Das Bild wird im Browser verkleinert und neu als JPEG kodiert - das
   Neukodieren ueber die Leinwand wirft versteckte Daten (auch den
   Standort aus EXIF) automatisch weg. Erst dann geht es hoch, mit einer
   optionalen Unterschrift, die wie jeder Text uebersetzt wird.
------------------------------------------------------------------- */
const BILD_MAX = 2_500_000;   /* muss zur Grenze im Server passen */
const bildBtn = $("bildBtn"), bildInput = $("bildInput"), bildKamera = $("bildKamera");

/* iPhone-Sonderweg: In der installierten App (Startbildschirm) bleibt die
   Kamera beim *direkten* Aufruf ueber capture oft schwarz - eine
   Apple-Einschraenkung. Nimmt man capture weg, oeffnet iOS stattdessen die
   Auswahl mit "Foto aufnehmen", und ueber diesen Weg wird die Kamera
   normal freigeschaltet. Android bleibt beim direkten capture. */
if (istIos()) bildKamera.removeAttribute("capture");

/* Auf Geraeten mit Kamera zuerst fragen: aufnehmen oder aus der Galerie?
   Manche Handys bieten von sich aus nur die Galerie an - mit dem eigenen
   Kamera-Feld (capture) kommt wirklich die Kamera. Am Rechner (feiner
   Zeiger, kein Touch) gibt es keine Kamera; da direkt die Dateiauswahl. */
const hatKamera = (navigator.maxTouchPoints || 0) > 0 ||
                  (window.matchMedia && matchMedia("(pointer: coarse)").matches);

bildBtn.onclick = () => { if (hatKamera) zeigeBildQuelle(); else bildInput.click(); };

/* Standort teilen: den aktuellen Standort holen (der Browser fragt selbst
   um Erlaubnis) und als antippbare Karte verschicken. */
$("ortBtn").onclick = () => {
  if (!navigator.geolocation) { showErr(T("ortError")); return; }
  const btn = $("ortBtn");
  btn.disabled = true;
  navigator.geolocation.getCurrentPosition(
    (pos) => {
      btn.disabled = false;
      socket.emit("sendOrt", { lat: pos.coords.latitude, lng: pos.coords.longitude });
      installNachBeitrag();
    },
    () => { btn.disabled = false; showErr(T("ortError")); },
    { enableHighAccuracy: true, timeout: 10000, maximumAge: 60000 }
  );
};

function zeigeBildQuelle() {
  schliesseSheet();
  sheet = document.createElement("div");
  sheet.className = "sheet";
  const box = document.createElement("div");
  box.className = "sheet-inner";
  const kopf = document.createElement("p");
  kopf.className = "sheet-kopf";
  kopf.textContent = T("bildTitle");
  box.appendChild(kopf);
  const kam = document.createElement("button");
  kam.type = "button";
  kam.textContent = T("bildKamera");
  kam.onclick = () => { schliesseSheet(); bildKamera.click(); };
  const gal = document.createElement("button");

function bildGewaehlt(inp) {
  const datei = inp.files && inp.files[0];
  inp.value = "";   /* damit dasselbe Bild danach erneut waehlbar ist */
  if (!datei) return;
  if (!datei.type.startsWith("image/")) { showErr(T("bildBad")); return; }
  verkleinereBild(datei)
    .then((res) => res ? zeigeBildVorschau(res) : showErr(T("bildFailed")))
    .catch(() => showErr(T("bildFailed")));
}
bildInput.onchange = () => bildGewaehlt(bildInput);
bildKamera.onchange = () => bildGewaehlt(bildKamera);

/* Das Bild zuverlaessig dekodieren. createImageBitmap decodiert das Foto
   fertig, bevor gezeichnet wird - genau das fehlte auf dem iPhone, wo die
   Leinwand sonst schwarz blieb - und versteht auch das iPhone-Format HEIC
   und die Aufnahme-Drehung (EXIF). Aeltere Browser bekommen den <img>-Weg,
   diesmal aber mit decode(), damit auch dort nichts Schwarzes entsteht. */
async function ladeBild(datei) {
  if (window.createImageBitmap) {
    try {
      const bmp = await createImageBitmap(datei, { imageOrientation: "from-image" });
      return { bild: bmp, w: bmp.width, h: bmp.height, weg: () => bmp.close && bmp.close() };
    } catch { /* faellt auf den <img>-Weg zurueck */ }
  }
  const url = URL.createObjectURL(datei);
  const img = new Image();
  try {
    img.src = url;
    if (img.decode) await img.decode();
    else await new Promise((res, rej) => { img.onload = res; img.onerror = rej; });
    return { bild: img, w: img.naturalWidth, h: img.naturalHeight, weg: () => URL.revokeObjectURL(url) };
  } catch { URL.revokeObjectURL(url); return null; }
}

async function verkleinereBild(datei) {
  const q0 = await ladeBild(datei);
  if (!q0 || !q0.w || !q0.h) { if (q0) q0.weg(); return null; }
  try {
    const max = 1600;
    let w = q0.w, h = q0.h;
    if (w > max || h > max) {
      const f = Math.min(max / w, max / h);
      w = Math.round(w * f); h = Math.round(h * f);
    }
    const c = document.createElement("canvas");
    c.width = w; c.height = h;
    c.getContext("2d").drawImage(q0.bild, 0, 0, w, h);
    q0.weg();
    let q = 0.82, dataUrl = c.toDataURL("image/jpeg", q);
    /* Notfalls die Qualitaet senken, bis es unter die Grenze passt. */
    while (dataUrl.length * 0.75 > BILD_MAX && q > 0.4) {
      q -= 0.12; dataUrl = c.toDataURL("image/jpeg", q);
    }
    if (!dataUrl || dataUrl.length < 200) return null;
    return { dataUrl, base64: dataUrl.split(",")[1] };
  } catch { q0.weg(); return null; }
}

async function sendeBild(base64, caption, knopf) {
  try {
    const r = await fetch("/api/bild", {

        caption: String(caption || "").slice(0, 200), mime: "image/jpeg", bild: base64,
      }),
    });

    installNachBeitrag();
  } catch {
    if (knopf) knopf.disabled = false;
    showErr(T("bildFailed"));
  }

/* ------------------------------------------------------------------

   Zwei Arten, wie bei WhatsApp:

   "Fuer alle" geht nur bei eigenen Nachrichten. Der Server entfernt

   "Fuer mich" bleibt auf diesem Geraet. Die Kennungen liegen im

------------------------------------------------------------------ */
function versteckte() {

}

/* ------------------------------------------------------------------
   Aussprache-Hilfe: zeigt, wie man den Originaltext einer Nachricht in
   der Sprache des Gegenuebers ausspricht - Lautschrift (per KI) und
   Vorlesen (Sprachausgabe des Browsers). Fuer Paare, die die Sprache des
   anderen lernen wollen.
------------------------------------------------------------------- */
let ausspracheOffen = null;

function vorlesen(text, lang) {
  if (!("speechSynthesis" in window)) { showErr(T("errVorlesen")); return; }
  try {
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text);
    u.lang = lang;
    u.rate = 0.9;
    speechSynthesis.speak(u);
  } catch { showErr(T("errVorlesen")); }
}

/* Natuerliche Stimme vom Server (wie in der App), sonst die des Browsers. */
let stimmePlayer = null;
async function natuerlichVorlesen(text, lang) {
  try {
    if (stimmePlayer) stimmePlayer.pause();
    const a = await fetch("/api/sprechen", {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ text: String(text).slice(0, 600), lang, device: deviceId }),
    });
    if (!a.ok) throw new Error();
    const { id } = await a.json();
    stimmePlayer = new Audio("/api/sprechen/" + encodeURIComponent(id));
    await stimmePlayer.play();
  } catch { vorlesen(text, lang); }
}

/* Den Lautschrift-Bereich im offenen Fenster auf den neuesten Stand

function ausspracheAktualisieren(m) {

    w.textContent = T("ausspracheLaeuft");
    laut.appendChild(w);
  }
}

/* --------------------------------------------------------------------
   Meine Chats

   Frueher merkte sich der Browser genau einen Chat - wer zum naechsten
   wechselte, verlor den vorigen. Das ging, solange eine Mitgliedschaft
   einen Chat bedeutete. Seit sie mehrere freischaltet, passt es nicht
   mehr: Man bezahlt drei und konnte sich einen merken.

   Die Liste liegt nur in diesem Browser. Darauf weist die App hin, und
   sie laesst sich kopieren - fuer bezahlte Chats holt man sie sonst
   ueber den Verwaltungsschluessel auf der Preisseite zurueck.
-------------------------------------------------------------------- */
const CHATS = "diralo-chats";
const GELESEN = "diralo-gelesen";

/* Wann ein Chat zuletzt offen war. Daraus ergibt sich, was neu ist. */
function gelesenLaden() {
  try { return JSON.parse(localStorage.getItem(GELESEN) || "{}") || {}; } catch { return {}; }
}
function gelesenSetzen(code, wann) {
  if (!code) return;
  const g = gelesenLaden();
  g[code] = wann || Date.now();
  try { localStorage.setItem(GELESEN, JSON.stringify(g)); } catch {}
}

/* Dem Gegenueber melden, dass ich den Chat gerade offen habe und alles
   bis jetzt gesehen habe - daraus werden auf seiner Seite die Lese-Haken.
   Nur wenn der Chat wirklich sichtbar und offen ist. */
function gelesenMelden() {
  if (socket && me.room && document.visibilityState === "visible"
      && !$("chat").classList.contains("hide")) {
    socket.emit("gelesen", { bis: Date.now() });
  }
}

/* Zahlen je Chat vom Server holen. Nur Zahlen - der Server schickt nie
   Inhalte, damit die Abfrage nichts ueber fremde Chats verraet. */
let neuesStand = {};
async function neuesHolen() {
  const g = gelesenLaden();
  const chats = chatsLaden().map((c) => ({ room: c.code, seit: g[c.code] || 0 }));
  if (!chats.length) return {};
  try {
    const a = await fetch("/api/neues", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ chats, device: deviceId }),
    });
    if (!a.ok) return neuesStand;
    neuesStand = await a.json();
  } catch { /* ohne Netz eben nicht */ }
  return neuesStand;
}

function chatsLaden() {
  try {
    const roh = JSON.parse(localStorage.getItem(CHATS) || "[]");
    return Array.isArray(roh) ? roh.filter((c) => c && typeof c.code === "string") : [];
  } catch { return []; }
}

function chatsSpeichern(liste) {
  try { localStorage.setItem(CHATS, JSON.stringify(liste.slice(0, 50))); } catch {}
}

/* Zuletzt benutzter nach oben - so steht der wichtigste immer vorn. */
function chatMerken(code, name) {
  if (!code) return;
  const liste = chatsLaden();
  const da = liste.find((c) => c.code === code);
  if (da) {
    da.zuletzt = Date.now();
    if (name) da.name = name;
  } else {
    liste.push({ code, name: name || "", zuletzt: Date.now() });
  }
  liste.sort((a, b) => (b.zuletzt || 0) - (a.zuletzt || 0));
  chatsSpeichern(liste);
}

function chatVergessen(code) {
  chatsSpeichern(chatsLaden().filter((c) => c.code !== code));
}

const chatAnzeige = (c) => (c.name ? c.name : "#" + c.code);

/* Ein x neben einem Chat: nimmt genau diesen aus der Liste - erst nach
   Rueckfrage, damit niemand aus Versehen einen Chat verliert. `danach`
   frischt die jeweilige Liste auf. */
function chatWegKnopf(c, danach) {
  const x = document.createElement("button");
  x.type = "button";
  x.className = "chat-weg";
  x.textContent = "✕";
  x.setAttribute("aria-label", T("forgetChat"));
  x.onclick = (e) => {
    e.stopPropagation();
    if (confirm(T("forgetChatFrage", { name: chatAnzeige(c) }))) {
      chatVergessen(c.code);
      danach();
    }
  };
  return x;
}

async function zeigeChatListe() {
  await neuesHolen();
  schliesseSheet();
  sheet = document.createElement("div");
  sheet.className = "sheet";
  const box = document.createElement("div");
  box.className = "sheet-inner";

  const kopf = document.createElement("p");

    leer.className = "sheet-hinweis";
    leer.textContent = T("noChats");
    box.appendChild(leer);
  }
  for (const c of andere) {
    const zeile = document.createElement("div");
    zeile.className = "chat-zeile";
    const b = document.createElement("button");
    b.type = "button";
    b.className = "chat-offen";
    b.appendChild(document.createTextNode(chatAnzeige(c)));
    const neu = neuesStand[c.code] || 0;
    if (neu > 0) {
      const punkt = document.createElement("span");

    }
    b.onclick = () => { schliesseSheet(); wechsleZu(c.code); };
    zeile.appendChild(b);
    zeile.appendChild(chatWegKnopf(c, () => zeile.remove()));
    box.appendChild(zeile);
  }

  const trenner = document.createElement("div");
  trenner.className = "sheet-trenner";
  box.appendChild(trenner);

  const um = document.createElement("button");
  um.type = "button";
  um.textContent = T("renameChat");
  um.onclick = () => {
    const jetzt = chatsLaden().find((c) => c.code === me.room);
    const name = prompt(T("chatNameFrage"), jetzt?.name || "");
    if (name !== null) { chatMerken(me.room, name.trim().slice(0, 40)); zeigeRaumLabel(); }
    schliesseSheet();
  };
  box.appendChild(um);

  const kopie = document.createElement("button");
  kopie.type = "button";
  kopie.textContent = T("copyList");
  kopie.onclick = async () => {
    const text = chatsLaden()
      .map((c) => (c.name ? c.name + ": " : "") + location.origin + "/#c=" + c.code)
      .join("\n");
    try { await navigator.clipboard.writeText(text); showErr(T("listCopied")); }
    catch { prompt(T("copyList"), text); }
    schliesseSheet();
  };
  box.appendChild(kopie);

  const weg = document.createElement("button");
  weg.type = "button";
  weg.className = "danger";
  weg.textContent = T("forgetChat");
  weg.onclick = () => { chatVergessen(me.room); schliesseSheet(); };
  box.appendChild(weg);

  const hinweis = document.createElement("p");
  hinweis.className = "sheet-hinweis";
  hinweis.textContent = T("onlyThisBrowser");
  box.appendChild(hinweis);

  sheet.appendChild(box);
  sheet.onclick = (e) => { if (e.target === sheet) schliesseSheet(); };
  document.body.appendChild(sheet);
}

/* Der Name, wenn es einen gibt - sonst der Code. Gruppen zeigen ihren
   gemeinsamen Namen. */
function zeigeRaumLabel() {
  const c = chatsLaden().find((x) => x.code === me.room);
  $("roomLabel").textContent = gruppe.name ? "👥 " + gruppe.name : (c && c.name ? c.name : "#" + me.room);
}

/* ------------------------------ Gruppe ------------------------------
   Ein Chat wird zur Gruppe, sobald jemand ihm einen Namen gibt; wer das
   zuerst tut, verwaltet sie (umbenennen, Leute entfernen). */
let gruppe = { name: "", admin: "", mitglieder: [], angeheftet: null };
/* Durchsage oben im Chat: vom Chef angeheftet, in der eigenen Sprache. */
function zeigeDurchsage() {
  const el = $("durchsage");
  if (!el) return;
  const a0 = gruppe.angeheftet;
  if (!a0) { el.classList.add("hide"); el.textContent = ""; return; }
  const a = msgs.get(a0.id) || a0;
  const text = (a.device !== deviceId && a.tr && a.tr[me.lang]) || a.text || "";
  const st = istGruppe() ? lesestand(a) : null;
  el.textContent = "";
  const k = document.createElement("div");
  k.className = "k";
  k.textContent = T("durchsage") + (st ? `  ·  ✓✓ ${st.ja.length}/${st.ja.length + st.nein.length}` : "");
  const t = document.createElement("div");
  t.className = "t";
  t.textContent = (a.name ? a.name + ": " : "") + text;
  el.appendChild(k); el.appendChild(t);
  el.onclick = () => {
    if (gruppe.admin === deviceId && confirm(T("losloesen") + "?")) socket.emit("gruppeAnheften", { id: null });
  };
  el.classList.remove("hide");
}
/* Die anderen PERSONEN im Chat: eigene weitere Geraete (gleicher Name, z. B.
   Handy + PC) zaehlen nicht mit, und mehrere Geraete einer Person werden zu
   einer zusammengefasst (gelesen = auf irgendeinem ihrer Geraete). Sonst
   wird ein Zweier-Chat faelschlich zur "Gruppe" und die Haken nie blau. */
const andereMitglieder = () => {
  const ich = String((me && me.name) || "").trim().toLowerCase();
  const leute = new Map();
  for (const x of gruppe.mitglieder) {
    if (x.device === deviceId) continue;
    const n = String(x.name || "").trim().toLowerCase() || x.device;
    if (n === ich) continue;
    const alt = leute.get(n);
    leute.set(n, alt ? { ...alt, bis: Math.max(alt.bis || 0, x.bis || 0) } : { ...x });
  }
  return [...leute.values()];
};
const istGruppe = () => Boolean(gruppe.name) || andereMitglieder().length >= 2;
function lesestand(m) {
  const andere = andereMitglieder();
  return { ja: andere.filter((x) => (x.bis || 0) >= m.at), nein: andere.filter((x) => (x.bis || 0) < m.at) };
}
function zeitKurz(at) {
  try {
    return new Date(at).toLocaleString(undefined, { day: "2-digit", month: "2-digit", hour: "2-digit", minute: "2-digit" });
  } catch { return ""; }
}
function zeigeGruppe() {
  schliesseSheet();
  sheet = document.createElement("div");
  sheet.className = "sheet";
  sheet.dataset.art = "gruppe";
  const box = document.createElement("div");
  box.className = "sheet-inner";

  const kopf = document.createElement("p");
  kopf.className = "sheet-kopf";
  kopf.textContent = "👥 " + T("gruppe");
  box.appendChild(kopf);

  const binChef = gruppe.admin === deviceId;
  if (!gruppe.admin || binChef) {
    const feld = document.createElement("input");
    feld.className = "gruppe-name";
    feld.maxLength = 50;
    feld.value = gruppe.name || "";
    feld.placeholder = T("gruppeNameBsp");
    box.appendChild(feld);
    const ok = document.createElement("button");
    ok.type = "button";
    ok.className = "primary";
    ok.textContent = T("gruppeSpeichern");
    ok.onclick = () => {
      const name = feld.value.trim();
      if (!name || !socket) return;
      socket.emit("gruppeName", { name });
      schliesseSheet();
    };
    box.appendChild(ok);
    const h = document.createElement("p");
    h.className = "sheet-hinweis";
    h.textContent = gruppe.admin ? T("gruppeDuChef") : T("gruppeHinweis");
    box.appendChild(h);
  } else {
    const n = document.createElement("p");
    n.className = "sheet-kopf";
    n.textContent = gruppe.name;
    box.appendChild(n);
  }

  const zahl = document.createElement("p");
  zahl.className = "sheet-hinweis";
  zahl.style.fontWeight = "700";
  zahl.textContent = T("gruppeMitglieder", { n: gruppe.mitglieder.length });
  box.appendChild(zahl);

  for (const m of gruppe.mitglieder) {
    const z = document.createElement("div");
    z.className = "mitglied";
    const wer = document.createElement("div");
    wer.className = "wer";
    const n = document.createElement("div");
    n.className = "n";
    n.textContent = m.name + (m.device === deviceId ? " ✱" : "") + (m.device === gruppe.admin ? "  " + T("gruppeChef") : "");
    const u = document.createElement("div");
    u.className = "u";
    const sprache = (LANGS.find(([c]) => c === m.lang) || [])[1] || m.lang;
    u.textContent = sprache + " · " + (m.online ? "🟢 " + T("gruppeOnline") : T("gruppeZuletzt") + " " + zeitKurz(m.zuletzt));
    wer.appendChild(n); wer.appendChild(u);
    z.appendChild(wer);
    if (binChef && m.device !== deviceId) {
      const weg = document.createElement("button");
      weg.type = "button";
      weg.className = "weg";
      weg.textContent = T("gruppeEntfernen");
      weg.onclick = () => {
        if (!confirm(T("gruppeEntfernenFrage", { name: m.name }))) return;
        socket.emit("gruppeEntfernen", { device: m.device });
      };
      z.appendChild(weg);
    }
    box.appendChild(z);
  }

  /* Lernen wurde ausgeblendet: hier wieder einschalten (lernen.js). */
  if (window.DiraloLernen && DiraloLernen.einblendenAnbieten()) {
    const ein = document.createElement("button");
    ein.type = "button";
    ein.className = "lern-wieder";
    ein.textContent = "🎓 " + T("lernenEinblenden");
    ein.onclick = () => { DiraloLernen.einblenden(); schliesseSheet(); };

/* ------------------------------------------------------------------
   Einladen

   Der Chat-Code steht im Link hinter der Raute. Das ist Absicht: Was
   hinter der Raute steht, schickt der Browser nie an den Server - der
   Code taucht also in keinem Zugriffsprotokoll auf, weder bei uns noch
   bei Cloudflare.

   Zum Verschicken nimmt das Handy seinen eigenen Teilen-Dialog, damit
   der Link direkt nach WhatsApp, SMS oder wohin auch immer geht. Wo es
   den nicht gibt, landet er in der Zwischenablage.
------------------------------------------------------------------ */
function neuerCode() {
  /* Ohne i, l, o, 0, 1 - die verwechselt man beim Vorlesen. */
  const zeichen = "abcdefghjkmnpqrstuvwxyz23456789";
  const feld = new Uint32Array(10);
  crypto.getRandomValues(feld);
  return [...feld].map((n) => zeichen[n % zeichen.length]).join("");
}

function einladungsLink(code, ziel) {
  let l = location.origin + "/#c=" + encodeURIComponent(code);
  if (ziel) l += "&l=" + encodeURIComponent(ziel);
  if (ziel && me && me.name && me.name !== "Gast") l += "&v=" + encodeURIComponent(me.name.slice(0, 30));
  return l;
}

/* Einladungstext in der Sprache der anderen Person (plus Englisch, falls
   sie kein Englisch ist) - der Empfaenger soll sofort verstehen. */

  const t = L2.inSprache(ziel, "inviteText");
  return ziel.slice(0, 2) === "en" ? t : t + "\n" + L2.en("inviteText");
}

async function einladenTeilen(ziel) {
  /* Aus dem Probe-Chat heraus eingeladen? Dann die Demo beenden, damit die
     naechsten Nachrichten in den echten Raum gehen und nicht mehr an die KI -
     sonst schriebe der Einladende weiter mit dem Demo-Partner, waehrend die
     echte Person schon beigetreten ist. Der Raum ("demo-...") ist ohnehin
     ein echter, teilbarer Chat. */
  if (demoAktiv) { demoAus(); aktualisiereLeer(); }
  const link = einladungsLink(me.room, ziel);
  /* Zweisprachig und bewusst fest: Die Einladung geht an jemanden, der
     eine andere Sprache spricht - sonst braeuchte er Diralo nicht. Der
     Text in *deiner* Sprache waere fuer ihn genau das Hindernis, das die
     App abschaffen soll.

     Englisch versteht fast jeder wenigstens so weit, dass er den Link
     anklickt; Portugiesisch steht dabei, weil hier die meisten
     Eingeladenen sitzen. */
  const text = einladungsTextFuer(ziel || "pt-PT");
  melde("einladung");
  if (navigator.share) {
    try { await navigator.share({ text: text + " " + link }); return; } catch { /* abgebrochen */ }
  }
  try {
    /* Text UND Link kopieren, nicht nur den nackten Link - der Empfaenger
       bekommt so gleich den Kontext dazu, in beiden Sprachen. */
    await navigator.clipboard.writeText(text + "\n" + link);
    showErr(T("inviteCopied"));   /* dieselbe Leiste, nur als Bestaetigung */
  } catch {
    /* Letzte Rettung: zum Abschreiben anzeigen. */
    prompt(text, link);
  }
}

/* Weitere Angaben im Einladungslink (#c=code&l=pt-BR&v=Carsten): welche
   Sprache der Einladende fuer die andere Person gewaehlt hat und wie er

function linkWert(k) {
  const treffer = new RegExp("[#&]" + k + "=([^&]+)").exec(location.hash || "");
  if (!treffer) return "";
  try { return decodeURIComponent(treffer[1]).trim().slice(0, 40); } catch { return ""; }
}

  localStorage.setItem("diralo-sound", "1");

  if (!("Notification" in window)) { showErr(T("errPushPartial")); return; }

      if (!ok) showErr(T("errPushPartial"));

      showErr(T("errPushPartial"));
    }
  } catch { showErr(T("errPushPartial")); }
};

/* Kurzer Ton, ohne Audiodatei. */
let audioCtx = null;
function beep() {
  try {
    audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)();
    if (audioCtx.state === "suspended") audioCtx.resume();
    const t = audioCtx.currentTime;
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = "sine";
    osc.frequency.setValueAtTime(880, t);
    osc.frequency.setValueAtTime(1175, t + 0.09);
    gain.gain.setValueAtTime(0.0001, t);
    gain.gain.exponentialRampToValueAtTime(0.25, t + 0.02);
    gain.gain.exponentialRampToValueAtTime(0.0001, t + 0.35);
    osc.connect(gain).connect(audioCtx.destination);
    osc.start(t);
    osc.stop(t + 0.36);
  } catch {}
}

}

/* ------------------------------------------------------------------
   Push: Benachrichtigungen auch bei geschlossener App.
   Braucht VAPID-Schluessel auf dem Server. Fehlen sie, passiert hier
   nichts und die App laeuft unveraendert weiter.
------------------------------------------------------------------- */
function b64ToUint8(base64) {
  const pad = "=".repeat((4 - (base64.length % 4)) % 4);
  const raw = atob((base64 + pad).replace(/-/g, "+").replace(/_/g, "/"));
  return Uint8Array.from([...raw].map((c) => c.charCodeAt(0)));
}

async function registerPush() {
  if (!("serviceWorker" in navigator) || !("PushManager" in window)) return false;
  if (Notification.permission !== "granted") return false;

  const info = await fetch("/api/push-key").then((r) => r.json()).catch(() => null);
  if (!info || !info.enabled || !info.key) return false;

  const reg = await navigator.serviceWorker.ready;
  let sub = await reg.pushManager.getSubscription();
  if (!sub) {
    sub = await reg.pushManager.subscribe({
      userVisibleOnly: true,
      applicationServerKey: b64ToUint8(info.key),
    });
  }

  await fetch("/api/subscribe", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({
      subscription: sub,
      room: me.room,
      /* Alle gemerkten Chats mitschicken: Wer die Glocke einschaltet,
         will von allen seinen Gespraechen hoeren, nicht nur von dem,
         der gerade offen ist. */
      rooms: chatsLaden().map((c) => c.code),
      device: deviceId,
      name: me.name,
      lang: me.lang,
    }),
  });
  return true;
}

async function unregisterPush() {
  if (!("serviceWorker" in navigator)) return;
  const reg = await navigator.serviceWorker.ready.catch(() => null);
  if (!reg) return;
  const sub = await reg.pushManager.getSubscription();
  if (!sub) return;
  await fetch("/api/unsubscribe", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ endpoint: sub.endpoint }),
  }).catch(() => {});
  await sub.unsubscribe().catch(() => {});
}

if ("serviceWorker" in navigator) {

     Uebernahme ist keine "neue Version" und darf nicht neu laden. */
  const hatteController = Boolean(navigator.serviceWorker.controller);
  navigator.serviceWorker.register("/sw.js").catch(() => {});

  /* Kommt eine neue Fassung, uebernimmt ihr Service Worker (skipWaiting +
     claim) und loest controllerchange aus. Dann laedt die App sich einmal
     neu, damit nie eine alte Version weiterlaeuft - aber nicht mitten im

  let neuGeladen = false;

    const imChat = !$("chat").classList.contains("hide");
    if (imChat && draft && draft.value.trim()) return;
    neuGeladen = true;
    location.reload();
  });
}
</script>
