<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#E4E5E9">
<meta name="robots" content="noindex, nofollow">
<title>lumo</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="manifest" href="/manifest.json">
<link rel="apple-touch-icon" href="/icons/icon-192-v2.png">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500&display=swap" rel="stylesheet">
<style>
  :root {
    --canvas:#E4E5E9; --surface:#fff; --ink:#20222B; --muted:#6C6F7E;
    --line:#D2D4DB; --mine:#384C9E; --danger:#9B2C25;
  }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html, body { height:100%; }
  body {
    margin:0; background:var(--canvas); color:var(--ink);
    font-family:'DM Sans', system-ui, sans-serif; font-size:16px;
  }
  .wrap {
    max-width:520px; margin:0 auto; height:100dvh;
    display:flex; flex-direction:column;
    padding:14px 14px calc(14px + env(safe-area-inset-bottom));
  }
  .brand { display:block; height:42px; width:auto; }
  .brand-small { display:block; height:26px; width:auto; }
  .logo-wrap { position:relative; flex-shrink:0; }
  .count {
    position:absolute; top:-7px; right:-9px; min-width:19px; height:19px;
    padding:0 5px; border-radius:10px; background:#C0392B; color:#fff;
    font-size:11px; font-weight:500; line-height:19px; text-align:center;
    box-shadow:0 0 0 2px var(--canvas); display:none;
  }
  .count.show { display:block; }
  .sub { margin:6px 0 0; font-size:14px; color:var(--muted); }
  .card { background:var(--surface); border:1px solid var(--line); border-radius:16px; padding:14px; }
  label { display:block; font-size:13px; color:var(--muted); margin:14px 0 5px; }
  input, select, textarea {
    width:100%; font-family:inherit; font-size:16px; color:var(--ink);
    background:var(--surface); border:1px solid var(--line); border-radius:10px; padding:11px 12px;
  }
  textarea { resize:none; }
  input:focus, select:focus, textarea:focus { outline:2px solid var(--ink); outline-offset:1px; }
  button { font-family:inherit; border:none; cursor:pointer; }
  .primary {
    width:100%; margin-top:20px; background:var(--mine); color:#fff;
    border-radius:12px; padding:14px; font-size:16px; font-weight:500;
  }
  .primary:disabled { background:var(--line); cursor:default; }

  .bar { display:flex; align-items:center; gap:10px; margin-bottom:10px; }
  .bar .room { font-size:13px; color:var(--muted); flex:1; }
  .bar select { width:auto; padding:7px 9px; font-size:13px; border-radius:9px; }
  .bell {
    background:var(--surface); border:1px solid var(--line); color:var(--muted);
    border-radius:9px; padding:7px 10px; font-size:13px; white-space:nowrap;
  }
  .bell.on { background:var(--mine); border-color:var(--mine); color:#fff; }

  #log {
    flex:1; overflow-y:auto; background:var(--surface); border:1px solid var(--line);
    border-radius:18px; padding:14px; display:flex; flex-direction:column; gap:12px;
  }
  .row { max-width:85%; display:flex; flex-direction:column; gap:4px; }
  .row.mine { align-self:flex-end; align-items:flex-end; }
  .row.theirs { align-self:flex-start; align-items:flex-start; }
  .bubble { border-radius:16px; padding:10px 13px; font-size:15px; line-height:1.45; white-space:pre-wrap; word-break:break-word; }
  .mine .bubble { background:var(--mine); color:#fff; border-bottom-right-radius:5px; }
  .theirs .bubble { background:#F1F2F5; border-bottom-left-radius:5px; }
  .meta { font-size:11.5px; color:var(--muted); display:flex; gap:8px; align-items:center; }
  .meta button { background:none; padding:0; color:var(--muted); font-size:11.5px; text-decoration:underline; }
  .orig { margin-top:8px; padding-top:8px; border-top:1px solid var(--line); font-size:14px; opacity:.85; }
  .mine .orig { border-top-color:rgba(255,255,255,.28); }
  .waiting { opacity:.45; animation:pulse 1.2s infinite; }
  @keyframes pulse { 0%,100%{opacity:.3} 50%{opacity:.85} }
  @media (prefers-reduced-motion:reduce) { .waiting { animation:none; } }
  .system { align-self:center; font-size:12px; color:var(--muted); }

  .composer { display:flex; gap:8px; margin-top:12px; background:var(--surface); border:1px solid var(--line); border-radius:14px; padding:6px; }
  .composer textarea { border:none; background:transparent; padding:11px 10px; }
  .composer textarea:focus { outline:none; }
  .composer button { border-radius:10px; padding:0 18px; background:var(--mine); color:#fff; font-size:14px; font-weight:500; }
  .composer button:disabled { background:var(--line); cursor:default; }

  /* Auswahl zum Einfuegen. Auf dem Handy hat man die Tastatur dafuer,
     am Rechner nicht - dort ist das der einzige bequeme Weg. */
  .composer .emoji-btn {
    background:transparent; padding:0 10px; font-size:20px; line-height:1;
    color:var(--muted); border-radius:10px; flex-shrink:0;
  }
  .composer .emoji-btn:hover { background:var(--canvas); }
  .composer .emoji-btn[aria-expanded="true"] { background:var(--canvas); }
  .emoji-panel {
    background:var(--surface); border:1px solid var(--line);
    border-radius:14px; padding:8px; margin-bottom:8px;
  }
  .emoji-tabs { display:flex; gap:4px; margin-bottom:6px; }
  .emoji-tabs button {
    flex:1; padding:6px 0; font-size:17px; line-height:1;
    border-radius:8px; background:transparent;
  }
  .emoji-tabs button[aria-selected="true"] { background:var(--canvas); }
  .emoji-grid {
    display:grid; grid-template-columns:repeat(8, 1fr); gap:2px;
    max-height:168px; overflow-y:auto;
  }
  .emoji-grid button {
    padding:5px 0; font-size:21px; line-height:1.15;
    border-radius:8px; background:transparent;
  }
  .emoji-grid button:hover { background:var(--canvas); }
  .err { color:var(--danger); font-size:13px; margin:8px 2px 0; }
  .hide { display:none !important; }
  .note {
    margin:16px 0 0; padding:11px 13px; border-radius:11px;
    background:#F1F2F5; border-left:3px solid var(--mine);
    font-size:12.5px; line-height:1.55; color:var(--muted);
  }
</style>
</head>
<body>
<div class="wrap">

  <!-- Start -->
  <section id="setup">
    <img class="brand" src="/brand/logo-horizontal.svg" alt="lumo">
    <p class="sub" id="t-tagline"></p>

    <div class="card" style="margin-top:18px">
      <label for="name" id="t-nameLabel"></label>
      <input id="name" autocomplete="nickname">

      <label for="lang" id="t-langLabel"></label>
      <select id="lang"></select>

      <label for="room" id="t-roomLabel"></label>
      <input id="room" autocapitalize="none" autocorrect="off">
      <p class="sub" id="t-roomHint" style="font-size:12.5px;margin-top:6px"></p>
      <p class="note" id="t-privacy"></p>

      <button class="primary" id="enter"></button>
    </div>
  </section>

  <!-- Chat -->
  <section id="chat" class="hide" style="display:flex;flex-direction:column;flex:1;min-height:0">
    <div class="bar">
      <span class="logo-wrap">
        <img class="brand-small" src="/brand/logo-mark.svg" alt="lumo">
        <span id="count" class="count">0</span>
      </span>
      <div class="room" id="roomLabel"></div>
      <button id="bell" class="bell"></button>
      <select id="langSwitch"></select>
    </div>
    <div id="log"></div>
    <div id="err" class="err hide"></div>
    <div id="emojiPanel" class="emoji-panel hide">
      <div id="emojiTabs" class="emoji-tabs"></div>
      <div id="emojiGrid" class="emoji-grid"></div>
    </div>
    <div class="composer">
      <button id="emojiBtn" class="emoji-btn" type="button" aria-expanded="false">🙂</button>
      <textarea id="draft" rows="1"></textarea>
      <button id="send" disabled></button>
    </div>
  </section>

</div>

<script src="/i18n.js"></script>
<script src="/socket.io/socket.io.js"></script>
<script>
const LANGS = [
  ["de","Deutsch"],["de-CH","Deutsch (Schweiz)"],
  ["pt-PT","Português (Portugal)"],["pt-BR","Português (Brasil)"],
  ["en","English (UK)"],["en-US","English (US)"],
  ["es","Español (España)"],["es-419","Español (Latinoamérica)"],
  ["fr","Français"],["it","Italiano"],["nl","Nederlands"],["pl","Polski"],
  ["ru","Русский"],["uk","Українська"],["tr","Türkçe"],["ar","العربية"],
  ["zh","中文 (简体)"],["zh-TW","中文 (繁體)"],["ja","日本語"],["ko","한국어"],
  ["hi","हिन्दी"],["sv","Svenska"],["ro","Română"],["da","Dansk"],["no","Norsk"],
  ["fi","Suomi"],["cs","Čeština"],["hu","Magyar"],["el","Ελληνικά"],["he","עברית"],
  ["th","ไทย"],["vi","Tiếng Việt"],["id","Bahasa Indonesia"]
];
const RTL = new Set(["ar","he","fa","ur"]);
const $ = (id) => document.getElementById(id);
const T = (k, v) => window.LUMO_T.t(k, v);

// Sprachauswahl fuellen
for (const sel of [$("lang"), $("langSwitch")]) {
  sel.innerHTML = LANGS.map(([c,l]) => `<option value="${c}">${l}</option>`).join("");
}

// Browsersprache und letzte Eingaben vorbelegen
const saved = JSON.parse(localStorage.getItem("lumo") || "{}");
function guessLang() {
  const full = (navigator.language || "de");
  const norm = full.replace("_", "-");
  const codes = LANGS.map(([c]) => c);
  // Erst die volle Kennung (pt-BR), dann die Basissprache, dann die erste passende Variante.
  if (codes.includes(norm)) return norm;
  const base = norm.slice(0, 2);
  if (codes.includes(base)) return base;
  const variant = codes.find((c) => c.startsWith(base + "-"));
  return variant || "de";
}
$("name").value = saved.name || "";
$("room").value = saved.room || "";
$("lang").value = saved.lang || guessLang();

let socket, me = {};
let deviceId = localStorage.getItem("lumo-device");
if (!deviceId) {
  deviceId = "d-" + Math.random().toString(36).slice(2) + Date.now().toString(36);
  localStorage.setItem("lumo-device", deviceId);
}
const msgs = new Map();
const asked = new Set();


/* ------------------------------------------------------------------
   Oberflaeche in der Sprache, die jemand fuer seine Nachrichten waehlt.
------------------------------------------------------------------- */
function applyLanguage(code) {
  const L = window.LUMO_T;
  L.set(code);
  document.documentElement.lang = code;
  document.documentElement.dir = RTL.has(code.slice(0, 2)) ? "rtl" : "ltr";

  for (const key of ["tagline", "nameLabel", "langLabel", "roomLabel", "roomHint", "privacy"]) {
    const el = $("t-" + key);
    if (el) el.textContent = L.t(key);
  }
  $("name").placeholder = L.t("namePlaceholder");
  $("room").placeholder = L.t("roomPlaceholder");
  $("enter").textContent = L.t("enter");
  $("draft").placeholder = L.t("write");
  $("send").textContent = L.t("send");
  updateBell();
  msgs.forEach(render);
}

$("lang").onchange = (e) => applyLanguage(e.target.value);

$("enter").onclick = () => {
  const name = $("name").value.trim() || "Gast";
  const lang = $("lang").value;
  const room = ($("room").value.trim() || "lobby").toLowerCase();
  localStorage.setItem("lumo", JSON.stringify({ name, lang, room }));
  me = { name, lang, room };
  start();
};

function start() {
  $("setup").classList.add("hide");
  $("chat").classList.remove("hide");
  $("roomLabel").textContent = "#" + me.room;
  $("langSwitch").value = me.lang;

  socket = io();
  socket.on("connect", () => {
    socket.emit("join", { roomCode: me.room, name: me.name, lang: me.lang, device: deviceId });
    /* Beim Start erneut anmelden, damit Raum, Name und Sprache aktuell bleiben. */
    if (soundOn() && "Notification" in window && Notification.permission === "granted") {
      registerPush().catch(() => {});
    }
  });

  socket.on("history", (list) => { list.forEach((m) => add(m, false)); });
  socket.on("message", (m) => add(m, true));
  socket.on("system", (ev) => {
    const d = document.createElement("div");
    d.className = "system";
    d.textContent = typeof ev === "string" ? ev : T(ev.type, { name: ev.name });
    $("log").appendChild(d); scrollDown();
  });
  socket.on("lang", ({ id, lang }) => {
    const m = msgs.get(id); if (!m) return;
    m.lang = lang; render(m);
  });
  socket.on("translated", ({ id, lang, text }) => {
    const m = msgs.get(id); if (!m) return;
    m.tr[lang] = text; render(m);
  });
  socket.on("translationError", ({ id }) => {
    showErr(T("errTranslate"));
    const m = msgs.get(id); if (m) { m.failed = true; render(m); }
  });
  socket.on("tooFast", () => {
    showErr(T("errTooFast"));
    /* Die Nachricht wurde nicht angenommen - den Text zurueck ins Feld,
       damit niemand neu tippen muss. */
    if (!draft.value.trim() && lastSent) {
      draft.value = lastSent;
      draft.style.height = "auto";
      draft.style.height = Math.min(draft.scrollHeight, 120) + "px";
      $("send").disabled = false;
    }
  });
  socket.on("quotaReached", ({ id }) => {
    showErr(T("errQuota"));
    const m = msgs.get(id); if (m) { m.failed = true; render(m); }
  });
}

$("langSwitch").onchange = (e) => {
  me.lang = e.target.value;
  localStorage.setItem("lumo", JSON.stringify(me));
  socket.emit("setLang", { lang: me.lang });
  applyLanguage(me.lang);
  if (soundOn()) registerPush().catch(() => {});
};

function add(m, live) {
  if (msgs.has(m.id)) return;
  m.live = Boolean(live) && m.device !== deviceId;   // eigene Nachrichten nie melden
  msgs.set(m.id, m);
  const row = document.createElement("div");
  row.id = "m" + m.id;
  row.className = "row " + (m.device === deviceId ? "mine" : "theirs");
  row.innerHTML = '<div class="bubble"></div><div class="meta"></div>';
  $("log").appendChild(row);
  render(m);
  scrollDown();
}

function render(m) {
  const row = $("m" + m.id); if (!row) return;
  const bubble = row.querySelector(".bubble");
  const meta = row.querySelector(".meta");
  const needs = m.lang !== me.lang;
  const shown = needs ? m.tr[me.lang] : m.text;

  if (needs && !shown && !m.failed) {
    const key = m.id + ":" + me.lang;
    if (!asked.has(key)) { asked.add(key); socket.emit("need", { id: m.id, lang: me.lang }); }
    bubble.innerHTML = '<span class="waiting"></span>';
    bubble.firstChild.textContent = T("translating");
  } else {
    const text = shown || m.text;
    bubble.textContent = "";
    const span = document.createElement("span");
    span.dir = RTL.has(me.lang) ? "rtl" : "auto";
    span.textContent = text;
    bubble.appendChild(span);
    if (m.open) {
      const o = document.createElement("div");
      o.className = "orig";
      o.dir = RTL.has(m.lang) ? "rtl" : "auto";
      o.textContent = m.text;
      bubble.appendChild(o);
    }
    if (m.live) notify(m, text);
  }

  meta.textContent = "";
  const who = document.createElement("span");
  who.textContent = m.name;
  meta.appendChild(who);
  if (needs && shown) {
    const b = document.createElement("button");
    const nice = (LANGS.find(([c]) => c === m.lang) || [])[1] || m.lang.toUpperCase();
    b.textContent = m.open ? T("hideOriginal") : T("original", { lang: nice });
    b.onclick = () => { m.open = !m.open; render(m); };
    meta.appendChild(b);
  }
}

const draft = $("draft");
draft.addEventListener("input", () => {
  $("send").disabled = !draft.value.trim();
  draft.style.height = "auto";
  draft.style.height = Math.min(draft.scrollHeight, 120) + "px";
});
draft.addEventListener("keydown", (e) => {
  if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); sendMsg(); }
});
$("send").onclick = sendMsg;

let lastSent = "";

function sendMsg() {
  const text = draft.value.trim();
  if (!text) return;
  lastSent = text;
  socket.emit("send", { text });
  draft.value = ""; draft.style.height = "auto"; $("send").disabled = true;
}

/* ------------------------------------------------------------------
   Smileys

   Eine feste Auswahl statt aller Unicode-Zeichen: die Datei soll klein
   bleiben. Die Reiter tragen selbst ein Zeichen als Beschriftung - so
   braucht die Auswahl keine Uebersetzung in dreizehn Sprachen.

   Die Zeichen stehen durch Leerzeichen getrennt. Zusammengesetzte wie
   ❤️ oder ✌️ bestehen aus mehreren Codepunkten und zerfallen, wenn man
   den Text zeichenweise durchgeht - mit split(" ") bleiben sie heil.
------------------------------------------------------------------ */
const EMOJI = [
  ["🕘", ""],
  ["🙂", "😀 😃 😄 😁 😆 😅 🤣 😂 🙂 🙃 😉 😊 😇 🥰 😍 🤩 😘 😗 😚 😙 🥲 😋 😛 😜 🤪 😝 🤗 🤭 🤔 🤨 😐 😑 😶 🙄 😏 😣 😥 😮 🤐 😯 😪 😫 🥱 😴 😌 😛 🤤 😒 😓 😔 😕 🙃 🤑 😲 🙁 😖 😞 😟 😤 😢 😭 😦 😧 😨 😩 🤯 😬 😰 😱 🥵 🥶 😳 🤪 😵 😡 😠 🤬 😷 🤒 🤕 🤢 🤮 🤧 😇 🥳 🥸 🤠 😎 🤓 🧐 😈 👿 💀 👻 👽 🤖 💩"],
  ["👍", "👍 👎 👌 ✌️ 🤞 🤟 🤘 🤙 👈 👉 👆 👇 ☝️ ✋ 🤚 🖐️ 🖖 👋 🤝 🙏 ✍️ 💪 🦾 🤳 👀 👁️ 👄 👅 🧠 🦷 👶 🧒 👦 👧 🧑 👨 👩 🧓 👴 👵 🙋 🙆 🙅 🤷 🤦 💁 🙇 🚶 🏃 💃 🕺 👫 👬 👭 👪 🫂"],
  ["❤️", "❤️ 🧡 💛 💚 💙 💜 🖤 🤍 🤎 💔 ❣️ 💕 💞 💓 💗 💖 💘 💝 💟 💋 👑 💎 🔥 ✨ 🌟 ⭐ 💫 ⚡ 💥 🎉 🎊 🎈 🎁 🎀 🥂 🍻 🎂 🧁 ☕ 🍵 🍺 🍷 🎵 🎶 🎤 🎧 🎸 🎹 🎬 📷 💡 🔔 📣 💬 💭"],
  ["🍕", "🍏 🍎 🍐 🍊 🍋 🍌 🍉 🍇 🍓 🫐 🍒 🍑 🥭 🍍 🥥 🥝 🍅 🥑 🥦 🥬 🥒 🌶️ 🌽 🥕 🧄 🧅 🥔 🥐 🥖 🍞 🧀 🥚 🍳 🥞 🧇 🥓 🍔 🍟 🍕 🌭 🥪 🌮 🌯 🥗 🍿 🍝 🍜 🍲 🍣 🍱 🍤 🍚 🍦 🍰 🍫 🍬 🍭 🍩 🍪"],
  ["⚽", "⚽ 🏀 🏈 ⚾ 🎾 🏐 🏉 🎱 🏓 🏸 🥊 ⛳ 🏹 🎣 🎿 🎯 🎮 🎲 ♟️ 🚗 🚕 🚙 🚌 🏎️ 🚓 🚑 🚒 🚲 🛵 🏍️ ✈️ 🚀 🚁 ⛵ 🚤 🚢 🏠 🏡 🏢 🏥 🏨 🏪 ⛪ 🗼 🗽 ⛲ ⛺ 🌍 🌎 🌏 🌙 ⛰️ 🏔️ 🌋 🏖️ 🏝️"],
  ["🐶", "🐶 🐱 🐭 🐹 🐰 🦊 🐻 🐼 🐨 🐯 🦁 🐮 🐷 🐸 🐵 🙈 🙉 🙊 🐔 🐧 🐦 🐤 🦆 🦅 🦉 🐺 🐗 🐴 🦄 🐝 🐛 🦋 🐌 🐞 🐜 🕷️ 🐢 🐍 🐙 🦀 🐠 🐟 🐬 🐳 🦈 🐘 🐫 🦒 🐄 🐎 🐑 🐐 🦌 🐕 🐈 🌵 🌲 🌳 🌴 🌱 🍀 🍃 🍁 🌺 🌻 🌹 🌷 🌸 💐 🍄"],
  ["✅", "✅ ❌ ❎ ➕ ➖ ✖️ ❓ ❔ ❕ ❗ ‼️ ⁉️ 💯 🔴 🟠 🟡 🟢 🔵 🟣 ⚫ ⚪ 🔺 🔻 🔶 🔷 ⚠️ 🚫 ⛔ 📛 ♻️ ✔️ ☑️ 📌 📍 🔒 🔓 ⏰ ⌛ ⏳ 🔋 📱 💻 ⌨️ 🖨️ 📁 📄 📅 📊 ✏️ 📝 💰 💶 🛒 🎓 ⚙️ 🔧 🔨"],
];

const emojiBtn = $("emojiBtn"), emojiPanel = $("emojiPanel");
const emojiTabs = $("emojiTabs"), emojiGrid = $("emojiGrid");

/* Zuletzt benutzte, wie bei WhatsApp. Liegt nur im Browser. */
function recentEmoji() {
  try { return JSON.parse(localStorage.getItem("lumoEmoji") || "[]"); } catch { return []; }
}
function rememberEmoji(ch) {
  const list = [ch, ...recentEmoji().filter((c) => c !== ch)].slice(0, 24);
  try { localStorage.setItem("lumoEmoji", JSON.stringify(list)); } catch {}
  EMOJI[0][1] = list.join(" ");
}

function showEmojiGroup(i) {
  [...emojiTabs.children].forEach((b, n) =>
    b.setAttribute("aria-selected", n === i ? "true" : "false"));
  emojiGrid.textContent = "";
  const chars = EMOJI[i][1] ? EMOJI[i][1].split(" ") : [];
  for (const ch of chars) {
    const b = document.createElement("button");
    b.type = "button";
    b.textContent = ch;
    b.onclick = () => { insertEmoji(ch); rememberEmoji(ch); };
    emojiGrid.appendChild(b);
  }
}

function insertEmoji(ch) {
  const a = draft.selectionStart ?? draft.value.length;
  const b = draft.selectionEnd ?? draft.value.length;
  draft.value = draft.value.slice(0, a) + ch + draft.value.slice(b);
  const pos = a + ch.length;
  draft.focus();
  draft.setSelectionRange(pos, pos);
  /* Loest Hoehenanpassung und den Senden-Knopf mit aus, statt beides
     hier noch einmal zu schreiben. */
  draft.dispatchEvent(new Event("input"));
}

function toggleEmoji(open) {
  const show = open === undefined ? emojiPanel.classList.contains("hide") : open;
  emojiPanel.classList.toggle("hide", !show);
  emojiBtn.setAttribute("aria-expanded", show ? "true" : "false");
  if (show) showEmojiGroup(recentEmoji().length ? 0 : 1);
}

EMOJI[0][1] = recentEmoji().join(" ");
for (let i = 0; i < EMOJI.length; i++) {
  const t = document.createElement("button");
  t.type = "button";
  t.textContent = EMOJI[i][0];
  t.setAttribute("aria-selected", "false");
  t.onclick = () => showEmojiGroup(i);
  emojiTabs.appendChild(t);
}

emojiBtn.onclick = (e) => { e.stopPropagation(); toggleEmoji(); };
document.addEventListener("click", (e) => {
  if (!emojiPanel.classList.contains("hide") &&
      !emojiPanel.contains(e.target) && e.target !== emojiBtn) toggleEmoji(false);
});
document.addEventListener("keydown", (e) => { if (e.key === "Escape") toggleEmoji(false); });

function scrollDown() { $("log").scrollTop = $("log").scrollHeight; }
function showErr(t) {
  const e = $("err"); e.textContent = t; e.classList.remove("hide");
  setTimeout(() => e.classList.add("hide"), 5000);
}


/* ------------------------------------------------------------------
   Benachrichtigungen
   Klingelt, wenn eine Nachricht ankommt, waehrend die App nicht im
   Vordergrund ist. Der Text erscheint bereits uebersetzt.
------------------------------------------------------------------- */
const notified = new Set();
let unread = 0;
const baseTitle = document.title;

function soundOn() {
  return localStorage.getItem("lumo-sound") === "1";
}

function updateBell() {
  const b = $("bell");
  const granted = ("Notification" in window) && Notification.permission === "granted";
  const on = granted && soundOn();
  b.classList.toggle("on", on);
  b.textContent = on ? T("soundOn") : T("soundOff");
}

$("bell").onclick = async () => {
  if (!("Notification" in window)) {
    showErr(T("errNoNotif"));
    return;
  }
  if (soundOn() && Notification.permission === "granted") {
    localStorage.setItem("lumo-sound", "0");
    updateBell();
    unregisterPush().catch(() => {});
    return;
  }
  let perm = Notification.permission;
  if (perm !== "granted") perm = await Notification.requestPermission();
  if (perm === "granted") {
    localStorage.setItem("lumo-sound", "1");
    beep();
    registerPush()
      .then((ok) => {
        if (!ok) showErr(T("errPushPartial"));
      })
      .catch(() => {});
  } else {
    showErr(T("errBlocked"));
  }
  updateBell();
};

/* Kurzer Ton, ohne Audiodatei. */
let audioCtx = null;
function beep() {
  try {
    audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)();
    if (audioCtx.state === "suspended") audioCtx.resume();
    const t = audioCtx.currentTime;
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = "sine";
    osc.frequency.setValueAtTime(880, t);
    osc.frequency.setValueAtTime(1175, t + 0.09);
    gain.gain.setValueAtTime(0.0001, t);
    gain.gain.exponentialRampToValueAtTime(0.25, t + 0.02);
    gain.gain.exponentialRampToValueAtTime(0.0001, t + 0.35);
    osc.connect(gain).connect(audioCtx.destination);
    osc.start(t);
    osc.stop(t + 0.36);
  } catch {}
}

/* Zahl am App-Symbol auf dem Startbildschirm, wie bei WhatsApp. */
function setBadge(n) {
  try {
    if (n > 0 && navigator.setAppBadge) navigator.setAppBadge(n);
    else if (navigator.clearAppBadge) navigator.clearAppBadge();
  } catch {}
}

function showCount() {
  const el = $("count");
  if (!el) return;
  el.textContent = unread > 99 ? "99+" : String(unread);
  el.classList.toggle("show", unread > 0);
  document.title = unread > 0 ? `(${unread}) ${baseTitle}` : baseTitle;
  setBadge(unread);
}

function notify(m, text) {
  if (notified.has(m.id)) return;
  notified.add(m.id);
  if (!document.hidden) return;          // App ist im Vordergrund, kein Alarm noetig

  unread++;
  showCount();
  if (!soundOn()) return;

  beep();
  if (navigator.vibrate) navigator.vibrate([120, 60, 120]);

  const opts = {
    body: text,
    icon: "/icons/icon-192-v2.png",
    badge: "/icons/icon-192-v2.png",
    tag: "lumo-" + m.id,
    lang: me.lang,
  };
  try {
    if (navigator.serviceWorker && navigator.serviceWorker.ready) {
      navigator.serviceWorker.ready
        .then((reg) => reg.showNotification(m.name, opts))
        .catch(() => new Notification(m.name, opts));
    } else {
      new Notification(m.name, opts);
    }
  } catch {}
}

function clearUnread() {
  unread = 0;
  showCount();
  if (navigator.serviceWorker?.controller) {
    navigator.serviceWorker.controller.postMessage({ type: "clear-badge" });
  }
}

document.addEventListener("visibilitychange", () => {
  if (!document.hidden) clearUnread();
});
window.addEventListener("focus", clearUnread);

/* ------------------------------------------------------------------
   Push: Benachrichtigungen auch bei geschlossener App.
   Braucht VAPID-Schluessel auf dem Server. Fehlen sie, passiert hier
   nichts und die App laeuft unveraendert weiter.
------------------------------------------------------------------- */
function b64ToUint8(base64) {
  const pad = "=".repeat((4 - (base64.length % 4)) % 4);
  const raw = atob((base64 + pad).replace(/-/g, "+").replace(/_/g, "/"));
  return Uint8Array.from([...raw].map((c) => c.charCodeAt(0)));
}

async function registerPush() {
  if (!("serviceWorker" in navigator) || !("PushManager" in window)) return false;
  if (Notification.permission !== "granted") return false;

  const info = await fetch("/api/push-key").then((r) => r.json()).catch(() => null);
  if (!info || !info.enabled || !info.key) return false;

  const reg = await navigator.serviceWorker.ready;
  let sub = await reg.pushManager.getSubscription();
  if (!sub) {
    sub = await reg.pushManager.subscribe({
      userVisibleOnly: true,
      applicationServerKey: b64ToUint8(info.key),
    });
  }

  await fetch("/api/subscribe", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({
      subscription: sub,
      room: me.room,
      device: deviceId,
      name: me.name,
      lang: me.lang,
    }),
  });
  return true;
}

async function unregisterPush() {
  if (!("serviceWorker" in navigator)) return;
  const reg = await navigator.serviceWorker.ready.catch(() => null);
  if (!reg) return;
  const sub = await reg.pushManager.getSubscription();
  if (!sub) return;
  await fetch("/api/unsubscribe", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ endpoint: sub.endpoint }),
  }).catch(() => {});
  await sub.unsubscribe().catch(() => {});
}

applyLanguage($("lang").value);

if ("serviceWorker" in navigator) navigator.serviceWorker.register("/sw.js").catch(() => {});
</script>
