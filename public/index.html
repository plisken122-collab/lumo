<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#E4E5E9">
<meta name="robots" content="noindex, nofollow">
<title>lumo</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="manifest" href="/manifest.json">
<link rel="apple-touch-icon" href="/icons/icon-192-v2.png">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500&display=swap" rel="stylesheet">
<style>
  :root {
    --canvas:#E4E5E9; --surface:#fff; --ink:#20222B; --muted:#6C6F7E;
    --line:#D2D4DB; --mine:#384C9E; --danger:#9B2C25;
  }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html, body { height:100%; }
  body {
    margin:0; background:var(--canvas); color:var(--ink);
    font-family:'DM Sans', system-ui, sans-serif; font-size:16px;
  }
  .wrap {
    max-width:520px; margin:0 auto; height:100dvh;
    display:flex; flex-direction:column;
    padding:14px 14px calc(14px + env(safe-area-inset-bottom));
  }
  .brand { display:block; height:42px; width:auto; }
  .brand-small { display:block; height:26px; width:auto; }
  .logo-wrap { position:relative; flex-shrink:0; }
  .count {
    position:absolute; top:-7px; right:-9px; min-width:19px; height:19px;
    padding:0 5px; border-radius:10px; background:#C0392B; color:#fff;
    font-size:11px; font-weight:500; line-height:19px; text-align:center;
    box-shadow:0 0 0 2px var(--canvas); display:none;
  }
  .count.show { display:block; }
  .sub { margin:6px 0 0; font-size:14px; color:var(--muted); }
  .card { background:var(--surface); border:1px solid var(--line); border-radius:16px; padding:14px; }
  label { display:block; font-size:13px; color:var(--muted); margin:14px 0 5px; }
  input, select, textarea {
    width:100%; font-family:inherit; font-size:16px; color:var(--ink);
    background:var(--surface); border:1px solid var(--line); border-radius:10px; padding:11px 12px;
  }
  textarea { resize:none; }
  input:focus, select:focus, textarea:focus { outline:2px solid var(--ink); outline-offset:1px; }
  button { font-family:inherit; border:none; cursor:pointer; }
  .primary {
    width:100%; margin-top:20px; background:var(--mine); color:#fff;
    border-radius:12px; padding:14px; font-size:16px; font-weight:500;
  }
  .primary:disabled { background:var(--line); cursor:default; }

  .bar { display:flex; align-items:center; gap:10px; margin-bottom:10px; }
  .bar .room { font-size:13px; color:var(--muted); flex:1; }
  .bar select { width:auto; padding:7px 9px; font-size:13px; border-radius:9px; }
  .bell {
    background:var(--surface); border:1px solid var(--line); color:var(--muted);
    border-radius:9px; padding:7px 10px; font-size:13px; white-space:nowrap;
  }
  .bell.on { background:var(--mine); border-color:var(--mine); color:#fff; }

  #log {
    flex:1; overflow-y:auto; background:var(--surface); border:1px solid var(--line);
    border-radius:18px; padding:14px; display:flex; flex-direction:column; gap:12px;
  }
  .row { max-width:85%; display:flex; flex-direction:column; gap:4px; }
  .row.mine { align-self:flex-end; align-items:flex-end; }
  .row.theirs { align-self:flex-start; align-items:flex-start; }
  .bubble { border-radius:16px; padding:10px 13px; font-size:15px; line-height:1.45; white-space:pre-wrap; word-break:break-word; }
  .mine .bubble { background:var(--mine); color:#fff; border-bottom-right-radius:5px; }
  .theirs .bubble { background:#F1F2F5; border-bottom-left-radius:5px; }
  .meta { font-size:11.5px; color:var(--muted); display:flex; gap:8px; align-items:center; }
  .meta button { background:none; padding:0; color:var(--muted); font-size:11.5px; text-decoration:underline; }
  .meta .more { text-decoration:none; font-size:15px; line-height:1; padding:0 3px; }
  .deleted { opacity:.6; font-style:italic; }

  /* Kleines Menue zum Loeschen. Liegt ueber allem und schliesst bei
     einem Klick daneben. */
  .sheet {
    position:fixed; inset:0; z-index:20;
    background:rgba(32,34,43,.35);
    display:flex; align-items:flex-end; justify-content:center;
  }
  .sheet-inner {
    background:var(--surface); width:100%; max-width:520px;
    border-radius:16px 16px 0 0; padding:8px;
    padding-bottom:calc(8px + env(safe-area-inset-bottom));
  }
  .sheet-inner button {
    display:block; width:100%; text-align:left;
    background:transparent; color:var(--ink);
    padding:14px 14px; font-size:15px; border-radius:10px;
  }
  .sheet-inner button:hover { background:var(--canvas); }
  .sheet-inner .danger { color:var(--danger); }
  .orig { margin-top:8px; padding-top:8px; border-top:1px solid var(--line); font-size:14px; opacity:.85; }
  .mine .orig { border-top-color:rgba(255,255,255,.28); }
  .waiting { opacity:.45; animation:pulse 1.2s infinite; }
  @keyframes pulse { 0%,100%{opacity:.3} 50%{opacity:.85} }
  @media (prefers-reduced-motion:reduce) { .waiting { animation:none; } }
  .system { align-self:center; font-size:12px; color:var(--muted); }

  .composer { display:flex; gap:4px; margin-top:12px; background:var(--surface); border:1px solid var(--line); border-radius:14px; padding:6px; }
  /* flex + min-width:0, sonst drueckt das Feld die Knoepfe aus der
     Zeile statt selbst schmaler zu werden. */
  .composer textarea { border:none; background:transparent; padding:11px 8px; flex:1 1 auto; min-width:0; }
  .composer textarea:focus { outline:none; }
  .composer button { border-radius:10px; padding:0 14px; background:var(--mine); color:#fff; font-size:14px; font-weight:500; }
  .composer button:disabled { background:var(--line); cursor:default; }

  /* Auswahl zum Einfuegen. Auf dem Handy hat man die Tastatur dafuer,
     am Rechner nicht - dort ist das der einzige bequeme Weg. */
  .composer .emoji-btn {
    background:transparent; padding:0 7px; font-size:20px; line-height:1;
    color:var(--muted); border-radius:10px; flex-shrink:0;
  }
  .composer .emoji-btn:hover { background:var(--canvas); }
  .composer .emoji-btn[aria-expanded="true"] { background:var(--canvas); }
  .emoji-panel {
    background:var(--surface); border:1px solid var(--line);
    border-radius:14px; padding:8px; margin-bottom:8px;
  }
  .emoji-tabs { display:flex; gap:4px; margin-bottom:6px; }
  .emoji-tabs button {
    flex:1; padding:6px 0; font-size:17px; line-height:1;
    border-radius:8px; background:transparent;
  }
  .emoji-tabs button[aria-selected="true"] { background:var(--canvas); }
  .emoji-grid {
    display:grid; grid-template-columns:repeat(8, 1fr); gap:2px;
    max-height:168px; overflow-y:auto;
  }
  .emoji-grid button {
    padding:5px 0; font-size:21px; line-height:1.15;
    border-radius:8px; background:transparent;
  }
  .emoji-grid button:hover { background:var(--canvas); }

  /* Mikrofon und laufende Aufnahme */
  .composer .mic-btn {
    background:transparent; padding:0 7px; font-size:19px; line-height:1;
    color:var(--muted); border-radius:10px; flex-shrink:0;
  }
  .composer .mic-btn:hover { background:var(--canvas); }
  /* Laeuft das Diktat, muss man das sehen - der Text erscheint zwar im
     Feld, aber bis zum ersten Wort vergeht ein Moment. */
  .composer .mic-btn.on {
    background:var(--danger); border-radius:10px;
    animation:pulse 1.4s ease-in-out infinite;
  }
  .rec {
    display:flex; align-items:center; gap:10px; flex:1 1 auto;
    /* Ohne min-width:0 schrumpft ein Flex-Element nie unter die Breite
       seines Inhalts - die Mitschrift schoebe den Senden-Knopf aus dem
       Bild. */
    min-width:0;
    padding:0 4px; font-size:14px; color:var(--ink);
  }
  .rec-dot {
    width:10px; height:10px; border-radius:50%; background:var(--danger);
    flex-shrink:0; animation:pulse 1.2s ease-in-out infinite;
  }
  @keyframes pulse { 0%,100% { opacity:1 } 50% { opacity:.25 } }
  .rec-time { font-variant-numeric:tabular-nums; }
  .rec-hint { color:var(--muted); font-size:12.5px; overflow:hidden;
              text-overflow:ellipsis; white-space:nowrap;
              flex:1 1 auto; min-width:0; }
  .composer .rec-cancel {
    background:transparent; color:var(--muted); padding:0 8px;
    font-size:13px; text-decoration:underline; flex-shrink:0;
  }
  .composer #recSend { flex-shrink:0; }

  /* Abgeschickte Sprachnachricht */
  .voice { display:flex; align-items:center; gap:9px; }
  .voice audio { height:34px; max-width:200px; }
  .voice-len { font-size:12px; opacity:.75; font-variant-numeric:tabular-nums; }
  .no-text { display:block; margin-top:5px; font-size:12px; opacity:.7; }
  .err { color:var(--danger); font-size:13px; margin:8px 2px 0; }
  .hide { display:none !important; }
  .note {
    margin:16px 0 0; padding:11px 13px; border-radius:11px;
    background:#F1F2F5; border-left:3px solid var(--mine);
    font-size:12.5px; line-height:1.55; color:var(--muted);
  }
</style>
</head>
<body>
<div class="wrap">

  <!-- Start -->
  <section id="setup">
    <img class="brand" src="/brand/logo-horizontal.svg" alt="lumo">
    <p class="sub" id="t-tagline"></p>

    <div class="card" style="margin-top:18px">
      <label for="name" id="t-nameLabel"></label>
      <input id="name" autocomplete="nickname">

      <label for="lang" id="t-langLabel"></label>
      <select id="lang"></select>

      <label for="room" id="t-roomLabel"></label>
      <input id="room" autocapitalize="none" autocorrect="off">
      <p class="sub" id="t-roomHint" style="font-size:12.5px;margin-top:6px"></p>
      <p class="note" id="t-privacy"></p>

      <button class="primary" id="enter"></button>
    </div>
  </section>

  <!-- Chat -->
  <section id="chat" class="hide" style="display:flex;flex-direction:column;flex:1;min-height:0">
    <div class="bar">
      <span class="logo-wrap">
        <img class="brand-small" src="/brand/logo-mark.svg" alt="lumo">
        <span id="count" class="count">0</span>
      </span>
      <div class="room" id="roomLabel"></div>
      <button id="bell" class="bell"></button>
      <select id="langSwitch"></select>
    </div>
    <div id="log"></div>
    <div id="err" class="err hide"></div>
    <div id="emojiPanel" class="emoji-panel hide">
      <div id="emojiTabs" class="emoji-tabs"></div>
      <div id="emojiGrid" class="emoji-grid"></div>
    </div>
    <div class="composer" id="composer">
      <button id="emojiBtn" class="emoji-btn" type="button" aria-expanded="false">🙂</button>
      <textarea id="draft" rows="1"></textarea>
      <button id="dictBtn" class="mic-btn" type="button">🗣️</button>
      <button id="micBtn" class="mic-btn" type="button">🎤</button>
      <button id="send" disabled></button>
    </div>
    <div class="composer hide" id="recBar">
      <div class="rec">
        <span class="rec-dot"></span>
        <span class="rec-time" id="recTime">0:00</span>
        <span class="rec-hint" id="recHint"></span>
        <button class="rec-cancel" id="recCancel" type="button"></button>
      </div>
      <button id="recSend"></button>
    </div>
  </section>

</div>

<script src="/i18n.js"></script>
<script src="/socket.io/socket.io.js"></script>
<script>
const LANGS = [
  ["de","Deutsch"],["de-CH","Deutsch (Schweiz)"],
  ["pt-PT","Português (Portugal)"],["pt-BR","Português (Brasil)"],
  ["en","English (UK)"],["en-US","English (US)"],
  ["es","Español (España)"],["es-419","Español (Latinoamérica)"],
  ["fr","Français"],["it","Italiano"],["nl","Nederlands"],["pl","Polski"],
  ["ru","Русский"],["uk","Українська"],["tr","Türkçe"],["ar","العربية"],
  ["zh","中文 (简体)"],["zh-TW","中文 (繁體)"],["ja","日本語"],["ko","한국어"],
  ["hi","हिन्दी"],["sv","Svenska"],["ro","Română"],["da","Dansk"],["no","Norsk"],
  ["fi","Suomi"],["cs","Čeština"],["hu","Magyar"],["el","Ελληνικά"],["he","עברית"],
  ["th","ไทย"],["vi","Tiếng Việt"],["id","Bahasa Indonesia"]
];
const RTL = new Set(["ar","he","fa","ur"]);
const $ = (id) => document.getElementById(id);
const T = (k, v) => window.LUMO_T.t(k, v);

// Sprachauswahl fuellen
for (const sel of [$("lang"), $("langSwitch")]) {
  sel.innerHTML = LANGS.map(([c,l]) => `<option value="${c}">${l}</option>`).join("");
}

// Browsersprache und letzte Eingaben vorbelegen
const saved = JSON.parse(localStorage.getItem("lumo") || "{}");
function guessLang() {
  const full = (navigator.language || "de");
  const norm = full.replace("_", "-");
  const codes = LANGS.map(([c]) => c);
  // Erst die volle Kennung (pt-BR), dann die Basissprache, dann die erste passende Variante.
  if (codes.includes(norm)) return norm;
  const base = norm.slice(0, 2);
  if (codes.includes(base)) return base;
  const variant = codes.find((c) => c.startsWith(base + "-"));
  return variant || "de";
}
$("name").value = saved.name || "";
$("room").value = saved.room || "";
$("lang").value = saved.lang || guessLang();

let socket, me = {};
/* Kennung dieser Fassung. Muss mit der Zahl in sw.js mitwandern, sonst
   laesst sich nicht mehr erkennen, welche Seite ein Geraet wirklich
   geladen hat. */
const BUILD = "v24";

let deviceId = localStorage.getItem("lumo-device");
if (!deviceId) {
  deviceId = "d-" + Math.random().toString(36).slice(2) + Date.now().toString(36);
  localStorage.setItem("lumo-device", deviceId);
}
const msgs = new Map();
const asked = new Set();


/* ------------------------------------------------------------------
   Oberflaeche in der Sprache, die jemand fuer seine Nachrichten waehlt.
------------------------------------------------------------------- */
function applyLanguage(code) {
  const L = window.LUMO_T;
  L.set(code);
  document.documentElement.lang = code;
  document.documentElement.dir = RTL.has(code.slice(0, 2)) ? "rtl" : "ltr";

  for (const key of ["tagline", "nameLabel", "langLabel", "roomLabel", "roomHint", "privacy"]) {
    const el = $("t-" + key);
    if (el) el.textContent = L.t(key);
  }
  $("name").placeholder = L.t("namePlaceholder");
  $("room").placeholder = L.t("roomPlaceholder");
  $("enter").textContent = L.t("enter");
  $("draft").placeholder = L.t("write");
  $("send").textContent = L.t("send");
  $("micBtn").title = L.t("recordTitle");
  $("dictBtn").title = L.t("dictateTitle");
  $("recSend").textContent = L.t("send");
  $("recCancel").textContent = L.t("cancel");
  updateBell();
  msgs.forEach(render);
}

$("lang").onchange = (e) => applyLanguage(e.target.value);

$("enter").onclick = () => {
  const name = $("name").value.trim() || "Gast";
  const lang = $("lang").value;
  const room = ($("room").value.trim() || "lobby").toLowerCase();
  localStorage.setItem("lumo", JSON.stringify({ name, lang, room }));
  me = { name, lang, room };
  start();
};

function start() {
  $("setup").classList.add("hide");
  $("chat").classList.remove("hide");
  $("roomLabel").textContent = "#" + me.room;
  $("langSwitch").value = me.lang;

  socket = io();
  socket.on("connect", () => {
    socket.emit("join", {
      roomCode: me.room, name: me.name, lang: me.lang, device: deviceId,
      /* Nur zwei Angaben zur Fehlersuche: welche Fassung der Seite hier
         laeuft, und ob der Browser ueberhaupt mitschreiben kann. Kein
         Geraetename, keine Kennung - das steht sonst gleich in /health. */
      build: BUILD,
      speech: Boolean(window.SpeechRecognition || window.webkitSpeechRecognition),
    });
    /* Beim Start erneut anmelden, damit Raum, Name und Sprache aktuell bleiben. */
    if (soundOn() && "Notification" in window && Notification.permission === "granted") {
      registerPush().catch(() => {});
    }
  });

  socket.on("history", (list) => { list.forEach((m) => add(m, false)); });
  socket.on("message", (m) => add(m, true));
  socket.on("deleted", ({ id }) => {
    const m = msgs.get(id);
    if (!m) return;
    m.deleted = true; m.text = ""; m.tr = {}; m.audioSeconds = null; m.open = false;
    render(m);
  });
  socket.on("system", (ev) => {
    const d = document.createElement("div");
    d.className = "system";
    d.textContent = typeof ev === "string" ? ev : T(ev.type, { name: ev.name });
    $("log").appendChild(d); scrollDown();
  });
  socket.on("lang", ({ id, lang }) => {
    const m = msgs.get(id); if (!m) return;
    m.lang = lang; render(m);
  });
  socket.on("translated", ({ id, lang, text }) => {
    const m = msgs.get(id); if (!m) return;
    m.tr[lang] = text; render(m);
  });
  socket.on("translationError", ({ id }) => {
    showErr(T("errTranslate"));
    const m = msgs.get(id); if (m) { m.failed = true; render(m); }
  });
  socket.on("tooFast", () => {
    showErr(T("errTooFast"));
    /* Die Nachricht wurde nicht angenommen - den Text zurueck ins Feld,
       damit niemand neu tippen muss. */
    if (!draft.value.trim() && lastSent) {
      draft.value = lastSent;
      draft.style.height = "auto";
      draft.style.height = Math.min(draft.scrollHeight, 120) + "px";
      $("send").disabled = false;
    }
  });
  socket.on("quotaReached", ({ id }) => {
    showErr(T("errQuota"));
    const m = msgs.get(id); if (m) { m.failed = true; render(m); }
  });
}

$("langSwitch").onchange = (e) => {
  me.lang = e.target.value;
  localStorage.setItem("lumo", JSON.stringify(me));
  socket.emit("setLang", { lang: me.lang });
  applyLanguage(me.lang);
  if (soundOn()) registerPush().catch(() => {});
};

function add(m, live) {
  if (msgs.has(m.id)) return;
  /* Fuer mich geloescht: taucht auch nach einem Neustart nicht wieder
     auf, die Kennung liegt im Browser. */
  if (verborgen.has(m.id)) return;
  m.live = Boolean(live) && m.device !== deviceId;   // eigene Nachrichten nie melden
  msgs.set(m.id, m);
  const row = document.createElement("div");
  row.id = "m" + m.id;
  row.className = "row " + (m.device === deviceId ? "mine" : "theirs");
  row.innerHTML = '<div class="bubble"></div><div class="meta"></div>';
  $("log").appendChild(row);
  render(m);
  scrollDown();
}

function render(m) {
  const row = $("m" + m.id); if (!row) return;
  const bubble = row.querySelector(".bubble");
  const meta = row.querySelector(".meta");
  /* Geloeschtes hat keinen Inhalt mehr - weder uebersetzen noch
     abspielen, nur der Hinweis bleibt. */
  if (m.deleted) {
    bubble.textContent = "";
    const s = document.createElement("span");
    s.className = "deleted";
    s.textContent = T("deletedNote");
    bubble.appendChild(s);
    meta.textContent = "";
    const wer = document.createElement("span");
    wer.textContent = m.name;
    meta.appendChild(wer);
    meta.appendChild(menueKnopf(m));
    return;
  }

  /* Ohne Text gibt es nichts zu uebersetzen - das betrifft
     Sprachnachrichten, bei denen die Mitschrift fehlgeschlagen ist.
     Sonst wartet die Blase ewig auf eine Uebersetzung von nichts. */
  const needs = m.lang !== me.lang && Boolean(m.text.trim());
  const shown = needs ? m.tr[me.lang] : m.text;

  if (needs && !shown && !m.failed) {
    const key = m.id + ":" + me.lang;
    if (!asked.has(key)) { asked.add(key); socket.emit("need", { id: m.id, lang: me.lang }); }
    bubble.innerHTML = '<span class="waiting"></span>';
    bubble.firstChild.textContent = T("translating");
  } else {
    const text = shown || m.text;
    bubble.textContent = "";
    /* Sprachnachricht: Abspieler zuerst, die Mitschrift darunter. Ohne
       Mitschrift bleibt es beim Abspieler mit einem Hinweis. */
    if (m.audioSeconds != null) {
      const box = document.createElement("div");
      box.className = "voice";
      const a = document.createElement("audio");
      a.controls = true;
      a.preload = "none";
      a.src = "/medien/" + encodeURIComponent(m.id);
      const len = document.createElement("span");
      len.className = "voice-len";
      len.textContent = Math.floor(m.audioSeconds / 60) + ":" +
                        String(m.audioSeconds % 60).padStart(2, "0");
      box.appendChild(a);
      box.appendChild(len);
      bubble.appendChild(box);
      if (!m.text.trim()) {
        const hint = document.createElement("span");
        hint.className = "no-text";
        hint.textContent = T("noTranscript");
        bubble.appendChild(hint);
      }
    }
    const span = document.createElement("span");
    span.dir = RTL.has(me.lang) ? "rtl" : "auto";
    span.textContent = text;
    if (m.audioSeconds != null) span.className = "no-text";
    bubble.appendChild(span);
    if (m.open) {
      const o = document.createElement("div");
      o.className = "orig";
      o.dir = RTL.has(m.lang) ? "rtl" : "auto";
      o.textContent = m.text;
      bubble.appendChild(o);
    }
    if (m.live) notify(m, text);
  }

  meta.textContent = "";
  const who = document.createElement("span");
  who.textContent = m.name;
  meta.appendChild(who);
  /* Nur anbieten, wenn das Original ueberhaupt anders aussieht. Bei
     reinen Smiley-Nachrichten gibt der Server den Text unveraendert
     zurueck - da waere "Original: ..." ein Verweis auf dasselbe. */
  if (needs && shown && shown !== m.text) {
    const b = document.createElement("button");
    const nice = (LANGS.find(([c]) => c === m.lang) || [])[1] || m.lang.toUpperCase();
    b.textContent = m.open ? T("hideOriginal") : T("original", { lang: nice });
    b.onclick = () => { m.open = !m.open; render(m); };
    meta.appendChild(b);
  }
  meta.appendChild(menueKnopf(m));
}

function menueKnopf(m) {
  const b = document.createElement("button");
  b.type = "button";
  b.className = "more";

const draft = $("draft");

/* Wie bei WhatsApp: Bei leerem Feld stehen Sprechen und Aufnehmen da,
   sobald Text drin ist, weicht beides dem Senden-Knopf. Vier Knoepfe
   nebeneinander passen auf ein schmales Handy nicht. Waehrend eines
   laufenden Diktats bleibt sein Knopf stehen - man muss es ja
   beenden koennen. */
function composerButtons() {
  const hatText = Boolean(draft.value.trim());
  $("send").classList.toggle("hide", !hatText);
  $("micBtn").classList.toggle("hide", hatText || !canRecord);
  $("dictBtn").classList.toggle("hide", (hatText && !diktiert) || !kannErkennen);
}

draft.addEventListener("input", () => {
  $("send").disabled = !draft.value.trim();
  composerButtons();
  draft.style.height = "auto";
  draft.style.height = Math.min(draft.scrollHeight, 120) + "px";
});
draft.addEventListener("keydown", (e) => {
  if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); sendMsg(); }
});
$("send").onclick = sendMsg;

let lastSent = "";

function sendMsg() {
  /* Erst das Diktat beenden - sonst hoert es nach dem Senden weiter zu
     und schreibt in das gerade geleerte Feld. Das Beenden traegt auch
     das letzte Wort noch ein, deshalb steht es vor dem Auslesen. */
  if (diktiert) stoppeDiktat();
  const text = draft.value.trim();
  if (!text) return;
  lastSent = text;
  socket.emit("send", { text });
  draft.value = ""; draft.style.height = "auto"; $("send").disabled = true;
}

function rememberEmoji(ch) {
  const list = [ch, ...recentEmoji().filter((c) => c !== ch)].slice(0, 24);

  EMOJI[0][1] = list.join(" ");

function showEmojiGroup(i) {

    b.setAttribute("aria-selected", n === i ? "true" : "false"));

    b.type = "button";
    b.textContent = ch;
    b.onclick = () => { insertEmoji(ch); rememberEmoji(ch); };
    emojiGrid.appendChild(b);
  }
}

function insertEmoji(ch) {
  const a = draft.selectionStart ?? draft.value.length;
  const b = draft.selectionEnd ?? draft.value.length;
  draft.value = draft.value.slice(0, a) + ch + draft.value.slice(b);
  const pos = a + ch.length;
  draft.focus();
  draft.setSelectionRange(pos, pos);

     hier noch einmal zu schreiben. */

/* ------------------------------------------------------------------
   Sprachnachrichten

   Zwei Dinge laufen gleichzeitig: Der MediaRecorder nimmt auf, und die
   Spracherkennung des Browsers schreibt nebenher mit. Die Mitschrift
   reist als gewoehnlicher Nachrichtentext mit und wird danach uebersetzt
   wie jede getippte Nachricht - so muss der Server nichts von Audio
   verstehen.

   Die Erkennung gibt es nicht ueberall: In Chrome und auf Android laeuft
   sie, auf dem iPhone praktisch nicht. Dort geht die Aufnahme trotzdem
   raus, nur eben ohne mitlesbaren Text.
------------------------------------------------------------------ */
const MAX_SECONDS = 120;
const micBtn = $("micBtn"), recBar = $("recBar"), composer = $("composer");
const recTime = $("recTime"), recHint = $("recHint");

let recorder = null, chunks = [], recStart = 0, recTimer = null;
let recognizer = null, transcript = "", recCancelled = false;

const canRecord = Boolean(navigator.mediaDevices?.getUserMedia && window.MediaRecorder);

/* Das erste Format, das der Browser wirklich kann. Chrome und Firefox
   nehmen webm/opus, Safari mp4. */
function pickMime() {
  for (const t of ["audio/webm;codecs=opus", "audio/webm", "audio/mp4", "audio/ogg"]) {
    if (MediaRecorder.isTypeSupported(t)) return t;
  }
  return "";
}

function tickTime() {
  const s = Math.floor((Date.now() - recStart) / 1000);
  recTime.textContent = Math.floor(s / 60) + ":" + String(s % 60).padStart(2, "0");
  if (s >= MAX_SECONDS) stopRecording(false);
}

/* Chrome auf Android ignoriert continuous: Die Erkennung hoert nach der
   ersten Sprechpause von selbst auf. Deshalb sammeln wir das Ergebnis
   ausserhalb und starten nach jedem Ende neu, solange noch aufgenommen
   wird. Ohne das kommt bei einem ganzen Satz fast nichts an. */
let hoertZu = false;
let neustarts = 0;        // wie oft die Erkennung sich neu starten musste
let letzteVorschau = "";  // letzter Zwischenstand, falls kein endgueltiger kommt
let festText = "";        // Mitschrift aus abgeschlossenen Durchlaeufen
let laufText = "";        // Mitschrift des laufenden Durchlaufs

/* Beendet die Erkennung und wartet kurz auf ihr letztes Wort. Ohne diese
   Wartezeit liest der Aufrufer den Text in derselben Millisekunde aus,
   in der gestoppt wird - und bekommt nichts. */
function beendeErkennung(fertig) {
  if (!recognizer) { fertig(); return; }
  const r = recognizer;
  recognizer = null;
  let erledigt = false;
  const einmal = () => {
    if (erledigt) return;
    erledigt = true;
    if (!transcript && letzteVorschau) transcript = letzteVorschau.trim();
    fertig();
  };
  r.onend = einmal;
  r.onerror = einmal;
  setTimeout(einmal, 1500);
  try { r.stop(); } catch { einmal(); }
}

/* Meldet nur, WIE es ausging - nie, was gesprochen wurde. Fehlerkuerzel
   und Zeichenzahl reichen zur Fehlersuche und verraten nichts. */
function meldeSprache(info) {
  try { socket.emit("speechInfo", info); } catch {}
}

function startListening() {
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  transcript = "";
  /* Das Kuerzel steht hier bewusst dran: Nur so laesst sich von aussen
     unterscheiden, ob der Browser die Erkennung nicht kennt oder ob eine
     veraltete Fassung der Seite laeuft. */
  if (!SR) { recHint.textContent = T("noTranscript") + " (unsupported)"; return; }
  /* Sofort sichtbar machen, dass mitgeschrieben wird - sonst sieht ein
     stiller Anfang genauso aus wie ein Fehlschlag. */
  recHint.textContent = T("listening");
  hoertZu = true;
  neustarts = 0;
  letzteVorschau = "";
  festText = ""; laufText = "";
  meldeSprache({ neu: true });
  starteErkennung(SR);
}

function starteErkennung(SR) {
  try {
    recognizer = new SR();
    recognizer.lang = me.lang;
    recognizer.continuous = true;
    recognizer.interimResults = true;

    recognizer.onresult = (e) => {
      /* Wie beim Diktat: neu zusammensetzen, nicht anhaengen. Sonst
         steht jedes fertige Wort mehrfach da. */
      let fest = "", lose = "";
      for (let i = 0; i < e.results.length; i++) {
        const r = e.results[i];
        if (r.isFinal) fest += r[0].transcript + " ";
        else lose += r[0].transcript + " ";
      }
      laufText = fest.trim();
      transcript = (festText + " " + laufText).trim();
      const zeigen = (transcript + " " + lose.trim()).trim();
      /* Den Zwischenstand aufheben: Wird die Aufnahme beendet, bevor
         Chrome das Ergebnis endgueltig macht, ist er alles, was wir
         haben - und ungenauer Text schlaegt gar keinen. */
      if (zeigen) letzteVorschau = zeigen;
      if (zeigen) recHint.textContent = zeigen.slice(-60);
    };

    /* Vorzeitiges Ende ist auf Android der Normalfall, kein Fehler. */
    recognizer.onend = () => {
      if (!hoertZu) return;
      neustarts++;
      if (laufText) festText = (festText + " " + laufText).trim();
      laufText = "";
      setTimeout(() => { if (hoertZu) starteErkennung(SR); }, 120);
    };

    recognizer.onerror = (e) => {
      meldeSprache({ error: e.error });
      /* "no-speech" heisst nur: gerade war Stille. Weiterlaufen lassen. */
      if (e.error === "no-speech" || e.error === "aborted") return;
      hoertZu = false;
      recHint.textContent = T("noTranscript") + " (" + e.error + ")";
    };

    /* Meldet, dass die Erkennung wirklich angelaufen ist. Bleibt das
       aus, hat sie nie begonnen - und genau das unterscheidet stilles
       Scheitern von "laeuft, hoert aber nichts". */
    recognizer.onstart = () => meldeSprache({ gestartet: true });
    recognizer.onaudiostart = () => meldeSprache({ tonAn: true });

    recognizer.start();
  } catch (err) {
    hoertZu = false;
    recognizer = null;
    meldeSprache({ error: "throw:" + (err.name || "?") });
    recHint.textContent = T("noTranscript") + " (" + (err.name || "Start") + ")";
  }
}

async function startRecording() {
  /* Die Erkennung zuerst. Chrome auf Android gibt sie stillschweigend
     auf, wenn die Aufnahme das Mikrofon schon haelt - andersherum haben
     beide eine Chance. Schlaegt gleich die Aufnahme fehl, wird sie
     unten wieder abgeraeumt. */
  recStart = Date.now();
  recTime.textContent = "0:00";
  composer.classList.add("hide");
  recBar.classList.remove("hide");
  toggleEmoji(false);
  startListening();

  let stream;
  try {
    stream = await navigator.mediaDevices.getUserMedia({ audio: true });
  } catch {
    hoertZu = false;
    if (recognizer) { try { recognizer.abort(); } catch {} recognizer = null; }
    recBar.classList.add("hide");
    composer.classList.remove("hide");
    showErr(T("errMic"));
    return;
  }
  const mime = pickMime();
  try {
    recorder = mime ? new MediaRecorder(stream, { mimeType: mime }) : new MediaRecorder(stream);
  } catch {
    hoertZu = false;
    if (recognizer) { try { recognizer.abort(); } catch {} recognizer = null; }
    recBar.classList.add("hide");
    composer.classList.remove("hide");
    showErr(T("errMic"));
    stream.getTracks().forEach((t) => t.stop());
    return;
  }

  chunks = []; recCancelled = false;
  recorder.ondataavailable = (e) => { if (e.data.size) chunks.push(e.data); };
  recorder.onstop = () => {
    stream.getTracks().forEach((t) => t.stop());
    clearInterval(recTimer);
    recBar.classList.add("hide");
    composer.classList.remove("hide");

    const sekunden = Math.max(1, Math.round((Date.now() - recStart) / 1000));
    const aufnahme = new Blob(chunks, { type: recorder.mimeType });

    /* Erst das Weiterlaufen abschalten, dann auf das letzte Ergebnis
       warten - sonst startet onend die Erkennung wieder, und der Text
       waere beim Abschicken noch nicht da. */
    hoertZu = false;
    beendeErkennung(() => {
      meldeSprache({ ende: true, zeichen: transcript.length, laeufe: neustarts });
      if (recCancelled) return;
      sendVoice(aufnahme, sekunden);
    });
  };

  recorder.start();
  recTimer = setInterval(tickTime, 250);
}

function stopRecording(abbrechen) {
  recCancelled = Boolean(abbrechen);
  if (recorder && recorder.state !== "inactive") recorder.stop();
}

async function sendVoice(blob, sekunden) {
  if (blob.size < 800) { showErr(T("errTooShort")); return; }
  const base64 = await new Promise((ok) => {
    const fr = new FileReader();
    fr.onload = () => ok(String(fr.result).split(",")[1] || "");
    fr.readAsDataURL(blob);
  });
  try {
    const r = await fetch("/api/voice", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        room: me.room, device: deviceId, name: me.name, lang: me.lang,
        seconds: sekunden, transcript, mime: blob.type, audio: base64,
      }),
    });
    if (!r.ok) showErr(r.status === 429 ? T("errTooFast") : T("errVoice"));
  } catch {
    showErr(T("errVoice"));
  }
}

/* ------------------------------------------------------------------
   Diktieren

   Der andere Weg, und der einzige, der auf Android zuverlaessig laeuft:
   Hier hoert nur die Spracherkennung zu, es wird nichts aufgenommen.
   Damit streiten sich nicht zwei um das Mikrofon - genau daran ist die
   Mitschrift waehrend einer Sprachnachricht gescheitert.

   Der Text landet direkt im Eingabefeld und geht danach als ganz
   gewoehnliche Nachricht raus, wird also uebersetzt wie jede andere.
------------------------------------------------------------------ */
const dictBtn = $("dictBtn");
let diktiert = false, diktator = null;
let diktatBasis = "";  // was vor dem Diktat schon im Feld stand
let diktatFest = "";   // Ergebnis abgeschlossener Durchlaeufe
let diktatLauf = "";   // Ergebnis des laufenden Durchlaufs
let diktatSitzung = 0;     // laufende Nummer, sperrt Nachzuegler aus
let diktatLaeufe = 0;      // wie oft die Erkennung neu startete
let diktatErgebnisse = 0;  // wie viele Ergebnisse ankamen

/* Schneidet vom Anfang von "neu" weg, was am Ende von "alt" schon
   steht. Beim Neustart spielt Chrome den gepufferten Ton noch einmal
   durch die Erkennung - die neue Sitzung bringt das zuletzt Gesagte
   also erneut mit. Ohne dieses Abschneiden steht es doppelt da.

   Die Ueberlappung muss an einer Wortgrenze enden, sonst wuerde aus
   "das Sofa" faelschlich etwas abgeschnitten. */
function ohneUeberlappung(alt, neu) {
  if (!alt || !neu) return neu;
  /* Wortweise vergleichen, nicht zeichenweise: Chrome schreibt das
     erste Wort eines Ergebnisses gross und setzt Satzzeichen - "Hallo"
     und "hallo" sind sonst zwei verschiedene Texte, und das Doppelte
     rutscht durch. */
  const putzen = (w) => w.toLowerCase().replace(/[.,!?;:„“”"»«]/g, "");
  const a = alt.trim().split(/\s+/);
  const b = neu.trim().split(/\s+/);
  const max = Math.min(a.length, b.length);
  for (let n = max; n >= 1; n--) {
    let gleich = true;
    for (let i = 0; i < n; i++) {
      if (putzen(a[a.length - n + i]) !== putzen(b[i])) { gleich = false; break; }
    }
    if (gleich) return b.slice(n).join(" ");
  }
  return neu;
}

/* Setzt das Feld aus den drei Teilen zusammen. Mehrfache Leerzeichen
   fallen weg, damit an den Nahtstellen keine Luecken entstehen. */
function diktatText(lose) {
  const lauf = ohneUeberlappung(diktatFest, diktatLauf);
  const teile = [diktatFest, lauf, lose || ""].filter((t) => t);
  return (diktatBasis + teile.join(" ")).replace(/\s{2,}/g, " ").trimStart();
}

function schreibeDiktatFest() {
  const l = ohneUeberlappung(diktatFest, diktatLauf.trim());
  diktatLauf = "";
  if (!l) return;
  diktatFest = (diktatFest + " " + l).trim();
}

const kannErkennen = Boolean(window.SpeechRecognition || window.webkitSpeechRecognition);

function starteDiktat(SR) {
  /* Jede Sitzung bekommt eine Nummer. Chrome liefert nach dem Ende einer
     Sitzung noch Ergebnisse nach - ohne diese Sperre schreibt eine
     abgeloeste Sitzung ihren Text ein zweites Mal fest, und aus einem
     "hallo" werden drei. */
  const meine = ++diktatSitzung;
  const aktuell = () => meine === diktatSitzung;
  try {
    diktator = new SR();
    diktator.lang = me.lang;
    diktator.continuous = true;
    diktator.interimResults = true;

    /* Der ganze Durchlauf wird jedes Mal neu zusammengesetzt, nie
       angehaengt. Chrome liefert bei jedem Ereignis auch schon fertige
       Woerter erneut mit - wer die anhaengt, bekommt aus einem "Hallo"
       drei. */
    diktator.onresult = (e) => {
      if (!aktuell()) return;   // Nachzuegler einer abgeloesten Sitzung
      diktatErgebnisse++;
      /* Die Eintraege der Liste sind auf Android nicht getrennt, sondern
         bauen aufeinander auf: "Hallo", dann "Hallo ich liebe", dann
         "Hallo ich liebe dich" - alle als endgueltig. Einfach
         aneinanderhaengen ergaebe alles dreimal. Deshalb wird auch hier
         abgeschnitten, was schon dasteht. */
      let fest = "", lose = "";
      for (let i = 0; i < e.results.length; i++) {
        const r = e.results[i];
        const t = ((r[0] && r[0].transcript) || "").trim();
        if (!t) continue;
        if (r.isFinal) {
          const neu = ohneUeberlappung(fest, t);
          if (neu) fest = (fest + " " + neu).trim();
        } else {
          const basis = (fest + " " + lose).trim();
          const neu = ohneUeberlappung(basis, t);
          if (neu) lose = (lose + " " + neu).trim();
        }
      }
      diktatLauf = fest;
      draft.value = diktatText(lose);
      /* Loest Hoehenanpassung und den Senden-Knopf mit aus. */
      draft.dispatchEvent(new Event("input"));
    };

    /* Auf Android endet die Erkennung nach jeder Pause von selbst. Was
       dieser Durchlauf ergeben hat, wird dabei festgeschrieben - der
       naechste faengt mit leerer Ergebnisliste an. */
    diktator.onend = () => {
      if (!aktuell() || !diktiert) return;
      diktatLaeufe++;
      schreibeDiktatFest();
      setTimeout(() => { if (diktiert && aktuell()) starteDiktat(SR); }, 120);
    };

    diktator.onerror = (e) => {
      meldeSprache({ diktat: true, error: e.error });
      if (e.error === "no-speech" || e.error === "aborted") return;
      stoppeDiktat();
      showErr(T("noTranscript") + " (" + e.error + ")");
    };

    diktator.onstart = () => meldeSprache({ diktat: true, gestartet: true });
    diktator.start();
  } catch (err) {
    meldeSprache({ diktat: true, error: "throw:" + (err.name || "?") });
    stoppeDiktat();
    showErr(T("errMic"));
  }
}

function stoppeDiktat() {
  diktiert = false;
  dictBtn.classList.remove("on");
  draft.placeholder = T("write");
  composerButtons();
  if (diktator) { try { diktator.stop(); } catch {} diktator = null; }
  /* Was der letzte Durchlauf ergeben hat, gehoert noch dazu. */
  schreibeDiktatFest();
  draft.value = diktatText("");
  draft.dispatchEvent(new Event("input"));
  meldeSprache({ diktat: true, ende: true, zeichen: diktatFest.length,
                 laeufe: diktatLaeufe, ergebnisse: diktatErgebnisse });
}

function toggleDiktat() {
  if (diktiert) { stoppeDiktat(); draft.focus(); return; }
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!SR) { showErr(T("errMic")); return; }
  /* Schon Getipptes bleibt stehen, das Diktat haengt sich dahinter. */
  diktatBasis = draft.value.trim() ? draft.value.replace(/\s*$/, "") + " " : "";
  diktatFest = "";
  diktatLauf = "";
  diktatLaeufe = 0; diktatErgebnisse = 0;
  diktiert = true;
  dictBtn.classList.add("on");
  draft.placeholder = T("dictating");
  composerButtons();
  toggleEmoji(false);
  meldeSprache({ neu: true, diktat: true });
  starteDiktat(SR);
}

dictBtn.onclick = toggleDiktat;
composerButtons();

micBtn.onclick = () => {
  /* Nicht beides gleichzeitig - daran ist die Mitschrift gescheitert. */
  if (diktiert) stoppeDiktat();
  if (!recorder || recorder.state === "inactive") startRecording();
};
$("recSend").onclick = () => stopRecording(false);
$("recCancel").onclick = () => stopRecording(true);

/* ------------------------------------------------------------------
   Loeschen

   Zwei Arten, wie bei WhatsApp:

   "Fuer alle" geht nur bei eigenen Nachrichten. Der Server entfernt
   Text, Uebersetzungen und Aufnahme wirklich; stehen bleibt ein
   Hinweis, damit im Verlauf kein unerklaerliches Loch entsteht.

   "Fuer mich" bleibt auf diesem Geraet. Die Kennungen liegen im
   localStorage - andere sehen die Nachricht weiter.
------------------------------------------------------------------ */
function versteckte() {
  try { return new Set(JSON.parse(localStorage.getItem("lumo-hidden") || "[]")); }
  catch { return new Set(); }
}
let verborgen = versteckte();

function versteckeLokal(id) {
  verborgen.add(id);
  try { localStorage.setItem("lumo-hidden", JSON.stringify([...verborgen].slice(-500))); } catch {}
  const row = $("m" + id);
  if (row) row.remove();
  msgs.delete(id);
}

let sheet = null;
function schliesseSheet() {
  if (sheet) { sheet.remove(); sheet = null; }
}

function zeigeMenue(m) {
  schliesseSheet();
  sheet = document.createElement("div");
  sheet.className = "sheet";
  const box = document.createElement("div");
  box.className = "sheet-inner";

  /* Fuer alle nur, wenn sie von diesem Geraet kam und noch da ist. */
  if (m.device === deviceId && !m.deleted) {
    const a = document.createElement("button");
    a.type = "button";
    a.className = "danger";
    a.textContent = T("delForAll");
    a.onclick = () => { socket.emit("deleteForAll", { id: m.id }); schliesseSheet(); };
    box.appendChild(a);
  }

  const b = document.createElement("button");
  b.type = "button";
  b.textContent = T("delForMe");
  b.onclick = () => { versteckeLokal(m.id); schliesseSheet(); };
  box.appendChild(b);

  const c = document.createElement("button");
  c.type = "button";
  c.textContent = T("cancel");
  c.onclick = schliesseSheet;
  box.appendChild(c);

  sheet.appendChild(box);
  sheet.onclick = (e) => { if (e.target === sheet) schliesseSheet(); };
  document.body.appendChild(sheet);
}

document.addEventListener("keydown", (e) => { if (e.key === "Escape") schliesseSheet(); });

function scrollDown() { $("log").scrollTop = $("log").scrollHeight; }
function showErr(t) {
  const e = $("err"); e.textContent = t; e.classList.remove("hide");
  setTimeout(() => e.classList.add("hide"), 5000);
}


/* ------------------------------------------------------------------
   Benachrichtigungen
   Klingelt, wenn eine Nachricht ankommt, waehrend die App nicht im
   Vordergrund ist. Der Text erscheint bereits uebersetzt.
------------------------------------------------------------------- */
const notified = new Set();
let unread = 0;
const baseTitle = document.title;

function soundOn() {
  return localStorage.getItem("lumo-sound") === "1";
}

function updateBell() {
  const b = $("bell");
  const granted = ("Notification" in window) && Notification.permission === "granted";
  const on = granted && soundOn();
  b.classList.toggle("on", on);
  b.textContent = on ? T("soundOn") : T("soundOff");
}

$("bell").onclick = async () => {
  if (!("Notification" in window)) {
    showErr(T("errNoNotif"));
    return;
  }
  if (soundOn() && Notification.permission === "granted") {
    localStorage.setItem("lumo-sound", "0");
    updateBell();
    unregisterPush().catch(() => {});
    return;
  }
  let perm = Notification.permission;
  if (perm !== "granted") perm = await Notification.requestPermission();
  if (perm === "granted") {
    localStorage.setItem("lumo-sound", "1");
    beep();
    registerPush()
      .then((ok) => {
        if (!ok) showErr(T("errPushPartial"));
      })
      .catch(() => {});
  } else {
    showErr(T("errBlocked"));
  }
  updateBell();
};

/* Kurzer Ton, ohne Audiodatei. */
let audioCtx = null;
function beep() {
  try {
    audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)();
    if (audioCtx.state === "suspended") audioCtx.resume();
    const t = audioCtx.currentTime;
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = "sine";
    osc.frequency.setValueAtTime(880, t);
    osc.frequency.setValueAtTime(1175, t + 0.09);
    gain.gain.setValueAtTime(0.0001, t);
    gain.gain.exponentialRampToValueAtTime(0.25, t + 0.02);
    gain.gain.exponentialRampToValueAtTime(0.0001, t + 0.35);
    osc.connect(gain).connect(audioCtx.destination);
    osc.start(t);
    osc.stop(t + 0.36);
  } catch {}
}

/* Zahl am App-Symbol auf dem Startbildschirm, wie bei WhatsApp. */
function setBadge(n) {
  try {
    if (n > 0 && navigator.setAppBadge) navigator.setAppBadge(n);
    else if (navigator.clearAppBadge) navigator.clearAppBadge();
  } catch {}
}

function showCount() {
  const el = $("count");
  if (!el) return;
  el.textContent = unread > 99 ? "99+" : String(unread);
  el.classList.toggle("show", unread > 0);
  document.title = unread > 0 ? `(${unread}) ${baseTitle}` : baseTitle;
  setBadge(unread);
}

function notify(m, text) {
  if (notified.has(m.id)) return;
  notified.add(m.id);
  if (!document.hidden) return;          // App ist im Vordergrund, kein Alarm noetig

  unread++;
  showCount();
  if (!soundOn()) return;

  beep();
  if (navigator.vibrate) navigator.vibrate([120, 60, 120]);

  const opts = {
    body: text,
    icon: "/icons/icon-192-v2.png",
    badge: "/icons/icon-192-v2.png",
    tag: "lumo-" + m.id,
    lang: me.lang,
  };
  try {
    if (navigator.serviceWorker && navigator.serviceWorker.ready) {
      navigator.serviceWorker.ready
        .then((reg) => reg.showNotification(m.name, opts))
        .catch(() => new Notification(m.name, opts));
    } else {
      new Notification(m.name, opts);
    }
  } catch {}
}

function clearUnread() {
  unread = 0;
  showCount();
  if (navigator.serviceWorker?.controller) {
    navigator.serviceWorker.controller.postMessage({ type: "clear-badge" });
  }
}

document.addEventListener("visibilitychange", () => {
  if (!document.hidden) clearUnread();
});
window.addEventListener("focus", clearUnread);

/* ------------------------------------------------------------------
   Push: Benachrichtigungen auch bei geschlossener App.
   Braucht VAPID-Schluessel auf dem Server. Fehlen sie, passiert hier
   nichts und die App laeuft unveraendert weiter.
------------------------------------------------------------------- */
function b64ToUint8(base64) {
  const pad = "=".repeat((4 - (base64.length % 4)) % 4);
  const raw = atob((base64 + pad).replace(/-/g, "+").replace(/_/g, "/"));
  return Uint8Array.from([...raw].map((c) => c.charCodeAt(0)));
}

async function registerPush() {
  if (!("serviceWorker" in navigator) || !("PushManager" in window)) return false;
  if (Notification.permission !== "granted") return false;

  const info = await fetch("/api/push-key").then((r) => r.json()).catch(() => null);
  if (!info || !info.enabled || !info.key) return false;

  const reg = await navigator.serviceWorker.ready;
  let sub = await reg.pushManager.getSubscription();
  if (!sub) {
    sub = await reg.pushManager.subscribe({
      userVisibleOnly: true,
      applicationServerKey: b64ToUint8(info.key),
    });
  }

  await fetch("/api/subscribe", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({
      subscription: sub,
      room: me.room,
      device: deviceId,
      name: me.name,
      lang: me.lang,
    }),
  });
  return true;
}

async function unregisterPush() {
  if (!("serviceWorker" in navigator)) return;
  const reg = await navigator.serviceWorker.ready.catch(() => null);
  if (!reg) return;
  const sub = await reg.pushManager.getSubscription();
  if (!sub) return;
  await fetch("/api/unsubscribe", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ endpoint: sub.endpoint }),
  }).catch(() => {});
  await sub.unsubscribe().catch(() => {});
}

applyLanguage($("lang").value);

if ("serviceWorker" in navigator) navigator.serviceWorker.register("/sw.js").catch(() => {});
</script>
