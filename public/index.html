<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#E4E5E9" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#14161B" media="(prefers-color-scheme: dark)">

<title>Diralo — Chat in your language, they read in theirs</title>
<meta name="description" content="Free translation chat: everyone writes in their own language and reads in theirs. No account, nothing to install. Made for international couples, families and friends across a language barrier.">
<link rel="canonical" href="https://diralo.app/">
<!-- Social-Vorschau: sorgt dafuer, dass ein geteilter Link (WhatsApp,
     TikTok-Bio, Facebook, X ...) mit Titel, Text und Bild erscheint. -->
<meta property="og:type" content="website">
<meta property="og:site_name" content="Diralo">
<meta property="og:url" content="https://diralo.app/">
<meta property="og:title" content="Diralo — Chat in your language, they read in theirs">
<meta property="og:description" content="Free translation chat: everyone writes in their own language and reads in theirs. No account, nothing to install.">
<meta property="og:image" content="https://diralo.app/og-image.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:image:alt" content="Diralo — chat in your language, they read in theirs">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="Diralo — Chat in your language, they read in theirs">
<meta name="twitter:description" content="Free translation chat: everyone writes in their own language and reads in theirs. No account, nothing to install.">
<meta name="twitter:image" content="https://diralo.app/og-image.png">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="manifest" href="/manifest.json">
<link rel="apple-touch-icon" href="/icons/icon-192-v2.png">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500&display=swap" rel="stylesheet">
<style>
  :root {
    --canvas:#E4E5E9; --surface:#fff; --ink:#20222B; --muted:#6C6F7E;
    --line:#D2D4DB; --mine:#384C9E; --danger:#9B2C25;
  }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html, body { height:100%; }
  body {
    margin:0; background:var(--canvas); color:var(--ink);
    font-family:'DM Sans', system-ui, sans-serif; font-size:16px;
  }
  .wrap {
    max-width:520px; margin:0 auto; height:100dvh;
    display:flex; flex-direction:column;
    padding:14px 14px calc(14px + env(safe-area-inset-bottom));
  }
  /* Wortmarke als echter Text statt gezeichneter Pfade: Der Name laesst
     sich so aendern, ohne das Logo neu zu zeichnen. Die Bildmarke
     daneben bleibt, wie sie ist. */
  .brandline { display:flex; align-items:center; gap:10px; }
  .brandline img { display:block; height:40px; width:auto; }
  .brandline .wort { font-size:30px; font-weight:500; letter-spacing:-.01em; }
  .brand { display:block; height:42px; width:auto; }
  .brand-small { display:block; height:26px; width:auto; }
  .logo-wrap { position:relative; flex-shrink:0; }
  .count {
    position:absolute; top:-7px; right:-9px; min-width:19px; height:19px;
    padding:0 5px; border-radius:10px; background:#C0392B; color:#fff;
    font-size:11px; font-weight:500; line-height:19px; text-align:center;
    box-shadow:0 0 0 2px var(--canvas); display:none;
  }
  .count.show { display:block; }
  .sub { margin:6px 0 0; font-size:14px; color:var(--muted); }
  .card { background:var(--surface); border:1px solid var(--line); border-radius:16px; padding:14px; }
  label { display:block; font-size:13px; color:var(--muted); margin:14px 0 5px; }
  input, select, textarea {
    width:100%; font-family:inherit; font-size:16px; color:var(--ink);
    background:var(--surface); border:1px solid var(--line); border-radius:10px; padding:11px 12px;
  }
  textarea { resize:none; }
  input:focus, select:focus, textarea:focus { outline:2px solid var(--ink); outline-offset:1px; }
  button { font-family:inherit; border:none; cursor:pointer; }
  .primary {
    width:100%; margin-top:20px; background:var(--mine); color:#fff;
    border-radius:12px; padding:14px; font-size:16px; font-weight:500;
  }
  .primary:disabled { background:var(--line); cursor:default; }
  .secondary {
    width:100%; margin-top:10px; background:var(--surface); color:var(--mine);
    border:1px solid var(--mine); border-radius:12px; padding:12px;
    font-size:15px; font-weight:500;
  }

  .freebadge {
    display:inline-block; margin:12px 0 0; padding:4px 12px;
    background:#E7F0E4; color:#3E6B33; border-radius:999px;
    font-size:12.5px; font-weight:500;
  }

  /* Die drei Schritte unter der Tagline. Sagen dem, der allein kommt, dass
     Diralo zu zweit gedacht ist - kompakt, damit das Formular sichtbar bleibt. */
  .howto { margin:16px 0 0; }
  .howto .titel { margin:0 0 8px; font-size:13px; color:var(--muted); }
  .howto ol { list-style:none; margin:0; padding:0; display:flex; flex-direction:column; gap:8px; }
  .howto li { display:flex; align-items:center; gap:10px; font-size:13.5px; color:var(--ink); }
  .howto li b {
    flex-shrink:0; width:22px; height:22px; border-radius:11px;
    background:var(--mine); color:#fff; font-size:12.5px; font-weight:500;
    line-height:22px; text-align:center;
  }
  html[dir="rtl"] .howto li { flex-direction:row; }

  /* Kleines Live-Beispiel unter der Tagline: zeigt die Uebersetzung in
     Aktion, damit auch ein Besucher allein sofort sieht, was Diralo macht -
     ohne dass schon jemand zum Schreiben da sein muss. */
  .demo { margin:16px 0 0; display:flex; flex-direction:column; gap:7px; }
  .demo-row { display:flex; align-items:flex-end; gap:7px; }
  .demo-row.them { flex-direction:row-reverse; }
  .demo-bubble { max-width:78%; padding:9px 13px; border-radius:15px; font-size:14.5px; line-height:1.3; }
  .demo-row.you .demo-bubble { background:var(--surface); border:1px solid var(--line); color:var(--ink); border-bottom-left-radius:5px; }
  .demo-row.them .demo-bubble { background:var(--mine); color:#fff; border-bottom-right-radius:5px; }
  .demo-flag { font-size:18px; line-height:1; padding-bottom:4px; }
  .demo-cap { margin:3px 0 0; text-align:center; font-size:11.5px; color:var(--muted); }

  .bar { display:flex; align-items:center; gap:7px; margin-bottom:10px; }
  /* Der Chat-Code muss schrumpfen duerfen, sonst schiebt er die Knoepfe
     auf einem schmalen Handy aus der Zeile. */
  .bar .room {
    font-size:12px; color:var(--muted); flex:1 1 auto; min-width:0;
    overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
  }
  .bar select {
    width:auto; padding:7px 8px; font-size:13px; border-radius:9px;
    flex:0 1 auto; min-width:0; max-width:34vw;
  }
  /* Sprachwahl als kompakte Weltkugel: die native Auswahl liegt unsichtbar
     darueber und bleibt voll bedienbar. */
  .bar .langwrap {
    position:relative; flex-shrink:0; display:inline-flex; align-items:center;
    justify-content:center; font-size:19px; width:38px; height:34px;
    border:1px solid var(--line); border-radius:9px; background:var(--surface);
  }
  .bar .langwrap select {
    position:absolute; inset:0; width:100%; height:100%; max-width:none;
    margin:0; padding:0; opacity:0; border:none; cursor:pointer;
  }
  .bar .bell { flex-shrink:0; padding:7px 9px; }
  .bar .zurueck {
    flex-shrink:0; background:none; border:none; color:var(--ink);
    font-size:30px; font-weight:600; line-height:1; padding:2px 10px 2px 2px;
    margin-right:2px; cursor:pointer;
  }
  html[dir="rtl"] .bar .zurueck { transform:scaleX(-1); }
  .bell {
    background:var(--surface); border:1px solid var(--line); color:var(--muted);
    border-radius:9px; padding:7px 10px; font-size:13px; white-space:nowrap;
  }
  .bell.on { background:var(--mine); border-color:var(--mine); color:#fff; }
  /* Der Chat-Code ist jetzt ein Knopf - er soll aber aussehen wie
     vorher, nur anklickbar. */
  .bar button.room {
    background:none; border:none; text-align:left; padding:4px 0;
    font-family:inherit; cursor:pointer; text-decoration:underline;
    text-decoration-color:var(--line); text-underline-offset:3px;
  }
  .meine-chats { margin:14px 0 0; }
  .quotabar {
    background:#FBF3E4; border:1px solid #E4D5B0; border-radius:12px;
    padding:11px 13px; margin-bottom:10px; font-size:13.5px; line-height:1.45;
  }
  .quotabar a { display:inline-block; margin-top:4px; color:var(--mine); font-weight:500; }
  .neu {
    display:inline-block; min-width:20px; height:20px; padding:0 6px;
    margin-left:8px; border-radius:10px; background:#C0392B; color:#fff;
    font-size:11.5px; line-height:20px; text-align:center; vertical-align:middle;
  }
  .meine-chats .kopf { font-size:13px; color:var(--muted); margin:0 0 6px; }
  .meine-chats button {
    display:block; width:100%; text-align:left; background:var(--surface);
    border:1px solid var(--line); border-radius:10px; padding:10px 12px;
    margin-bottom:6px; font-size:14.5px; color:var(--ink);
    overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
  }
  /* Eine Chatzeile: der Chat zum Oeffnen, daneben ein x zum Entfernen. */
  .chat-zeile { display:flex; align-items:stretch; gap:6px; margin-bottom:6px; }
  .chat-zeile .chat-offen { flex:1; width:auto; min-width:0; margin-bottom:0; }
  .chat-zeile .chat-weg {
    flex-shrink:0; width:42px; background:var(--surface);
    border:1px solid var(--line); border-radius:10px; color:var(--muted);
    font-size:16px; line-height:1; margin-bottom:0; padding:0; text-align:center;
  }
  .chat-zeile .chat-weg:hover { color:var(--danger); border-color:var(--danger); }
  .sheet-inner .chat-zeile { margin-bottom:2px; }
  .sheet-inner .chat-weg { border:none; background:transparent; }
  .sheet-inner .chat-weg:hover { background:var(--canvas); color:var(--danger); }
  .sheet-kopf { margin:6px 12px 8px; font-size:13px; color:var(--muted); }
  .sheet-hinweis { margin:8px 14px 4px; font-size:12px; color:var(--muted); line-height:1.4; }
  .sheet-trenner { height:1px; background:var(--line); margin:8px 12px; }
  .fuss { margin:14px 0 0; text-align:center; font-size:12.5px; }
  .fuss a { color:var(--muted); }
  .linkish {
    background:none; color:var(--mine); padding:8px 0 0;
    font-size:13.5px; text-decoration:underline;
  }
  /* Der Installationshinweis. Sitzt ueber dem Chat, nimmt wenig Platz und
     laesst sich wegdruecken - er darf niemanden am Schreiben hindern. */
  .installbar {
    display:flex; align-items:center; gap:10px; flex-wrap:wrap;
    background:var(--surface); border:1px solid var(--line);
    border-radius:14px; padding:11px 13px; margin-bottom:10px;
  }
  .installbar > div:first-child { flex:1 1 180px; min-width:0; }
  .installbar strong { font-size:14px; font-weight:500; }
  .installbar p { margin:3px 0 0; font-size:12.5px; color:var(--muted); }
  .installbtns { display:flex; gap:6px; flex-shrink:0; }
  .installbtns button {
    font-size:13.5px; padding:8px 13px; border-radius:9px;
    background:var(--mine); color:#fff; white-space:nowrap;
  }
  .installbtns button.leer { background:transparent; color:var(--muted); }

  /* Hinweis auf der Startseite, wenn jemand ueber einen Link kommt. */
  .invited {
    margin:10px 0 0; padding:9px 12px; border-radius:10px;
    background:#EAEEF9; color:var(--mine); font-size:13px;
  }

  #logWrap { position:relative; flex:1; min-height:0; display:flex; }
  #log {
    flex:1; overflow-y:auto; background:var(--surface); border:1px solid var(--line);
    border-radius:18px; padding:14px; display:flex; flex-direction:column; gap:12px;
  }
  /* Der Hinweis im leeren Chat. Liegt ueber dem Verlauf, mittig, und laesst
     Klicks nur auf seinen Inhalt durch. */
  .leer {
    position:absolute; inset:0; display:flex; align-items:center; justify-content:center;
    padding:24px; text-align:center; pointer-events:none;
  }
  .leer.hide { display:none; }
  .leer-inner { max-width:320px; pointer-events:auto; }
  .leer-titel { margin:0 0 8px; font-size:16px; font-weight:500; }
  .leer-text { margin:0 0 18px; font-size:14px; color:var(--muted); line-height:1.5; }
  .leer-inner .primary { margin-top:0; max-width:280px; margin-left:auto; margin-right:auto; }
  .row { max-width:85%; display:flex; flex-direction:column; gap:4px; }
  .row.mine { align-self:flex-end; align-items:flex-end; }
  .row.theirs { align-self:flex-start; align-items:flex-start; }
  .bubble { border-radius:16px; padding:10px 13px; font-size:15px; line-height:1.45; white-space:pre-wrap; word-break:break-word; }
  .mine .bubble { background:var(--mine); color:#fff; border-bottom-right-radius:5px; }
  .theirs .bubble { background:#F1F2F5; border-bottom-left-radius:5px; }
  .meta { font-size:11.5px; color:var(--muted); display:flex; gap:8px; align-items:center; }
  .meta button { background:none; padding:0; color:var(--muted); font-size:11.5px; text-decoration:underline; }
  .deleted { opacity:.6; font-style:italic; }

  /* Kleines Menue zum Loeschen. Liegt ueber allem und schliesst bei
     einem Klick daneben. */
  .sheet {
    position:fixed; inset:0; z-index:20;
    background:rgba(32,34,43,.35);
    display:flex; align-items:flex-end; justify-content:center;
  }
  .sheet-inner {
    background:var(--surface); width:100%; max-width:520px;
    border-radius:16px 16px 0 0; padding:8px;
    padding-bottom:calc(8px + env(safe-area-inset-bottom));
  }
  .sheet-inner button {
    display:block; width:100%; text-align:left;
    background:transparent; color:var(--ink);
    padding:14px 14px; font-size:15px; border-radius:10px;
  }
  .sheet-inner button:hover { background:var(--canvas); }
  .sheet-inner .danger { color:var(--danger); }
  .orig { margin-top:8px; padding-top:8px; border-top:1px solid var(--line); font-size:14px; opacity:.85; }
  .mine .orig { border-top-color:rgba(255,255,255,.28); }
  .waiting { opacity:.45; animation:pulse 1.2s infinite; }
  @keyframes pulse { 0%,100%{opacity:.3} 50%{opacity:.85} }
  @media (prefers-reduced-motion:reduce) { .waiting { animation:none; } }
  .system { align-self:center; font-size:12px; color:var(--muted); }

  .composer { display:flex; gap:4px; margin-top:12px; background:var(--surface); border:1px solid var(--line); border-radius:14px; padding:6px; }
  /* flex + min-width:0, sonst drueckt das Feld die Knoepfe aus der
     Zeile statt selbst schmaler zu werden. */
  .composer textarea { border:none; background:transparent; padding:11px 8px; flex:1 1 auto; min-width:0; }
  .composer textarea:focus { outline:none; }
  .composer button { border-radius:10px; padding:0 14px; background:var(--mine); color:#fff; font-size:14px; font-weight:500; }
  .composer button:disabled { background:var(--line); cursor:default; }

  /* Auswahl zum Einfuegen. Auf dem Handy hat man die Tastatur dafuer,
     am Rechner nicht - dort ist das der einzige bequeme Weg. */
  .composer .emoji-btn {
    background:transparent; padding:0 7px; font-size:20px; line-height:1;
    color:var(--muted); border-radius:10px; flex-shrink:0;
  }
  .composer .emoji-btn:hover { background:var(--canvas); }
  .composer .emoji-btn[aria-expanded="true"] { background:var(--canvas); }
  .emoji-panel {
    background:var(--surface); border:1px solid var(--line);
    border-radius:14px; padding:8px; margin-bottom:8px;
  }
  .emoji-tabs { display:flex; gap:4px; margin-bottom:6px; }
  .emoji-tabs button {
    flex:1; padding:6px 0; font-size:17px; line-height:1;
    border-radius:8px; background:transparent;
  }
  .emoji-tabs button[aria-selected="true"] { background:var(--canvas); }
  .emoji-grid {
    display:grid; grid-template-columns:repeat(8, 1fr); gap:2px;
    max-height:168px; overflow-y:auto;
  }
  .emoji-grid button {
    padding:5px 0; font-size:21px; line-height:1.15;
    border-radius:8px; background:transparent;
  }
  .emoji-grid button:hover { background:var(--canvas); }

  /* Mikrofon und laufende Aufnahme */
  .composer .mic-btn {
    background:transparent; padding:0 7px; font-size:19px; line-height:1;
    color:var(--muted); border-radius:10px; flex-shrink:0;
  }
  .composer .mic-btn:hover { background:var(--canvas); }
  /* Laeuft das Diktat, muss man das sehen - der Text erscheint zwar im
     Feld, aber bis zum ersten Wort vergeht ein Moment. */
  .composer .mic-btn.on {
    background:var(--danger); border-radius:10px;
    animation:pulse 1.4s ease-in-out infinite;
  }
  .rec {
    display:flex; align-items:center; gap:10px; flex:1 1 auto;
    /* Ohne min-width:0 schrumpft ein Flex-Element nie unter die Breite
       seines Inhalts - die Mitschrift schoebe den Senden-Knopf aus dem
       Bild. */
    min-width:0;
    padding:0 4px; font-size:14px; color:var(--ink);
  }
  .rec-dot {
    width:10px; height:10px; border-radius:50%; background:var(--danger);
    flex-shrink:0; animation:pulse 1.2s ease-in-out infinite;
  }
  @keyframes pulse { 0%,100% { opacity:1 } 50% { opacity:.25 } }
  .rec-time { font-variant-numeric:tabular-nums; }
  .rec-hint { color:var(--muted); font-size:12.5px; overflow:hidden;
              text-overflow:ellipsis; white-space:nowrap;
              flex:1 1 auto; min-width:0; }
  .composer .rec-cancel {
    background:transparent; color:var(--muted); padding:0 8px;
    font-size:13px; text-decoration:underline; flex-shrink:0;
  }

  /* Abgeschickte Sprachnachricht */
  .voice { display:flex; align-items:center; gap:9px; }
  .voice audio { height:34px; max-width:200px; }
  .voice-len { font-size:12px; opacity:.75; font-variant-numeric:tabular-nums; }
  .no-text { display:block; margin-top:5px; font-size:12px; opacity:.7; }
  /* Bild im Chat */
  .foto {
    display:block; max-width:100%; max-height:320px; border-radius:12px;
    cursor:pointer; background:rgba(0,0,0,.04);
  }
  .foto + span:not(:empty) { display:block; margin-top:6px; }
  /* Geteilter Standort - eine antippbare Karte, die die Karten-App oeffnet. */
  .ortkarte { display:flex; align-items:center; gap:12px; text-decoration:none; color:inherit; padding:2px 0; }
  .ortpin { font-size:32px; line-height:1; flex-shrink:0; }
  .ortkarte b { display:block; font-size:15px; margin-bottom:2px; }
  .ortlink { font-size:13px; text-decoration:underline; opacity:.85; }
  /* Uhrzeit in der Namenszeile - etwas leiser als der Name. */
  .meta .zeit { opacity:.7; }
  /* Lese-Haken (gelesen) - in der Akzentfarbe, wie das Blau bei WhatsApp. */
  .gelesen-haken { color:var(--mine); font-weight:600; letter-spacing:-2px; }

  /* "... schreibt gerade"-Anzeige mit drei blinkenden Puenktchen. */
  .tippt { display:flex; align-items:center; gap:7px; font-size:12.5px; color:var(--muted); padding:2px 8px 6px; }
  .tippt-dots { display:inline-flex; gap:3px; }
  .tippt-dots i { width:5px; height:5px; border-radius:50%; background:var(--muted); animation:tipptblink 1.2s infinite; }
  .tippt-dots i:nth-child(2) { animation-delay:.2s; }
  .tippt-dots i:nth-child(3) { animation-delay:.4s; }
  @keyframes tipptblink { 0%,60%,100% { opacity:.25; } 30% { opacity:1; } }

  /* Antworten-/Zitat-Leiste ueber dem Eingabefeld. */
  .antwortbar {
    display:flex; align-items:center; gap:10px;
    background:var(--surface); border:1px solid var(--line);
    border-left:3px solid var(--mine); border-radius:10px;
    padding:7px 10px; margin-bottom:8px;
  }
  .antwort-info { flex:1; min-width:0; display:flex; flex-direction:column; }
  .antwort-name { font-size:12px; font-weight:500; color:var(--mine); }
  .antwort-text { font-size:13px; color:var(--muted); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .antwort-weg { background:none; border:none; font-size:16px; color:var(--muted); padding:4px 6px; line-height:1; cursor:pointer; flex-shrink:0; }

  /* Zitat innerhalb einer Nachrichtenblase - zeigt, worauf geantwortet wird. */
  .zitat {
    display:block; padding:4px 9px; margin-bottom:6px; border-radius:6px;
    border-left:3px solid var(--mine); background:rgba(0,0,0,.05); cursor:pointer;
  }
  .mine .zitat { border-left-color:rgba(255,255,255,.7); background:rgba(255,255,255,.15); }
  .zitat .z-name { display:block; font-size:12px; font-weight:600; }
  .zitat .z-text { display:block; font-size:13px; opacity:.85; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  /* Kurzes Hervorheben, wenn man ueber ein Zitat zur Originalnachricht springt. */
  .row .bubble { transition:box-shadow .25s; }
  .row.blink .bubble { box-shadow:0 0 0 2px var(--mine); }

  /* Aussprache-Fenster. */
  .aussprache { text-align:left; }
  .au-titel { font-size:13px; color:var(--muted); margin:0 0 5px; }
  .au-orig { font-size:18px; font-weight:500; margin:0 0 14px; line-height:1.35; }
  .au-hoeren {
    width:100%; margin:0 0 14px; background:var(--surface); color:var(--mine);
    border:1px solid var(--mine); border-radius:12px; padding:12px; font-size:15px; font-weight:500;
  }
  .au-laut { min-height:26px; margin-bottom:8px; }
  .au-lbl { display:block; font-size:12px; color:var(--muted); margin-bottom:4px; }
  .au-text { margin:0; font-size:18px; line-height:1.5; }
  .au-warten { margin:0; font-size:14px; color:var(--muted); }
  /* Aus dem Bild gelesener, uebersetzter Text */
  .bildtext { margin-top:7px; font-size:14px; line-height:1.45; white-space:pre-wrap; word-break:break-word; }
  .bildtext.leer { font-size:12.5px; opacity:.7; }
  .mine .bildtext { color:#fff; }
  .bildtext-btn {
    margin-top:7px; background:rgba(0,0,0,.06); border:none; border-radius:9px;
    padding:7px 11px; font-size:12.5px; color:var(--mine); cursor:pointer;
  }
  .mine .bildtext-btn { background:rgba(255,255,255,.22); color:#fff; }
  /* Bild gross - im eigenen Overlay, nicht in einem neuen Tab. Sonst
     kaeme man in der installierten App nicht mehr zurueck. */
  .lightbox {
    position:fixed; inset:0; z-index:40; background:rgba(0,0,0,.92);
    display:flex; align-items:center; justify-content:center; padding:16px;
  }
  .lightbox img { max-width:100%; max-height:100%; border-radius:8px; }
  .lightbox-zu, .lightbox-loesch {
    position:absolute; top:calc(10px + env(safe-area-inset-top));
    width:40px; height:40px; border-radius:20px; padding:0;
    background:rgba(0,0,0,.5); color:#fff; font-size:18px; line-height:1;
    border:1px solid rgba(255,255,255,.35);
  }
  .lightbox-zu { right:14px; }
  .lightbox-loesch { left:14px; }
  /* Vorschau, bevor das Bild rausgeht */
  .bild-vorschau { padding:4px 4px 6px; }
  .bild-vorschau img { display:block; max-width:100%; max-height:48vh; margin:0 auto 12px; border-radius:12px; }
  .bild-vorschau input { width:100%; }
  .bild-vorschau .knoepfe { display:flex; gap:8px; margin-top:12px; }
  .bild-vorschau .knoepfe button { flex:1; border-radius:11px; padding:12px; font-size:15px; font-weight:500; }
  .bild-vorschau .knoepfe .abbruch { background:var(--surface); border:1px solid var(--line); color:var(--muted); }
  .bild-vorschau .knoepfe .los { background:var(--mine); color:#fff; }
  .err { color:var(--danger); font-size:13px; margin:8px 2px 0; }
  .hide { display:none !important; }
  /* Datei-Felder unsichtbar, aber NICHT display:none - sonst feuert iOS
     Safari nach dem Kamerafoto kein change-Ereignis und es kommt nichts
     zurueck. Off-Screen mit Groesse 1px ist der sichere Weg. */
  .datei-versteckt { position:fixed; left:0; top:0; width:1px; height:1px; opacity:0; z-index:-1; }
  .note {
    margin:16px 0 0; padding:11px 13px; border-radius:11px;
    background:#F1F2F5; border-left:3px solid var(--mine);
    font-size:12.5px; line-height:1.55; color:var(--muted);
  }

  /* Dunkelmodus: folgt der Einstellung des Geraets. Handys schalten
     abends von selbst auf dunkel - dann wird auch Diralo dunkel, ohne
     dass man etwas einstellen muss. Die meisten Farben kommen aus den
     Variablen und passen sich hier von selbst an; die wenigen fest
     verdrahteten (helle Blasen, Kaesten) werden gezielt ueberschrieben. */
  @media (prefers-color-scheme: dark) {
    :root {
      --canvas:#14161B; --surface:#1E212A; --ink:#EAEBEF; --muted:#9A9EAC;
      --line:#2E323D; --mine:#5A67CE; --danger:#E06A62;
    }
    .theirs .bubble { background:#262A34; }
    .theirs .zitat { background:rgba(255,255,255,.07); }
    .note { background:#22252E; }
    .invited { background:#232838; }
    .quotabar { background:#2B2620; border-color:#4A4433; }
    .freebadge { background:#1E3320; color:#93D389; }
    .bildtext-btn { background:rgba(255,255,255,.08); }
    .foto { background:rgba(255,255,255,.05); }
  }
</style>
</head>
<body>
<div class="wrap">

  <!-- Start -->
  <section id="setup">
    <div class="brandline"><img src="/brand/logo-mark.svg" alt=""><span class="wort">Diralo</span></div>
    <p class="sub" id="t-tagline"></p>

    <!-- Nimmt gleich oben den Zweifel "kostet das was?" - ohne eine
         Preistabelle vor die Nase zu setzen. Der Preis kommt spaeter, wenn
         das Kontingent erreicht ist. -->
    <p class="freebadge" id="t-freeStart"></p>

    <!-- Kleines Beispiel, das die Uebersetzung sofort zeigt - bewusst auf
         Englisch, weil der meiste Zulauf ueber englische Videos kommt. So
         versteht auch ein Besucher allein in einer Sekunde, was Diralo tut. -->
    <div class="demo" aria-hidden="true">
      <div class="demo-row you">
        <span class="demo-flag">🇬🇧</span>
        <span class="demo-bubble">I miss you ❤️</span>
      </div>
      <div class="demo-row them">
        <span class="demo-flag">🇵🇹</span>
        <span class="demo-bubble">Sinto a tua falta ❤️</span>
      </div>
      <p class="demo-cap" id="t-demoCap">One writes — the other reads in their own language</p>
    </div>

    <!-- Kurz erklaert, dass man zu zweit ist: ein kalter Besucher allein
         sieht sonst einen leeren Raum und geht wieder. -->
    <div class="howto" id="howto">
      <p class="titel" id="t-howTitle"></p>
      <ol>
        <li><b>1</b><span id="t-howStep1"></span></li>
        <li><b>2</b><span id="t-howStep2"></span></li>
        <li><b>3</b><span id="t-howStep3"></span></li>
      </ol>
    </div>

    <div class="card" style="margin-top:18px">
      <label for="name" id="t-nameLabel"></label>
      <input id="name" autocomplete="nickname">

      <label for="lang" id="t-langLabel"></label>
      <select id="lang"></select>

      <label for="room" id="t-roomLabel"></label>
      <input id="room" autocapitalize="none" autocorrect="off">
      <p class="sub" id="t-roomHint" style="font-size:12.5px;margin-top:6px"></p>
      <button id="newChat" class="secondary" type="button"></button>
      <p class="invited hide" id="invitedNote"></p>

      <!-- Die Chats, in denen man schon war. Ohne sie muesste man sich
           jeden Code merken - und Einladungscodes sind Zufallsfolgen. -->
      <div id="meineChats" class="meine-chats hide"></div>
      <p class="note" id="t-privacy"></p>

      <button class="primary" id="enter"></button>
      <p class="fuss"><a href="/impressum" id="f-impressum">Impressum</a> &middot; <a href="/datenschutz" id="f-daten">Datenschutz</a> &middot; <a href="/agb" id="f-agb">AGB</a> &middot; <a href="/widerruf" id="f-widerruf">Widerruf</a> &middot; <a href="/preise" id="f-preise">Preise</a></p>
    </div>
  </section>

  <!-- Chat -->
  <!-- Hinweis zum Installieren. Erscheint erst im Chat, nie vorher:
       Wer noch nichts gesehen hat, installiert auch nichts. -->
  <div id="installBar" class="installbar hide">
    <div>
      <strong id="installTitle"></strong>
      <p id="installHint" class="hide"></p>
    </div>
    <div class="installbtns">
      <button id="installGo" class="hide"></button>
      <button id="installLater" class="leer"></button>
    </div>
  </div>

  <!-- Bleibt stehen, bis der Chat gewechselt wird: Hier entscheidet
       jemand, ob er bezahlt. Eine Meldung, die nach fuenf Sekunden
       verschwindet, taugt dafuer nicht. -->
  <div id="quotaBar" class="quotabar hide">
    <span id="quotaText"></span>
    <a id="quotaLink" href="/preise"></a>
  </div>

  <section id="chat" class="hide" style="display:flex;flex-direction:column;flex:1;min-height:0">
    <div class="bar">
      <button id="zurueckBtn" class="zurueck" type="button" aria-label="">←</button>
      <span class="logo-wrap">
        <img class="brand-small" src="/brand/logo-mark.svg" alt="Diralo">
        <span id="count" class="count">0</span>
      </span>
      <button class="room" id="roomLabel" type="button"></button>
      <button id="inviteBtn" class="bell"></button>
      <button id="bell" class="bell" type="button"></button>
      <span class="langwrap" id="langwrap">🌐<select id="langSwitch" aria-label=""></select></span>
    </div>
    <div id="logWrap">
      <div id="log"></div>
      <!-- Was ein allein Angekommener sonst nicht sieht: dass jetzt jemand
           dazukommen muss. Liegt ueber dem leeren Verlauf und verschwindet,
           sobald die erste Nachricht da ist. -->
      <div id="leer" class="leer hide">
        <div class="leer-inner">
          <p class="leer-titel" id="t-leerTitel"></p>
          <p class="leer-text" id="t-leerText"></p>
          <button id="leerEinladen" class="primary"></button>
          <button id="leerDemo" class="secondary" type="button"></button>
        </div>
      </div>
    </div>
    <div id="err" class="err hide"></div>
    <div id="emojiPanel" class="emoji-panel hide">
      <div id="emojiTabs" class="emoji-tabs"></div>
      <div id="emojiGrid" class="emoji-grid"></div>
    </div>
    <!-- Zitat der Nachricht, auf die geantwortet wird - erscheint ueber
         dem Eingabefeld, bis gesendet oder mit ✕ verworfen. -->
    <div id="antwortBar" class="antwortbar hide">
      <div class="antwort-info">
        <span class="antwort-name" id="antwortName"></span>
        <span class="antwort-text" id="antwortText"></span>
      </div>
      <button id="antwortWeg" class="antwort-weg" type="button" aria-label="">✕</button>
    </div>
    <!-- "... schreibt gerade" - erscheint live, waehrend das Gegenueber tippt. -->
    <div id="tippt" class="tippt hide">
      <span id="tipptName"></span>
      <span class="tippt-dots"><i></i><i></i><i></i></span>
    </div>
    <div class="composer" id="composer">
      <button id="emojiBtn" class="emoji-btn" type="button" aria-expanded="false">🙂</button>
      <button id="bildBtn" class="mic-btn" type="button">📷</button>
      <button id="ortBtn" class="mic-btn" type="button">📍</button>
      <input id="bildInput" type="file" accept="image/*" class="datei-versteckt">
      <input id="bildKamera" type="file" accept="image/*" capture="environment" class="datei-versteckt">
      <textarea id="draft" rows="1"></textarea>
      <button id="dictBtn" class="mic-btn" type="button">🗣️</button>
      <button id="send" disabled></button>
    </div>
    </div>
  </section>

</div>

<script src="/i18n.js"></script>
<script src="/socket.io/socket.io.js"></script>
<script>
const LANGS = [
  ["de","Deutsch"],["de-CH","Deutsch (Schweiz)"],
  ["pt-PT","Português (Portugal)"],["pt-BR","Português (Brasil)"],
  ["en","English (UK)"],["en-US","English (US)"],
  ["es","Español (España)"],["es-419","Español (Latinoamérica)"],
  ["fr","Français"],["it","Italiano"],["nl","Nederlands"],["pl","Polski"],
  ["ru","Русский"],["uk","Українська"],["tr","Türkçe"],["ar","العربية"],
  ["zh","中文 (简体)"],["zh-TW","中文 (繁體)"],["ja","日本語"],["ko","한국어"],
  ["hi","हिन्दी"],["sv","Svenska"],["ro","Română"],["da","Dansk"],["no","Norsk"],
  ["fi","Suomi"],["cs","Čeština"],["hu","Magyar"],["el","Ελληνικά"],["he","עברית"],
  ["th","ไทย"],["vi","Tiếng Việt"],["id","Bahasa Indonesia"]
];
const RTL = new Set(["ar","he","fa","ur"]);
const $ = (id) => document.getElementById(id);
const T = (k, v) => window.LUMO_T.t(k, v);

// Sprachauswahl fuellen
for (const sel of [$("lang"), $("langSwitch")]) {
  sel.innerHTML = LANGS.map(([c,l]) => `<option value="${c}">${l}</option>`).join("");
}

// Browsersprache und letzte Eingaben vorbelegen
/* ------------------------------------------------------------------
   Umzug der Speicherschluessel von lumo auf diralo

   Wuerden die Schluessel einfach umbenannt, bekaeme jedes Geraet eine
   neue Kennung: Eigene alte Nachrichten waeren dann nicht mehr als
   eigene erkennbar und liessen sich nicht mehr fuer alle loeschen.
   Deshalb werden die alten Werte einmalig uebernommen. Die Zeile kann
   weg, sobald niemand mehr von der alten Fassung kommt.
------------------------------------------------------------------ */
(function umziehen() {
  const paare = [["lumo", "diralo"], ["lumo-device", "diralo-device"],
                 ["lumo-hidden", "diralo-hidden"], ["lumoEmoji", "diraloEmoji"],
                 ["lumo-sound", "diralo-sound"]];
  for (const [alt, neu] of paare) {
    try {
      if (localStorage.getItem(neu) === null) {
        const wert = localStorage.getItem(alt);
        if (wert !== null) localStorage.setItem(neu, wert);
      }
    } catch {}
  }
})();

const saved = JSON.parse(localStorage.getItem("diralo") || "{}");
function guessLang() {
  const full = (navigator.language || "en");
  const norm = full.replace("_", "-");
  const codes = LANGS.map(([c]) => c);
  // Erst die volle Kennung (pt-BR), dann die Basissprache, dann die erste passende Variante.
  if (codes.includes(norm)) return norm;
  const base = norm.slice(0, 2);
  if (codes.includes(base)) return base;
  const variant = codes.find((c) => c.startsWith(base + "-"));
  // Not-Nagel Englisch: versteht fast jeder, Deutsch nicht. Betrifft nur
  // Besucher, deren Geraetesprache gar nicht in der Liste steht.
  return variant || "en";
}
$("name").value = saved.name || "";
$("room").value = saved.room || "";
$("lang").value = saved.lang || guessLang();

/* Ueber einen Einladungslink gekommen? Dann steht der Chat schon fest.
   Das Feld bleibt sichtbar, damit man sieht, wo man landet - aber es
   ist gesetzt und muss nicht abgetippt werden. */
/* Zwei Dinge sieht nur der Browser: dass jemand ueber einen Link kam und
   dass jemand auf Einladen gedrueckt hat. Gezaehlt wird nichts weiter -
   keine Kennung, keine Adresse, nur "ist passiert". Geht es schief, ist
   es gleichgueltig. */
function melde(ereignis) {
  try {
    fetch("/api/zaehl", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ ereignis }),
      keepalive: true,
    }).catch(() => {});
  } catch {}
}

const eingeladen = codeAusLink();
if (eingeladen) {
  $("room").value = eingeladen;
  $("invitedNote").classList.remove("hide");
  melde("ueber_link");
} else if (!chatsLaden().length && !$("room").value) {
  /* Frischer Besucher ohne Link und ohne gemerkte Chats: schon einen Code
     ins Feld, damit niemand am leeren Feld haengt und "Chat betreten"
     sofort in einen eigenen Raum fuehrt, den man dann teilen kann. */
  $("room").value = neuerCode();
}

/* "Neuen Chat starten" nur zeigen, wenn das Feld leer ist. Steht schon ein
   Code drin (vorausgefuellt oder ueber einen Link), waere der Knopf daneben
   nur verwirrend - dann fuehrt "Chat betreten" ohnehin hinein. Bei leerem
   Feld (z.B. Rueckkehrer mit Chatliste) ist er der Weg zum neuen Chat. */
function neuChatKnopf() {
  $("newChat").classList.toggle("hide", Boolean($("room").value.trim()));
}
neuChatKnopf();
$("room").addEventListener("input", neuChatKnopf);

/* Die gemerkten Chats auf der Startseite anbieten. Ein Tippen genuegt. */
function zeigeStartListe() {
  const feld = $("meineChats");
  const liste = chatsLaden();
  if (!liste.length) { feld.classList.add("hide"); return; }
  feld.textContent = "";

  const kopf = document.createElement("p");
  kopf.className = "kopf";
  kopf.textContent = T("myChats");
  feld.appendChild(kopf);

  for (const c of liste.slice(0, 8)) {
    const zeile = document.createElement("div");
    zeile.className = "chat-zeile";
    const b = document.createElement("button");
    b.type = "button";
    b.className = "chat-offen";
    b.appendChild(document.createTextNode(chatAnzeige(c)));
    const neu = neuesStand[c.code] || 0;
    if (neu > 0) {
      const punkt = document.createElement("span");
      punkt.className = "neu";
      punkt.textContent = neu > 99 ? "99+" : String(neu);
      b.appendChild(punkt);
    }
    b.onclick = () => {
      $("room").value = c.code;
      $("enter").click();
    };
    zeile.appendChild(b);
    zeile.appendChild(chatWegKnopf(c, zeigeStartListe));
    feld.appendChild(zeile);
  }
  feld.classList.remove("hide");
}

$("newChat").onclick = () => {
  /* Direkt in einen frischen Chat - "einen neuen starten" soll genau das
     tun, nicht nur das Feld fuellen. */
  $("room").value = neuerCode();
  $("enter").click();
};

let socket, me = {};
/* Kennung dieser Fassung. Muss mit der Zahl in sw.js mitwandern, sonst
   laesst sich nicht mehr erkennen, welche Seite ein Geraet wirklich
   geladen hat. */
const BUILD = "v77";

let deviceId = localStorage.getItem("diralo-device");
if (!deviceId) {
  deviceId = "d-" + Math.random().toString(36).slice(2) + Date.now().toString(36);
  localStorage.setItem("diralo-device", deviceId);
}
const msgs = new Map();
const asked = new Set();


/* ------------------------------------------------------------------
   Oberflaeche in der Sprache, die jemand fuer seine Nachrichten waehlt.
------------------------------------------------------------------- */
function applyLanguage(code) {
  const L = window.LUMO_T;
  L.set(code);
  document.documentElement.lang = code;
  document.documentElement.dir = RTL.has(code.slice(0, 2)) ? "rtl" : "ltr";

  for (const key of ["tagline", "freeStart", "demoCap", "nameLabel", "langLabel", "roomLabel", "roomHint", "privacy",
                      "howTitle", "howStep1", "howStep2", "howStep3", "leerTitel", "leerText"]) {
    const el = $("t-" + key);
    if (el) el.textContent = L.t(key);
  }
  $("name").placeholder = L.t("namePlaceholder");
  $("room").placeholder = L.t("roomPlaceholder");
  $("enter").textContent = L.t("enter");
  $("draft").placeholder = L.t("write");
  $("send").textContent = L.t("send");
  $("dictBtn").title = L.t("dictateTitle");
  $("bildBtn").title = L.t("bildTitle");
  $("ortBtn").title = L.t("ortBtn");
  $("zurueckBtn").setAttribute("aria-label", L.t("back"));
  $("newChat").textContent = L.t("newChat");
  $("inviteBtn").textContent = L.t("invite");
  $("leerEinladen").textContent = L.t("invite");
  $("leerDemo").textContent = L.t("demoBtn");
  $("invitedNote").textContent = L.t("invitedTo");
  /* Die Fusszeilen-Links: Beschriftung folgt der App-Sprache. Der Link
     selbst bleibt, die Zielseite waehlt ihre Fassung dann selbst. */
  for (const [id, key] of [["f-impressum","fImpressum"],["f-daten","fDaten"],
                           ["f-agb","fAGB"],["f-widerruf","fWiderruf"],["f-preise","fPreise"]]) {
    const el = $(id); if (el) el.textContent = L.t(key);
  }
  /* Die Chatliste traegt uebersetzte Ueberschriften - sie muss also mit
     der Sprache mitwandern. */
  zeigeStartListe();
  updateBell();
  msgs.forEach(render);
}

$("lang").onchange = (e) => applyLanguage(e.target.value);

$("enter").onclick = () => {
  const name = $("name").value.trim() || "Gast";
  const lang = $("lang").value;
  /* Leeres Feld heisst "neuer, eigener Chat" - niemals ein gemeinsamer.
     Frueher landete man dann in "lobby", und solange nur Eingeladene
     hereinkamen, fiel das nicht auf. Ohne Zugangswort saessen dort zwei
     Fremde im selben Gespraech und laesen die Nachrichten des anderen. */
  const room = ($("room").value.trim() || neuerCode()).toLowerCase();
  localStorage.setItem("diralo", JSON.stringify({ name, lang, room }));
  me = { name, lang, room };
  start();
};

/* --------------------------------------------------------------------
   Zum Startbildschirm hinzufuegen

   Der Punkt, an dem die meisten verlorengehen: Wer den Chat nur im
   Browser offen hat, kommt am naechsten Tag nicht zurueck - und ohne
   installierte App gibt es auch keine Benachrichtigungen.

   Auf Android gibt uns der Browser mit beforeinstallprompt einen echten
   Installationsknopf. Auf iPhones gibt es das nicht; dort bleibt nur der
   Hinweis, wo man tippen muss.
-------------------------------------------------------------------- */
let installEreignis = null;
const schonInstalliert = () =>
  window.matchMedia("(display-mode: standalone)").matches || window.navigator.standalone === true;
const istIos = () =>
  /iphone|ipad|ipod/i.test(navigator.userAgent) ||
  (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);

window.addEventListener("beforeinstallprompt", (e) => {
  e.preventDefault();          /* sonst zeigt Chrome seinen eigenen Balken */
  installEreignis = e;
  zeigeInstallBalken();
});

window.addEventListener("appinstalled", () => {
  $("installBar").classList.add("hide");
  try { localStorage.setItem("diralo-install", "fertig"); } catch {}
});

function installBalkenWeg(dauerhaft) {
  $("installBar").classList.add("hide");
  if (dauerhaft) { try { localStorage.setItem("diralo-install", "spaeter"); } catch {} }
}

/* Nach der ersten gesendeten Nachricht - Text wie Bild - einmal den
   Installationshinweis anbieten. Kurz verzoegert, damit er nicht abrupt
   ueber die gerade gesendete Nachricht springt. */
let beitragGesehen = false;
function installNachBeitrag() {
  if (beitragGesehen) return;
  beitragGesehen = true;
  setTimeout(zeigeInstallBalken, 1500);
}

function zeigeInstallBalken() {
  if (schonInstalliert()) return;
  if ($("chat").classList.contains("hide")) return;   /* erst im Chat */
  try { if (localStorage.getItem("diralo-install")) return; } catch {}
  if (!installEreignis && !istIos()) return;          /* sonst nichts anzubieten */

  $("installTitle").textContent = T("installTitle");
  $("installLater").textContent = T("later");
  if (installEreignis) {
    $("installGo").textContent = T("installBtn");
    $("installGo").classList.remove("hide");
    $("installHint").classList.add("hide");
  } else {
    /* iPhone: kein Knopf moeglich, nur der Weg ueber Teilen. */
    $("installGo").classList.add("hide");
    $("installHint").textContent = T("installIos");
    $("installHint").classList.remove("hide");
  }
  $("installBar").classList.remove("hide");
}

$("installLater").onclick = () => installBalkenWeg(true);
$("installGo").onclick = async () => {
  const e = installEreignis;
  installEreignis = null;
  installBalkenWeg(false);
  if (!e) return;
  try {
    await e.prompt();
    const { outcome } = await e.userChoice;
    /* Abgelehnt? Dann nicht noch einmal fragen. */
    if (outcome !== "accepted") { try { localStorage.setItem("diralo-install", "abgelehnt"); } catch {} }
  } catch { /* Browser hat es verweigert - dann eben nicht. */ }
};

function start() {
  $("setup").classList.add("hide");
  $("chat").classList.remove("hide");
  demoAus();
  antwortLoeschen();
  versteckeTippt();
  aktualisiereLeer();
  /* Der Installationshinweis kommt nicht mehr nach einem Timer, sondern
     erst nach der ersten gesendeten Nachricht (siehe installNachBeitrag):
     dann hat die Person den Wert erlebt und installiert eher. */
  chatMerken(me.room);
  gelesenSetzen(me.room);
  zeigeRaumLabel();
  $("langSwitch").value = me.lang;

  /* Schon verbunden? Das passiert, wenn man ueber den Zurueck-Knopf auf
     die Startseite ging und erneut einen Chat betritt. Dann den
     vorhandenen Socket wiederverwenden - ein zweiter wuerde doppelt
     empfangen und Verbindungen liegenlassen. Nur Verlauf leeren und in
     den (evtl. neuen) Raum beitreten. */
  if (socket) {
    $("log").textContent = "";
    msgs.clear();
    asked.clear();
    aktualisiereLeer();
    versteckeQuotaLeiste();
    socket.emit("join", {
      roomCode: me.room, name: me.name, lang: me.lang, device: deviceId,
      build: BUILD,
      speech: Boolean(window.SpeechRecognition || window.webkitSpeechRecognition),
    });
    return;
  }

  socket = io();
  socket.on("connect", () => {
    socket.emit("join", {
      roomCode: me.room, name: me.name, lang: me.lang, device: deviceId,
      /* Nur zwei Angaben zur Fehlersuche: welche Fassung der Seite hier
         laeuft, und ob der Browser ueberhaupt mitschreiben kann. Kein
         Geraetename, keine Kennung - das steht sonst gleich in /health. */
      build: BUILD,
      speech: Boolean(window.SpeechRecognition || window.webkitSpeechRecognition),
    });
    /* Beim Start erneut anmelden, damit Raum, Name und Sprache aktuell bleiben. */
    if (soundOn() && "Notification" in window && Notification.permission === "granted") {
      registerPush().catch(() => {});
    }
  });

  socket.on("history", (list) => { list.forEach((m) => add(m, false)); aktualisiereLeer(); gelesenMelden(); });
  socket.on("message", (m) => {
    versteckeTippt();
    add(m, true);
    if (document.visibilityState === "visible") { gelesenSetzen(me.room); gelesenMelden(); }
  });
  /* Das Gegenueber tippt gerade - kurz "... schreibt" zeigen. */
  socket.on("tippt", ({ name }) => { zeigeTippt(name); });
  /* Das Gegenueber hat den Chat offen und alles bis "bis" gesehen - meine
     eigenen Nachrichten bis dahin bekommen die Lese-Haken. */
  socket.on("gelesen", ({ bis }) => {
    const t = Number(bis); if (!t) return;
    msgs.forEach((m) => {
      if (m.device === deviceId && !m.gelesen && m.at <= t) { m.gelesen = true; render(m); }
    });
  });
  socket.on("deleteFailed", () => { showErr(T("delFailed")); });
  socket.on("deleted", ({ id }) => {
    const m = msgs.get(id);
    if (!m) return;
    m.deleted = true; m.text = ""; m.tr = {}; m.audioSeconds = null; m.open = false;
    render(m);
  });
  socket.on("system", (ev) => {
    /* Zu viele Chatwechsel in kurzer Zeit - die Bremse gegen das
       Durchprobieren von Codes. Einen normalen Nutzer trifft das kaum;
       wenn doch, soll er wissen, warum, statt vor einer stummen App zu
       sitzen. */
    if (ev && ev.type === "tooManyJoins") { showErr(T("tooManyJoins")); return; }
    const d = document.createElement("div");
    d.className = "system";
    d.textContent = typeof ev === "string" ? ev : T(ev.type, { name: ev.name });
    $("log").appendChild(d); scrollDown();
  });
  socket.on("lang", ({ id, lang }) => {
    const m = msgs.get(id); if (!m) return;
    m.lang = lang; render(m);
  });
  socket.on("translated", ({ id, lang, text }) => {
    const m = msgs.get(id); if (!m) return;
    m.tr[lang] = text; render(m);
  });
  socket.on("translationError", ({ id }) => {
    showErr(T("errTranslate"));
    const m = msgs.get(id); if (m) { m.failed = true; render(m); }
  });
  /* Text im Bild: fertige Uebersetzung (leerer Text = kein Text gefunden). */
  socket.on("bildTextFertig", ({ id, lang, text }) => {
    const m = msgs.get(id); if (!m) return;
    m.bildTr = m.bildTr || {};
    m.bildTr[lang] = String(text || "");
    m.bildLaeuft = false;
    if (lang === me.lang) render(m);
  });
  socket.on("bildTextFehler", ({ id, lang }) => {
    const m = msgs.get(id); if (!m) return;
    m.bildLaeuft = false;
    if (lang === me.lang) { showErr(T("errTranslate")); render(m); }
  });
  /* Aussprache-Hilfe fertig/fehlgeschlagen - nur die Lautschrift in der
     eigenen Sprache uebernehmen und ein offenes Aussprache-Fenster fuellen. */
  socket.on("ausspracheFertig", ({ id, lang, text }) => {
    if (lang !== me.lang) return;
    const m = msgs.get(id); if (!m) return;
    m.lautschrift = String(text || "");
    ausspracheAktualisieren(m);
  });
  socket.on("ausspracheFehler", ({ id, lang }) => {
    if (lang !== me.lang) return;
    const m = msgs.get(id); if (!m) return;
    m.lautschriftFehler = true;
    ausspracheAktualisieren(m);
  });
  socket.on("tooFast", () => {
    showErr(T("errTooFast"));
    /* Die Nachricht wurde nicht angenommen - den Text zurueck ins Feld,
       damit niemand neu tippen muss. */
    if (!draft.value.trim() && lastSent) {
      draft.value = lastSent;
      draft.style.height = "auto";
      draft.style.height = Math.min(draft.scrollHeight, 120) + "px";
      $("send").disabled = false;
      composerButtons();
    }
  });
  socket.on("quotaReached", ({ id, grund }) => {
    /* Zwei verschiedene Grenzen, zwei verschiedene Antworten. Die
       Tagesgrenze geht morgen vorbei - da reicht ein Hinweis. Die
       Monatsgrenze geht nicht vorbei, und sie ist der Moment, in dem
       jemand entscheidet, ob er bezahlt. */
    if (grund === "monat") zeigeQuotaLeiste();
    else showErr(T("errQuota"));
    const m = msgs.get(id); if (m) { m.failed = true; m.bildLaeuft = false; render(m); }
  });
  /* Antwort des Probe-Partners: kommt fertig mit Uebersetzung, damit sie
     ohne "need"-Runde sofort in der Sprache des Besuchers erscheint. */
  socket.on("demoAntwort", ({ text, tr, lang }) => {
    if (!demoAktiv) return;
    demoTippt(false);
    const t = String(text || "");
    const uebersetzt = (tr && tr[me.lang]) ? tr[me.lang] : t;
    add({ id: "demo-p-" + Date.now(), device: "demo", name: T("demoName"),
          lang: lang || demoPartnerLang, text: t, tr: { [me.lang]: uebersetzt } }, false);
    /* Nach ein paar Runden sanft zum echten Chat schubsen. */
    if (demoRunden === 2) demoSystemzeile(T("demoNudge"));
  });
  socket.on("demoFehler", () => { demoTippt(false); showErr(T("errTranslate")); });
}

$("langSwitch").onchange = (e) => {
  me.lang = e.target.value;
  localStorage.setItem("diralo", JSON.stringify(me));
  socket.emit("setLang", { lang: me.lang });
  applyLanguage(me.lang);
  if (soundOn()) registerPush().catch(() => {});
};

/* Zurueck zur Startseite - von dort kann man einen neuen Chat starten,
   die eigene Liste sehen oder installieren. Die Verbindung bleibt bestehen,
   damit Benachrichtigungen weiterlaufen; betritt man erneut einen Chat,
   nutzt start() denselben Socket weiter. */
function zurStartseite() {
  $("chat").classList.add("hide");
  $("setup").classList.remove("hide");
  $("installBar").classList.add("hide");
  versteckeQuotaLeiste();
  schliesseSheet();
  $("room").value = "";
  if (me.name) $("name").value = me.name;
  if (me.lang) $("lang").value = me.lang;
  zeigeStartListe();
}
$("zurueckBtn").onclick = zurStartseite;

function add(m, live) {
  if (msgs.has(m.id)) return;
  /* Fuer mich geloescht: taucht auch nach einem Neustart nicht wieder
     auf, die Kennung liegt im Browser. */
  if (verborgen.has(m.id)) return;
  m.live = Boolean(live) && m.device !== deviceId;   // eigene Nachrichten nie melden
  msgs.set(m.id, m);
  const row = document.createElement("div");
  row.id = "m" + m.id;
  row.className = "row " + (m.device === deviceId ? "mine" : "theirs");
  row.innerHTML = '<div class="bubble"></div><div class="meta"></div>';

  /* Wie bei WhatsApp: Die Nachricht selbst antippen oeffnet das Menue.
     Klicks auf den Abspieler oder einen Knopf darin sind ausgenommen -
     sonst liesse sich eine Sprachnachricht nicht mehr starten. */
  const blase = row.querySelector(".bubble");
  blase.style.cursor = "pointer";
  blase.onclick = (e) => {
    /* Ein Tippen aufs Bild vergroessert es, oeffnet aber nicht das Menue -
       sonst kaeme beides zugleich. Das Menue erreicht man beim Bild ueber
       die Namenszeile darunter. */
    if (e.target.closest("audio, button, a, .foto")) return;
    zeigeMenue(m);
  };
  $("log").appendChild(row);
  render(m);
  scrollDown();
  aktualisiereLeer();
}

/* Der Hinweis im leeren Chat: sichtbar, solange keine Nachricht da ist. */
function aktualisiereLeer() {
  const istLeer = msgs.size === 0;
  const leer = $("leer");
  if (leer) leer.classList.toggle("hide", !istLeer);
  /* Solange die Mitte einlaedt, waere der Einladen-Knopf oben doppelt. */
  $("inviteBtn").classList.toggle("hide", istLeer);
}

/* Standort in eine Blase setzen: eine antippbare Karte. Tippen oeffnet
   die Koordinaten in der Karten-App (Google Maps) - bewusst in einem
   neuen Tab, denn eine Karte gehoert nicht in unser Overlay, und der
   Empfaenger will sie ja wirklich oeffnen. */
function ortEinsetzen(m, bubble) {
  const karte = document.createElement("a");
  karte.className = "ortkarte";
  karte.href = "https://www.google.com/maps?q=" + m.ort.lat + "," + m.ort.lng;
  karte.target = "_blank";
  karte.rel = "noopener";
  const pin = document.createElement("span");
  pin.className = "ortpin";
  pin.textContent = "📍";
  const txt = document.createElement("span");
  const titel = document.createElement("b");
  titel.textContent = T("ortShared");
  const link = document.createElement("span");
  link.className = "ortlink";
  link.textContent = T("ortOpen");
  txt.appendChild(titel);
  txt.appendChild(link);
  karte.appendChild(pin);
  karte.appendChild(txt);
  bubble.appendChild(karte);
}

/* Das Bild in eine Blase setzen. Tippen zeigt es gross im eigenen
   Overlay - nicht in einem neuen Tab, sonst kaeme man in der
   installierten App nicht mehr zurueck. */
function bildEinsetzen(m, bubble) {
  const img = document.createElement("img");
  img.className = "foto";
  img.loading = "lazy";
  img.alt = "";
  img.src = "/medien/" + encodeURIComponent(m.id);
  img.onclick = (e) => { e.stopPropagation(); zeigeBildGross(m); };
  bubble.appendChild(img);

  /* Text IM Bild uebersetzen (Schild, Screenshot, Brief ...). Auf Anfrage,
     weil das Sehen mehr kostet. Ergebnis haengt an der Nachricht, ein
     leerer Text heisst "kein Text gefunden". */
  const fertig = m.bildTr && Object.prototype.hasOwnProperty.call(m.bildTr, me.lang);
  if (fertig) {
    const t = m.bildTr[me.lang];
    const box = document.createElement("div");
    box.className = "bildtext" + (t.trim() ? "" : " leer");
    box.dir = t.trim() && RTL.has(me.lang) ? "rtl" : "auto";
    box.textContent = t.trim() ? t : T("bildTextLeer");
    bubble.appendChild(box);
  } else if (m.bildLaeuft) {
    const w = document.createElement("div");
    w.className = "bildtext waiting";
    w.textContent = T("translating");
    bubble.appendChild(w);
  } else {
    const btn = document.createElement("button");
    btn.type = "button";
    btn.className = "bildtext-btn";
    btn.textContent = T("bildTextBtn");
    btn.onclick = (e) => {
      e.stopPropagation();
      m.bildLaeuft = true;
      render(m);
      socket.emit("bildText", { id: m.id, lang: me.lang });
    };
    bubble.appendChild(btn);
  }
}

/* Vollbild-Ansicht eines Bildes. Schliesst per Tippen und - wichtig auf
   dem Handy - auch ueber die Zurueck-Geste: dazu legen wir einen
   Verlaufseintrag an und hoeren auf popstate, statt die Seite zu
   verlassen. */
function zeigeBildGross(m) {
  const overlay = document.createElement("div");
  overlay.className = "lightbox";
  const gross = document.createElement("img");
  gross.src = "/medien/" + encodeURIComponent(m.id);
  gross.alt = "";
  overlay.appendChild(gross);
  const zu = document.createElement("button");
  zu.type = "button";
  zu.className = "lightbox-zu";
  zu.setAttribute("aria-label", T("cancel"));
  zu.textContent = "✕";
  overlay.appendChild(zu);

  /* Loeschen dort anbieten, wo man das Bild anschaut - ueber die
     Namenszeile in der Blase findet es sonst niemand. Der Papierkorb
     schliesst die Ansicht und oeffnet das gewohnte Loesch-Menue. */
  const loesch = document.createElement("button");
  loesch.type = "button";
  loesch.className = "lightbox-loesch";
  loesch.setAttribute("aria-label", T("options"));
  loesch.textContent = "🗑";
  loesch.onclick = (e) => {
    e.stopPropagation();
    history.back();
    setTimeout(() => zeigeMenue(m), 60);
  };
  overlay.appendChild(loesch);

  const weg = () => {
    overlay.remove();
    window.removeEventListener("popstate", weg);
  };
  /* Tippen schliesst ueber die Historie - so verhaelt sich die
     Zurueck-Geste genauso und verlaesst nicht die App. */
  overlay.onclick = () => history.back();
  history.pushState({ lightbox: true }, "");
  window.addEventListener("popstate", weg);
  document.body.appendChild(overlay);
}

/* Uhrzeit einer Nachricht in der Locale des Lesers (24h/12h folgt der
   Sprache automatisch). Eine ungueltige Locale faellt still auf die
   Browser-Voreinstellung zurueck. */
function uhrzeit(at) {
  try {
    return new Date(at).toLocaleTimeString(me.lang || undefined, { hour: "2-digit", minute: "2-digit" });
  } catch {
    return new Date(at).toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" });
  }
}

function render(m) {
  const row = $("m" + m.id); if (!row) return;
  const bubble = row.querySelector(".bubble");
  const meta = row.querySelector(".meta");
  /* Geloeschtes hat keinen Inhalt mehr - weder uebersetzen noch
     abspielen, nur der Hinweis bleibt. */
  if (m.deleted) {
    bubble.textContent = "";
    const s = document.createElement("span");
    s.className = "deleted";
    s.textContent = T("deletedNote");
    bubble.appendChild(s);
    meta.textContent = "";
    const wer = document.createElement("span");
    wer.textContent = m.name;
    meta.appendChild(wer);
    const zt = document.createElement("span");
    zt.className = "zeit";
    zt.textContent = uhrzeit(m.at);
    meta.appendChild(zt);
    return;
  }

  /* Ohne Text gibt es nichts zu uebersetzen - das betrifft
     Sprachnachrichten, bei denen die Mitschrift fehlgeschlagen ist.
     Sonst wartet die Blase ewig auf eine Uebersetzung von nichts. */
  const needs = m.lang !== me.lang && Boolean(m.text.trim());
  const shown = needs ? m.tr[me.lang] : m.text;

  if (needs && !shown && !m.failed) {
    const key = m.id + ":" + me.lang;
    if (!asked.has(key)) { asked.add(key); socket.emit("need", { id: m.id, lang: me.lang }); }
    bubble.textContent = "";
    if (m.replyTo) zitatEinsetzen(m, bubble);
    if (m.bild) bildEinsetzen(m, bubble);   /* Bild sofort, auch waehrend die Unterschrift uebersetzt wird */
    const w = document.createElement("span");
    w.className = "waiting";
    w.textContent = T("translating");
    bubble.appendChild(w);
  } else {
    const text = shown || m.text;
    bubble.textContent = "";
    if (m.replyTo) zitatEinsetzen(m, bubble);
    if (m.bild) bildEinsetzen(m, bubble);
    if (m.ort) ortEinsetzen(m, bubble);
    /* Sprachnachricht: Abspieler zuerst, die Mitschrift darunter. Ohne
       Mitschrift bleibt es beim Abspieler mit einem Hinweis. */
    if (m.audioSeconds != null) {
      const box = document.createElement("div");
      box.className = "voice";
      const a = document.createElement("audio");
      a.controls = true;
      a.preload = "none";
      a.src = "/medien/" + encodeURIComponent(m.id);
      const len = document.createElement("span");
      len.className = "voice-len";
      len.textContent = Math.floor(m.audioSeconds / 60) + ":" +
                        String(m.audioSeconds % 60).padStart(2, "0");
      box.appendChild(a);
      box.appendChild(len);
      bubble.appendChild(box);
      if (!m.text.trim()) {
        const hint = document.createElement("span");
        hint.className = "no-text";
        hint.textContent = T("noTranscript");
        bubble.appendChild(hint);
      }
    }
    const span = document.createElement("span");
    span.dir = RTL.has(me.lang) ? "rtl" : "auto";
    span.textContent = text;
    if (m.audioSeconds != null) span.className = "no-text";
    /* Beim reinen Standort gibt es keinen Text - dann keine leere Zeile. */
    if (text || !m.ort) bubble.appendChild(span);
    if (m.open) {
      const o = document.createElement("div");
      o.className = "orig";
      o.dir = RTL.has(m.lang) ? "rtl" : "auto";
      o.textContent = m.text;
      bubble.appendChild(o);
    }
    if (m.live) notify(m, text || (m.bild ? "📷" : (m.ort ? "📍" : text)));
  }

  meta.textContent = "";
  const who = document.createElement("span");
  who.textContent = m.name;
  meta.appendChild(who);
  /* Uhrzeit, wann die Nachricht geschrieben wurde - in der Sprache des
     Lesers (Format 24h/12h folgt der Locale). */
  const zeit = document.createElement("span");
  zeit.className = "zeit";
  zeit.textContent = uhrzeit(m.at);
  meta.appendChild(zeit);
  /* Lesebestaetigung: zwei Haken auf den EIGENEN Nachrichten, sobald das
     Gegenueber sie gesehen hat (wie bei WhatsApp). */
  if (m.device === deviceId && m.gelesen) {
    const haken = document.createElement("span");
    haken.className = "gelesen-haken";
    haken.textContent = "✓✓";
    haken.title = T("gelesen");
    meta.appendChild(haken);
  }
  /* Nur anbieten, wenn das Original ueberhaupt anders aussieht. Bei
     reinen Smiley-Nachrichten gibt der Server den Text unveraendert
     zurueck - da waere "Original: ..." ein Verweis auf dasselbe. */
  if (needs && shown && shown !== m.text) {
    const b = document.createElement("button");
    const nice = (LANGS.find(([c]) => c === m.lang) || [])[1] || m.lang.toUpperCase();
    b.textContent = m.open ? T("hideOriginal") : T("original", { lang: nice });
    b.onclick = () => { m.open = !m.open; render(m); };
    meta.appendChild(b);
  }
  /* Beim Bild ist das Antippen der Blase fuers Vergroessern belegt - das
     Menue (z.B. Loeschen) erreicht man deshalb ueber die Namenszeile. */
  if (m.bild) {
    meta.style.cursor = "pointer";
    meta.onclick = (e) => { if (e.target.closest("button, a")) return; zeigeMenue(m); };
  }
}

const draft = $("draft");

/* Wie bei WhatsApp: Bei leerem Feld steht der Sprechen-Knopf da,
   sobald Text drin ist, weicht er dem Senden-Knopf. Waehrend eines
   laufenden Diktats bleibt er stehen - man muss es ja beenden
   koennen. */
function composerButtons() {
  const hatText = Boolean(draft.value.trim());
  $("send").classList.toggle("hide", !hatText);
  $("dictBtn").classList.toggle("hide", (hatText && !diktiert) || !kannErkennen);
}

draft.addEventListener("input", () => {
  $("send").disabled = !draft.value.trim();
  composerButtons();
  draft.style.height = "auto";
  draft.style.height = Math.min(draft.scrollHeight, 120) + "px";
  if (draft.value.trim()) tipptSenden();
});

/* "... schreibt gerade": ein winziges Live-Signal, gedrosselt auf
   hoechstens alle zwei Sekunden. Nichts wird gespeichert. */
let letztesTippen = 0;
function tipptSenden() {
  if (!socket || !me.room || demoAktiv) return;
  const now = Date.now();
  if (now - letztesTippen > 2000) { letztesTippen = now; socket.emit("tippt"); }
}
let tipptTimer = null;
function zeigeTippt(name) {
  $("tipptName").textContent = (name || "") + " " + T("tippt");
  $("tippt").classList.remove("hide");
  clearTimeout(tipptTimer);
  tipptTimer = setTimeout(versteckeTippt, 3500);
}
function versteckeTippt() {
  clearTimeout(tipptTimer);
  $("tippt").classList.add("hide");
}
draft.addEventListener("keydown", (e) => {
  if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); sendMsg(); }
});
$("send").onclick = sendMsg;
$("antwortWeg").onclick = antwortLoeschen;

let lastSent = "";

function sendMsg() {
  /* Erst das Diktat beenden - sonst hoert es nach dem Senden weiter zu
     und schreibt in das gerade geleerte Feld. Das Beenden traegt auch
     das letzte Wort noch ein, deshalb steht es vor dem Auslesen. */
  if (diktiert) stoppeDiktat();
  const text = draft.value.trim();
  if (!text) return;
  lastSent = text;
  /* Bezug auf eine zitierte Nachricht, falls gerade geantwortet wird. */
  const replyTo = (antwortAuf && !antwortAuf.deleted) ? antwortAuf.id : null;
  antwortLoeschen();
  /* Im Probe-Chat geht die Nachricht an den KI-Partner, nicht in einen
     echten Raum. */
  if (demoAktiv) {
    demoSenden(text);
    draft.value = ""; draft.style.height = "auto"; $("send").disabled = true;
    composerButtons();
    return;
  }
  socket.emit("send", { text, replyTo });
  draft.value = ""; draft.style.height = "auto"; $("send").disabled = true;
  /* Das Feld ist wieder leer - also gehoeren Sprechen und Mikrofon
     zurueck an die Stelle des Senden-Knopfes. */
  composerButtons();
  installNachBeitrag();
}

/* ------------------------------------------------------------------
   Auf eine Nachricht antworten (zitieren). Die zitierte Nachricht wird
   ueber dem Eingabefeld gezeigt und in der gesendeten Blase oben klein
   wiederholt - in der Sprache des Lesers, weil das Zitat aus der schon
   uebersetzten Fassung kommt.
------------------------------------------------------------------- */
let antwortAuf = null;

/* Kurzer Text einer Nachricht fuers Zitat - Bild/Standort/Sprache mit
   Symbol, sonst die uebersetzte Fassung. */
function zitatText(m) {
  if (m.deleted) return T("deletedNote");
  if (m.ort) return "📍 " + T("ortShared");
  const inhalt = m.tr[me.lang] || m.text || "";
  if (m.bild) return "📷" + (inhalt ? " " + inhalt : "");
  if (m.audioSeconds != null) return "🎤" + (inhalt ? " " + inhalt : "");
  return inhalt;
}

function antwortSetzen(m) {
  antwortAuf = m;
  $("antwortName").textContent = m.name || "";
  $("antwortText").textContent = zitatText(m);
  $("antwortBar").classList.remove("hide");
  draft.focus();
}

function antwortLoeschen() {
  antwortAuf = null;
  $("antwortBar").classList.add("hide");
}

/* Das Zitat in eine Nachrichtenblase setzen. Tippen springt zur
   Originalnachricht und hebt sie kurz hervor. */
function zitatEinsetzen(m, bubble) {
  const orig = msgs.get(m.replyTo);
  const box = document.createElement("div");
  box.className = "zitat";
  const nm = document.createElement("span");
  nm.className = "z-name";
  nm.textContent = orig ? (orig.name || "") : "";
  const tx = document.createElement("span");
  tx.className = "z-text";
  tx.textContent = orig ? zitatText(orig) : T("replyGone");
  box.appendChild(nm);
  box.appendChild(tx);
  box.onclick = (e) => {
    e.stopPropagation();
    const row = orig ? $("m" + orig.id) : null;
    if (row) {
      row.scrollIntoView({ behavior: "smooth", block: "center" });
      row.classList.add("blink");
      setTimeout(() => row.classList.remove("blink"), 1200);
    }
  };
  bubble.appendChild(box);
}

/* Sprachnachrichten wurden am 14.09.2026 entfernt: Ohne Mitschrift
   blieben sie unuebersetzt, und genau dafuer gibt es Diralo. Das
   Abspielen schon verschickter Aufnahmen bleibt erhalten, ebenso die
   Schnittstelle auf dem Server - wer sie zurueckholen will, braucht
   nur wieder einen Knopf. Wer sprechen statt tippen will, nimmt das
   Diktat darunter. */

/* ------------------------------------------------------------------
   Diktieren

   Der andere Weg, und der einzige, der auf Android zuverlaessig laeuft:
   Hier hoert nur die Spracherkennung zu, es wird nichts aufgenommen.
   Damit streiten sich nicht zwei um das Mikrofon - genau daran ist die
   Mitschrift waehrend einer Sprachnachricht gescheitert.

   Der Text landet direkt im Eingabefeld und geht danach als ganz
   gewoehnliche Nachricht raus, wird also uebersetzt wie jede andere.
------------------------------------------------------------------ */
const dictBtn = $("dictBtn");
let diktiert = false, diktator = null;
let diktatBasis = "";  // was vor dem Diktat schon im Feld stand
let diktatFest = "";   // Ergebnis abgeschlossener Durchlaeufe
let diktatLauf = "";   // Ergebnis des laufenden Durchlaufs
let diktatSitzung = 0;     // laufende Nummer, sperrt Nachzuegler aus
let diktatLaeufe = 0;      // wie oft die Erkennung neu startete
let diktatErgebnisse = 0;  // wie viele Ergebnisse ankamen
let letzteForm = "";       // Form der letzten Ergebnisliste, nur Laengen
let festLaenge = 0;        // Zeichenzahl von diktatFest beim Beenden

/* Schneidet vom Anfang von "neu" weg, was am Ende von "alt" schon
   steht. Beim Neustart spielt Chrome den gepufferten Ton noch einmal
   durch die Erkennung - die neue Sitzung bringt das zuletzt Gesagte
   also erneut mit. Ohne dieses Abschneiden steht es doppelt da.

   Die Ueberlappung muss an einer Wortgrenze enden, sonst wuerde aus
   "das Sofa" faelschlich etwas abgeschnitten. */
/* Meldet nur, WIE das Diktat ausging - nie, was gesprochen wurde.
   Fehlerkuerzel, Zeichenzahl und die Form der Ergebnisliste reichen zur
   Fehlersuche und verraten nichts. Steht unter /health. */
function meldeSprache(info) {
  try { socket.emit("speechInfo", info); } catch {}
}

function ohneUeberlappung(alt, neu) {
  if (!alt || !neu) return neu;
  /* Wortweise vergleichen, nicht zeichenweise: Chrome schreibt das
     erste Wort eines Ergebnisses gross und setzt Satzzeichen - "Hallo"
     und "hallo" sind sonst zwei verschiedene Texte, und das Doppelte
     rutscht durch. */
  const putzen = (w) => w.toLowerCase().replace(/[.,!?;:„“”"»«]/g, "");
  const a = alt.trim().split(/\s+/);
  const b = neu.trim().split(/\s+/);
  const max = Math.min(a.length, b.length);
  for (let n = max; n >= 1; n--) {
    let gleich = true;
    for (let i = 0; i < n; i++) {
      if (putzen(a[a.length - n + i]) !== putzen(b[i])) { gleich = false; break; }
    }
    if (gleich) return b.slice(n).join(" ");
  }
  return neu;
}

/* Setzt das Feld aus den drei Teilen zusammen. Mehrfache Leerzeichen
   fallen weg, damit an den Nahtstellen keine Luecken entstehen. */
function diktatText(lose) {
  const lauf = ohneUeberlappung(diktatFest, diktatLauf);
  const teile = [diktatFest, lauf, lose || ""].filter((t) => t);
  return (diktatBasis + teile.join(" ")).replace(/\s{2,}/g, " ").trimStart();
}

function schreibeDiktatFest() {
  const l = ohneUeberlappung(diktatFest, diktatLauf.trim());
  diktatLauf = "";
  if (!l) return;
  diktatFest = (diktatFest + " " + l).trim();
}

const kannErkennen = Boolean(window.SpeechRecognition || window.webkitSpeechRecognition);

function starteDiktat(SR) {
  /* Jede Sitzung bekommt eine Nummer. Chrome liefert nach dem Ende einer
     Sitzung noch Ergebnisse nach - ohne diese Sperre schreibt eine
     abgeloeste Sitzung ihren Text ein zweites Mal fest, und aus einem
     "hallo" werden drei. */
  const meine = ++diktatSitzung;
  const aktuell = () => meine === diktatSitzung;
  try {
    diktator = new SR();
    diktator.lang = me.lang;
    diktator.continuous = true;
    diktator.interimResults = true;

    /* Der ganze Durchlauf wird jedes Mal neu zusammengesetzt, nie
       angehaengt. Chrome liefert bei jedem Ereignis auch schon fertige
       Woerter erneut mit - wer die anhaengt, bekommt aus einem "Hallo"
       drei. */
    diktator.onresult = (e) => {
      if (!aktuell()) return;   // Nachzuegler einer abgeloesten Sitzung
      diktatErgebnisse++;
      /* Die Eintraege der Liste sind auf Android nicht getrennt, sondern
         bauen aufeinander auf: "Hallo", dann "Hallo ich liebe", dann
         "Hallo ich liebe dich" - alle als endgueltig. Einfach
         aneinanderhaengen ergaebe alles dreimal. Deshalb wird auch hier
         abgeschnitten, was schon dasteht. */
      let fest = "", lose = "", form = "";
      for (let i = 0; i < e.results.length; i++) {
        const r = e.results[i];
        const t = ((r[0] && r[0].transcript) || "").trim();
        /* Nur die Form zur Fehlersuche: je Eintrag "F" oder "i" und die
           Zeichenzahl. Daran laesst sich ablesen, ob die Eintraege
           aufeinander aufbauen oder getrennt sind - ohne je zu
           uebertragen, was gesprochen wurde.

           Bewusst in dieser Schleife und ueber den Index: e.results ist
           nicht in jedem Browser durchlaufbar, ein Spread wirft dort
           eine Ausnahme - und die haette das Diktat mitgerissen. */
        form += (form ? "," : "") + (r.isFinal ? "F" : "i") + t.length;
        if (!t) continue;
        if (r.isFinal) {
          const neu = ohneUeberlappung(fest, t);
          if (neu) fest = (fest + " " + neu).trim();
        } else {
          const basis = (fest + " " + lose).trim();
          const neu = ohneUeberlappung(basis, t);
          if (neu) lose = (lose + " " + neu).trim();
        }
      }
      letzteForm = form.slice(0, 90);

      diktatLauf = fest;
      draft.value = diktatText(lose);
      /* Loest Hoehenanpassung und den Senden-Knopf mit aus. */
      draft.dispatchEvent(new Event("input"));
    };

    /* Wirft hier irgendetwas, bricht das Diktat sonst ab, ohne sich zu
       beschweren - genau das ist mit einem Spread ueber e.results
       passiert. Jetzt wird der Grund wenigstens gemeldet. */
    const rohesOnresult = diktator.onresult;
    diktator.onresult = (e) => {
      try { rohesOnresult(e); }
      catch (err) { meldeSprache({ diktat: true, error: "result:" + (err.name || "?") }); }
    };

    /* Auf Android endet die Erkennung nach jeder Pause von selbst. Was
       dieser Durchlauf ergeben hat, wird dabei festgeschrieben - der
       naechste faengt mit leerer Ergebnisliste an. */
    diktator.onend = () => {
      if (!aktuell() || !diktiert) return;
      diktatLaeufe++;
      schreibeDiktatFest();
      setTimeout(() => { if (diktiert && aktuell()) starteDiktat(SR); }, 120);
    };

    diktator.onerror = (e) => {
      meldeSprache({ diktat: true, error: e.error });
      if (e.error === "no-speech" || e.error === "aborted") return;
      stoppeDiktat();
      showErr(T("noTranscript") + " (" + e.error + ")");
    };

    diktator.onstart = () => meldeSprache({ diktat: true, gestartet: true });
    diktator.start();
  } catch (err) {
    meldeSprache({ diktat: true, error: "throw:" + (err.name || "?") });
    stoppeDiktat();
    showErr(T("errMic"));
  }
}

function stoppeDiktat() {
  diktiert = false;
  dictBtn.classList.remove("on");
  draft.placeholder = T("write");
  composerButtons();
  if (diktator) { try { diktator.stop(); } catch {} diktator = null; }
  /* Was der letzte Durchlauf ergeben hat, gehoert noch dazu. */
  schreibeDiktatFest();
  draft.value = diktatText("");
  draft.dispatchEvent(new Event("input"));
  meldeSprache({ diktat: true, ende: true, zeichen: diktatFest.length,
                 laeufe: diktatLaeufe, ergebnisse: diktatErgebnisse,
                 form: letzteForm, feld: draft.value.length });
}

function toggleDiktat() {
  if (diktiert) { stoppeDiktat(); draft.focus(); return; }
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!SR) { showErr(T("errMic")); return; }
  /* Schon Getipptes bleibt stehen, das Diktat haengt sich dahinter. */
  diktatBasis = draft.value.trim() ? draft.value.replace(/\s*$/, "") + " " : "";
  diktatFest = "";
  diktatLauf = "";
  diktatLaeufe = 0; diktatErgebnisse = 0; letzteForm = "";
  diktiert = true;
  dictBtn.classList.add("on");
  draft.placeholder = T("dictating");
  composerButtons();
  toggleEmoji(false);
  meldeSprache({ neu: true, diktat: true });
  starteDiktat(SR);
}

dictBtn.onclick = toggleDiktat;
composerButtons();

/* ------------------------------------------------------------------
   Bilder senden

   Das Bild wird im Browser verkleinert und neu als JPEG kodiert - das
   Neukodieren ueber die Leinwand wirft versteckte Daten (auch den
   Standort aus EXIF) automatisch weg. Erst dann geht es hoch, mit einer
   optionalen Unterschrift, die wie jeder Text uebersetzt wird.
------------------------------------------------------------------- */
const BILD_MAX = 2_500_000;   /* muss zur Grenze im Server passen */
const bildBtn = $("bildBtn"), bildInput = $("bildInput"), bildKamera = $("bildKamera");

/* iPhone-Sonderweg: In der installierten App (Startbildschirm) bleibt die
   Kamera beim *direkten* Aufruf ueber capture oft schwarz - eine
   Apple-Einschraenkung. Nimmt man capture weg, oeffnet iOS stattdessen die
   Auswahl mit "Foto aufnehmen", und ueber diesen Weg wird die Kamera
   normal freigeschaltet. Android bleibt beim direkten capture. */
if (istIos()) bildKamera.removeAttribute("capture");

/* Auf Geraeten mit Kamera zuerst fragen: aufnehmen oder aus der Galerie?
   Manche Handys bieten von sich aus nur die Galerie an - mit dem eigenen
   Kamera-Feld (capture) kommt wirklich die Kamera. Am Rechner (feiner
   Zeiger, kein Touch) gibt es keine Kamera; da direkt die Dateiauswahl. */
const hatKamera = (navigator.maxTouchPoints || 0) > 0 ||
                  (window.matchMedia && matchMedia("(pointer: coarse)").matches);

bildBtn.onclick = () => { if (hatKamera) zeigeBildQuelle(); else bildInput.click(); };

/* Standort teilen: den aktuellen Standort holen (der Browser fragt selbst
   um Erlaubnis) und als antippbare Karte verschicken. */
$("ortBtn").onclick = () => {
  if (!navigator.geolocation) { showErr(T("ortError")); return; }
  const btn = $("ortBtn");
  btn.disabled = true;
  navigator.geolocation.getCurrentPosition(
    (pos) => {
      btn.disabled = false;
      socket.emit("sendOrt", { lat: pos.coords.latitude, lng: pos.coords.longitude });
      installNachBeitrag();
    },
    () => { btn.disabled = false; showErr(T("ortError")); },
    { enableHighAccuracy: true, timeout: 10000, maximumAge: 60000 }
  );
};

function zeigeBildQuelle() {
  schliesseSheet();
  sheet = document.createElement("div");
  sheet.className = "sheet";
  const box = document.createElement("div");
  box.className = "sheet-inner";
  const kopf = document.createElement("p");
  kopf.className = "sheet-kopf";
  kopf.textContent = T("bildTitle");
  box.appendChild(kopf);
  const kam = document.createElement("button");
  kam.type = "button";
  kam.textContent = T("bildKamera");

function bildGewaehlt(inp) {
  const datei = inp.files && inp.files[0];
  inp.value = "";   /* damit dasselbe Bild danach erneut waehlbar ist */
  if (!datei) return;
  if (!datei.type.startsWith("image/")) { showErr(T("bildBad")); return; }
  verkleinereBild(datei)
    .then((res) => res ? zeigeBildVorschau(res) : showErr(T("bildFailed")))
    .catch(() => showErr(T("bildFailed")));
}
bildInput.onchange = () => bildGewaehlt(bildInput);
bildKamera.onchange = () => bildGewaehlt(bildKamera);

/* Das Bild zuverlaessig dekodieren. createImageBitmap decodiert das Foto
   fertig, bevor gezeichnet wird - genau das fehlte auf dem iPhone, wo die
   Leinwand sonst schwarz blieb - und versteht auch das iPhone-Format HEIC
   und die Aufnahme-Drehung (EXIF). Aeltere Browser bekommen den <img>-Weg,
   diesmal aber mit decode(), damit auch dort nichts Schwarzes entsteht. */
async function ladeBild(datei) {
  if (window.createImageBitmap) {
    try {
      const bmp = await createImageBitmap(datei, { imageOrientation: "from-image" });
      return { bild: bmp, w: bmp.width, h: bmp.height, weg: () => bmp.close && bmp.close() };
    } catch { /* faellt auf den <img>-Weg zurueck */ }
  }
  const url = URL.createObjectURL(datei);
  const img = new Image();
  try {
    img.src = url;
    if (img.decode) await img.decode();
    else await new Promise((res, rej) => { img.onload = res; img.onerror = rej; });
    return { bild: img, w: img.naturalWidth, h: img.naturalHeight, weg: () => URL.revokeObjectURL(url) };
  } catch { URL.revokeObjectURL(url); return null; }
}

async function verkleinereBild(datei) {
  const q0 = await ladeBild(datei);
  if (!q0 || !q0.w || !q0.h) { if (q0) q0.weg(); return null; }
  try {
    const max = 1600;
    let w = q0.w, h = q0.h;
    if (w > max || h > max) {
      const f = Math.min(max / w, max / h);
      w = Math.round(w * f); h = Math.round(h * f);
    }
    const c = document.createElement("canvas");
    c.width = w; c.height = h;
    c.getContext("2d").drawImage(q0.bild, 0, 0, w, h);
    q0.weg();
    let q = 0.82, dataUrl = c.toDataURL("image/jpeg", q);
    /* Notfalls die Qualitaet senken, bis es unter die Grenze passt. */
    while (dataUrl.length * 0.75 > BILD_MAX && q > 0.4) {
      q -= 0.12; dataUrl = c.toDataURL("image/jpeg", q);
    }
    if (!dataUrl || dataUrl.length < 200) return null;
    return { dataUrl, base64: dataUrl.split(",")[1] };
  } catch { q0.weg(); return null; }
}

async function sendeBild(base64, caption, knopf) {
  try {
    const r = await fetch("/api/bild", {
      method: "POST",
